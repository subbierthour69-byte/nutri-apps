<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriClin · Nutrición clínica</title>
<meta name="theme-color" content="#0e8f78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutriClin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  NutriClin v2.1 — un solo archivo, sin dependencias ni servidor.
  DESPLIEGUE: sube como index.html a un repo y activa Settings → Pages → main / root.
  DATOS: localStorage del navegador (locales y privados). Exporta respaldos en Ajustes.
  PEDIATRÍA: tablas L-M-S oficiales de la CDC (NCHS 2000) incluidas en este script.
  NOVEDADES v2.2: app instalable que funciona SIN INTERNET (sw.js + manifest.webmanifest + iconos: sube los 7 archivos
  juntos a la raíz del repo) · botón "Historial clínico (Word)" en Pacientes, Historia clínica, Datos generales y Ajustes.
  NOVEDADES v2.1: semáforo (bajo/óptimo/elevado) en composición corporal · plan de equivalentes
  con distribución por tiempo de comida al lado y % de adecuación en colores.
-->
<style>
/* ===== Tokens claro/oscuro ===== */
:root{--bg:#eef7f6;--card:#fff;--tx:#15303a;--mut:#5f7782;--pri:#0e8f78;--pri2:#2563eb;--acc:#fef08a;--grad:linear-gradient(135deg,#0e8f78,#14b8a6 45%,#2563eb);--bd:#d3e5e8;--side:#0b5a78;--bad:#c8432f;--warn:#d98a14;--ok:#1f9d5a}
:root[data-theme=dark]{--bg:#0a1a24;--card:#102b38;--tx:#e3f1f2;--mut:#93b0b8;--bd:#1f4352;--side:#06293a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}a{color:var(--pri)}
/* ===== Menú lateral ===== */
aside{width:236px;background:linear-gradient(180deg,#0e8f78 0%,#0f7a96 45%,#2563eb 100%);color:#eafffb;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:left .2s;z-index:20}
.brand{font-size:18px;font-weight:700;color:#fff;padding:4px 10px 10px}
.sec{font-size:11px;color:#c7f9ee;margin:16px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover{background:#ffffff1f}nav a.on{background:#ffffff33;color:#fff;font-weight:700;box-shadow:inset 4px 0 0 var(--acc)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ===== Contenido ===== */
main{flex:1;min-width:0;padding:20px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top h1{flex:1}#title{background:linear-gradient(90deg,#0e8f78,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}:root[data-theme=dark] #title{background:linear-gradient(90deg,#5eead4,#93c5fd);-webkit-background-clip:text;background-clip:text}
#burger{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:8px 14px;background:var(--grad);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right}.wrap{overflow-x:auto}
td input{padding:4px 6px;min-width:70px}
.kpi{font-size:24px;font-weight:700;margin:0}.kpi small{font-size:12px;color:var(--mut);font-weight:400;display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);margin:2px;cursor:pointer;font-size:12px;background:var(--bg)}
.chip.on{background:var(--grad);border-color:var(--pri);color:#fff}
.msg{padding:12px;border-radius:8px;background:#d98a1422;border:1px solid var(--warn)}
tr.h td{background:var(--bg);font-weight:700;color:var(--pri)}
.bar{height:8px;border-radius:4px;background:var(--bd);min-width:90px}.bar i{display:block;height:100%;border-radius:4px}
.pw{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pie{width:230px;height:230px}.sl{transition:stroke-width .15s;cursor:pointer}.sl:hover{stroke-width:9}
.lg div{margin:6px 0}.lg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
#toast{position:fixed;bottom:18px;right:18px;background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50}
.av{border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;font-weight:700;color:#fff;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.gap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btnlike{display:inline-flex;align-items:center;margin:0;padding:4px 9px;font-size:12px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);cursor:pointer}
nav a.on{background:#ffffff33;color:#fff}
/* ===== Semáforo (v2.1): píldoras de estado y plan de equivalentes ===== */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:12px;white-space:nowrap;line-height:1.5}
.eqwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.eqt td,.eqt th{padding:4px 6px}
.eqt input{width:58px;min-width:0;padding:3px 5px;text-align:right}
.eqt .sp{border-left:2px solid var(--bd)}
.eqt tr.h td{border-top:2px solid var(--pri)}
.eqt thead th{background:var(--grad);color:#fff}
.eqside{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--bg)}
.eqside input{background:var(--card)}
.eqsum{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--pri);margin-top:12px;padding-top:6px;z-index:5}
.eqsum th{background:var(--grad);color:#fff}
details.dd{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}details.dd summary{cursor:pointer;font-weight:600}
/* ===== Dietas dinámicas: pestañas de colores ===== */
.dtabs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.dtab{flex:1 1 190px;max-width:270px;flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:18px 14px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:18px;font-weight:800;box-shadow:0 4px 12px #0003;opacity:.7;transform:scale(.96);transition:transform .15s,opacity .15s,box-shadow .15s}
.dtab:hover{opacity:1}
.dtab.on{opacity:1;transform:scale(1.04);box-shadow:0 8px 22px #0004,0 0 0 3px var(--card),0 0 0 6px var(--a)}
.dtab .de{font-size:32px;line-height:1.1}.dtab small{font-size:12px;font-weight:600}
.dsec{border-top:6px solid var(--a);background-image:linear-gradient(180deg,color-mix(in srgb,var(--a) 9%,transparent),transparent 140px)}
button.pr{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.dsec .chip.on{background:var(--a);border-color:var(--a)}
/* ===== Selector de modo ===== */
#picker{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#0b6b63,#0f5a99 55%,#1e40af);padding:20px;overflow:auto}
#picker[hidden]{display:none}
.pk{max-width:780px;text-align:center;color:#e8f5f2}.pk h1{font-size:36px;color:#fff;margin-bottom:6px}
.pkg{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.pkc{flex:1 1 290px;max-width:350px;flex-direction:column;justify-content:center;gap:8px;padding:30px 22px;border-radius:24px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:24px;box-shadow:0 12px 32px #0007;transition:transform .15s;position:relative;text-align:center}
.pkc:hover,.pkc:focus-visible{transform:translateY(-5px) scale(1.03)}
.pke{font-size:56px;line-height:1}.pkc small{font-size:13px;font-weight:400;opacity:.95;line-height:1.4}
.pkc em{position:absolute;top:12px;right:14px;font-size:11px;font-style:normal;background:#0005;padding:2px 9px;border-radius:99px}
.msub{font-size:12px;color:#d8fff6;font-weight:500;padding:0 10px}
/* ===== Historia clínica institucional: tablas formales, casillas e impresión ===== */
.ftw{border:1px solid var(--bd);border-radius:10px;overflow-x:auto}
.ft{border-collapse:collapse;width:100%}
.ft th{background:var(--grad);color:#fff;font-weight:600;padding:8px 10px;text-align:left;border:0;font-size:13px}
.ft td{padding:6px 10px;border:0;border-bottom:1px solid var(--bd);vertical-align:top;white-space:normal}
.ft tr:last-child td{border-bottom:0}
.ft input:not([type=checkbox]),.ft textarea{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%;min-width:0}
.ft input:not([type=checkbox]):hover,.ft textarea:hover{border-color:var(--bd)}
.ft input:not([type=checkbox]):focus,.ft textarea:focus{background:var(--card);border-color:var(--pri)}
.ft textarea{min-height:46px}
.ft input.out{border-color:var(--bad)!important;background:#c8432f1f!important;color:var(--bad);font-weight:700}
.ck{display:inline-flex;align-items:center;gap:6px;margin:3px 16px 3px 0;font-size:13px;color:var(--tx);cursor:pointer}
.ck input{width:auto}
.q{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:5px 0}
.hcc{margin-bottom:10px;padding:12px 14px}.hcc h2{margin-bottom:8px}
.q input.il{width:190px;flex:none}.q input.il{padding:3px 8px}.q input.il.xs{width:64px}.q input.il.s{width:120px}.q input.il.l{width:340px;max-width:100%}
.fic{display:grid;grid-template-columns:repeat(12,1fr);gap:6px 12px}.fic>div{min-width:0}
@media screen and (max-width:900px){.fic{grid-template-columns:repeat(6,1fr)}.fic>div{grid-column:span 3!important}}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.hl{display:flex;gap:12px;align-items:center;justify-content:flex-start}.hr{display:flex;justify-content:flex-end}
.hcc h2.ht{text-align:center;font-size:26px!important;margin:0!important;color:var(--tx)!important;white-space:nowrap}
.lgs{height:38px;display:flex;align-items:center;justify-content:center;position:relative}.lgs label{display:flex;height:100%;align-items:center;justify-content:center;margin:0;cursor:pointer}
.lgs img{height:100%;width:auto;display:block}
.lgph{width:100%;height:100%;border:1.5px dashed var(--bd);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--mut);line-height:1.2}.lgph small{font-size:10px;opacity:.8}
.lx{position:absolute;top:-6px;right:-6px;padding:0 6px!important;font-size:11px}
.hmeta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
@media(max-width:1000px){.lgs{height:30px}}
@media(max-width:700px){.hdr{grid-template-columns:1fr;justify-items:center}.hl,.hr{justify-content:center;flex-wrap:wrap}}
.ic .q{margin:1px 0;gap:2px 14px}.ic .q input.il{padding:3px 8px}.ic p{margin:4px 0 0!important}.ic .ck{margin-top:1px;margin-bottom:1px}
.keep{break-inside:avoid}
.free{border:0!important;background:transparent!important;box-shadow:none;resize:none;overflow:hidden;padding:4px 2px!important;width:100%;min-height:54px;line-height:1.5}
.free:hover{background:#0e8f7810!important}.free:focus{outline:none;background:#2563eb12!important}
.sig{max-width:380px;margin:22px 0 0 auto;text-align:center}.sig input.free{text-align:center;min-height:0}
.sigl{border-top:1px solid var(--tx);margin-top:2px;padding-top:3px;font-size:12px;font-weight:600}
.ftw.sm{display:inline-block;max-width:100%}.ft.sm{width:auto}.ft.sm td,.ft.sm th{padding:2px 8px;font-size:12px}.ft.sm input:not([type=checkbox]){width:56px!important;text-align:center;font-size:12px;padding:2px 4px}
.ft.an td,.ft.an th{padding:2px 8px}.ft.an td+td,.ft.an th+th,.ft.sm td+td,.ft.sm th+th{text-align:center}.ft.an input:not([type=checkbox]){width:88px!important}.ft.an input.dt{width:96px!important}
.ft.rec td{border-bottom:1px solid #9fb0ab}.ft.rec td+td,.ft.rec th+th{border-left:1px solid #9fb0ab}
@media print{
 @page{size:letter;margin:7mm 8mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 aside,.top,#toast,#picker,#welcome,.noprint{display:none!important}
 body{display:block;background:#fff;color:#000;font-size:9.5px;line-height:1.22}main{padding:0}
 .card{border:0!important;border-top:.75pt solid #777!important;border-radius:0;box-shadow:none;margin:0 0 3px;padding:3px 0;break-inside:auto;background:none}
 .hcc{padding:3px 0;margin:0 0 3px}.hcc h2{color:#000!important;font-size:11px!important;margin:0 0 2px;break-after:avoid}
 .ftw{border:.5pt solid #888;border-radius:0;break-inside:avoid}
 .ft th{background:#e6e6e6!important;color:#000;font-size:9px;padding:1px 4px;border-bottom:.5pt solid #888}
 .ft td{padding:1px 4px;border-bottom:.5pt solid #bbb}
 .ft.rec td{border-bottom:.5pt solid #777}.ft.rec td+td,.ft.rec th+th{border-left:.5pt solid #777}
 .ft.sm td,.ft.sm th{padding:0 5px;font-size:8.5px}.ft.sm input:not([type=checkbox]){width:44px!important;font-size:8.5px}.ft.an input:not([type=checkbox]){width:64px!important}.ft.an input.dt{width:66px!important}.ft tr{break-inside:avoid}.ft.rec textarea{min-height:26px}
 input,select,textarea{border:0!important;background:transparent!important;padding:0 2px!important;font-size:9.5px;min-height:0;appearance:none;-webkit-appearance:none}
 input[type=checkbox]{appearance:auto;-webkit-appearance:checkbox;width:9px;height:9px}
 ::placeholder{color:transparent}
 textarea{resize:none!important}input[type=date]::-webkit-calendar-picker-indicator{display:none}
 .grid{gap:2px 8px;grid-template-columns:repeat(4,1fr)}.fic{gap:2px 10px;grid-template-columns:repeat(12,1fr)}label{font-size:8.5px;margin:0}p{margin:2px 0}
 .q{margin:1px 0;gap:1px 10px}.q input.il{min-width:0}.ck{margin:0 8px 0 0;font-size:9.5px}
 .free{min-height:34px}.sig{margin-top:10px}
 .lgs{height:27px}.hdr{gap:8px}.hl{gap:8px}.lgph{border:0;color:transparent}.lgph small{display:none}.hcc h2.ht{font-size:17px!important;color:#000!important}.hmeta{margin-top:2px}
}
/* ===== Animación de bienvenida ===== */
#welcome{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;text-align:center;color:#fff;cursor:pointer;
 background:linear-gradient(135deg,#0e8f78,#14b8a6,#2563eb,#0e8f78);background-size:300% 300%;animation:wbg 6s ease infinite;transition:opacity .7s ease,transform .7s ease}
#welcome.out{opacity:0;transform:scale(1.06);pointer-events:none}
@keyframes wbg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wl{position:relative;z-index:2;padding:20px}
.wbrand{font-size:15px;letter-spacing:.35em;text-transform:uppercase;font-weight:700;opacity:0;animation:wup .8s .1s ease forwards}
#welcome h1{font-size:clamp(34px,7vw,72px);line-height:1.1;margin:14px 0 22px;font-weight:800;text-shadow:0 4px 24px #0004}
#welcome h1 span{display:block;opacity:0;transform:translateY(24px) scale(.96);animation:wup .9s ease forwards}
#welcome h1 .w1{animation-delay:.5s}#welcome h1 .w2{animation-delay:.95s;color:#fef08a}
.wbar{width:min(260px,60vw);height:5px;border-radius:99px;background:#ffffff40;margin:0 auto;overflow:hidden;opacity:0;animation:wup .6s 1.4s ease forwards}
.wbar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;animation:wfill 1.7s 1.4s ease forwards}
.wsub{font-size:13px;opacity:0;margin:12px 0 0;animation:wup .6s 1.8s ease forwards}
@keyframes wup{to{opacity:1;transform:none}}
@keyframes wfill{to{width:100%}}
.wf{position:absolute;font-size:clamp(30px,5vw,54px);opacity:0;animation:wfloat 5s ease-in-out infinite,wshow .8s ease forwards;filter:drop-shadow(0 4px 8px #0003)}
.f1{left:8%;top:18%;animation-delay:.2s}.f2{left:84%;top:14%;animation-delay:.5s}.f3{left:14%;top:70%;animation-delay:.8s}.f4{left:80%;top:68%;animation-delay:.3s}
.f5{left:44%;top:8%;animation-delay:.6s}.f6{left:50%;top:84%;animation-delay:.9s}.f7{left:90%;top:42%;animation-delay:.4s}.f8{left:4%;top:44%;animation-delay:.7s}
@keyframes wfloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
@keyframes wshow{to{opacity:.95}}
@media(prefers-reduced-motion:reduce){#welcome,.wf,.wbrand,#welcome h1 span,.wbar,.wbar i,.wsub{animation:none!important;opacity:1;transform:none}.wbar i{width:100%}.wf{display:none}}
/* ===== Responsivo ===== */
@media(max-width:1100px){.eqwrap{grid-template-columns:1fr}}
@media(max-width:820px){aside{position:fixed;left:-250px}aside.open{left:0}#burger{display:inline-flex}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side"><div class="brand">NutriClin</div><nav id="nav"></nav></aside>
<main>
  <div class="top">
    <button id="burger" class="g" aria-label="Menú"></button>
    <h1 id="title"></h1>
    <span id="mpill"></span><span id="topav"></span><div style="min-width:210px"><select id="psel" aria-label="Paciente activo"></select></div>
    <button id="theme" class="g" aria-label="Cambiar tema"></button>
  </div>
  <div id="view"></div>
</main>
<div id="toast"></div>
<div id="picker" hidden></div>
<div id="welcome" role="status" aria-label="Bienvenida">
  <span class="wf f1">🥑</span><span class="wf f2">🍎</span><span class="wf f3">🥕</span><span class="wf f4">🥦</span><span class="wf f5">🍊</span><span class="wf f6">🫐</span><span class="wf f7">🍋</span><span class="wf f8">🥬</span>
  <div class="wl"><div class="wbrand">NutriClin</div><h1><span class="w1">¡Bienvenida,</span><span class="w2">nutrióloga!</span></h1><div class="wbar"><i></i></div><p class="wsub">Toca para continuar</p></div>
</div>

<script>
/* =====================================================================
   1. UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const fx=(v,d=1)=>(v==null||!isFinite(v))?'—':(+v).toFixed(d);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
/* Semáforo de adecuación: < ADQ[0] % = falta (amarillo) · ADQ[0]-ADQ[1] % = óptimo (verde) · > ADQ[1] % = se pasó (rojo).
   Cambia estos dos números si prefieres un margen más estrecho (p. ej. [95,105]). */
const ADQ=[90,110];
const adq=q=>q==null||!isFinite(q)?{c:'var(--mut)',t:'—'}:q<ADQ[0]?{c:'var(--warn)',t:'Falta'}:q<=ADQ[1]?{c:'var(--ok)',t:'Óptimo'}:{c:'var(--bad)',t:'Se pasó'};
const pill=q=>{const a=adq(q);return `<span class="pill" style="background:${a.c}">${q==null||!isFinite(q)?'—':fx(q,0)+' %'} · ${a.t}</span>`};
const adqLegend=()=>`<span class="pill" style="background:var(--warn)">Falta &lt; ${ADQ[0]} %</span> <span class="pill" style="background:var(--ok)">Óptimo ${ADQ[0]}–${ADQ[1]} %</span> <span class="pill" style="background:var(--bad)">Se pasó &gt; ${ADQ[1]} %</span>`;

   2. ALMACENAMIENTO (localStorage)

/* Descomprime RAW → CDC[clave][sexo] = [[edad_meses,L,M,S],...]   (sexo 1=niño, 2=niña) */
const CDC={};for(const k in RAW){const[ag,b,g]=RAW[k];CDC[k]={1:b.split(' ').map((r,i)=>[ag[i],...r.split(',').map(Number)]),2:g.split(' ').map((r,i)=>[ag[i],...r.split(',').map(Number)])}}

/* Interpolación lineal de L, M, S a la edad exacta en meses */
function lms(k,sx,mes){const t=CDC[k][sx],n=t.length;if(mes<t[0][0]||mes>t[n-1][0]+.6)return null;
 if(mes>=t[n-1][0])return t[n-1].slice(1);
 let i=0;while(i<n-2&&mes>t[i+1][0])i++;const a=t[i],b=t[i+1],f=(mes-a[0])/(b[0]-a[0]);
 return[1,2,3].map(j=>a[j]+(b[j]-a[j])*f)}
/* Z = ((X/M)^L − 1)/(L·S)  si L≠0 ;  Z = ln(X/M)/S  si L=0   (fórmula oficial CDC) */
const zs=(x,[L,M,S])=>L?((x/M)**L-1)/(L*S):Math.log(x/M)/S;
/* Percentil = Φ(Z)·100, función de distribución normal estándar (Abramowitz-Stegun) */
const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),
 q=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-q:q};
function dx(k,z,pc){if(k==='bmi')return pc<5?'Bajo peso':pc<85?'Normal':pc<95?'Sobrepeso':'Obesidad';
 return z<-2?'Bajo (< −2 DE)':z>2?'Alto (> +2 DE)':'Normal'}

/* Resultado pediátrico (<18 años): Peso/Edad, Talla/Edad, IMC/Edad con edad exacta en la fecha de consulta */
function pedHTML(c,p){const e=edad(p.nac,c.fecha);if(!e||e.a>=18)return '';
 const pe=num(c.peso),t=num(c.est);if(!pe||!t)return '<div class="msg">Captura peso y estatura para calcular percentiles y Z-scores.</div>';
 const sx=p.sexo==='M'?1:2,inf=e.dec<24,age=e.dec,imc=pe/(t/100)**2;
 const rows=[['Peso/Edad',inf?'wti':'wt',pe,'kg'],[inf?'Longitud/Edad':'Talla/Edad',inf?'len':'sta',t,'cm'],['IMC/Edad','bmi',imc,'kg/m²']];
 return '<div class="wrap"><table><tr><th>Indicador<th class="n">Valor<th class="n">Z-score<th class="n">Percentil<th>Interpretación</tr>'+
 rows.map(([n,k,v,u])=>{const L=k==='bmi'&&inf?null:lms(k,sx,age);
  if(!L)return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td colspan=3>${k==='bmi'?'La CDC define IMC/Edad desde los 24 meses':'Fuera de rango de las tablas CDC'}`;
  const z=zs(v,L),pc=cdf(z)*100;return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td class="n">${fx(z,2)}<td class="n">P${fx(pc,1)}<td>${dx(k,z,pc)}`}).join('')+
 '</table></div><p class="note">Referencia CDC 2000 (EE. UU.). En menores de 2 años la OMS suele preferirse; los percentiles son una herramienta de apoyo, no un diagnóstico.</p>'}

   5. EDAD Y GASTO ENERGÉTICO
   ===================================================================== */
/* Edad exacta (años + meses + meses decimales) a la fecha de referencia */
function edad(nac,ref){if(!nac)return null;const n=new Date(nac+'T00:00'),h=ref?new Date(ref+'T00:00'):new Date();
 let m=(h.getFullYear()-n.getFullYear())*12+h.getMonth()-n.getMonth();if(h.getDate()<n.getDate())m--;
 return m<0?null:{a:Math.floor(m/12),m:m%12,tot:m,dec:(h-n)/(30.4375*864e5)}}
const edTxt=e=>e?`${e.a} años ${e.m} meses`:'—';
/* GEB en kcal/día. p=kg · t=cm · e=años · s='M'|'F' */
const FM={
 mif:['Mifflin-St Jeor',(p,t,e,s)=>10*p+6.25*t-5*e+(s==='M'?5:-161)],
 hb:['Harris-Benedict',(p,t,e,s)=>s==='M'?66.5+13.75*p+5.003*t-6.755*e:655.1+9.563*p+1.85*t-4.676*e],
 val:['Valencia (población mexicana, ≥18 a)',(p,t,e,s)=>{if(e<18)return null;const i=e<30?0:e<60?1:2;
   const c=s==='M'?[[13.37,747],[13.08,693],[14.21,429]]:[[11.02,679],[10.92,677],[10.98,520]];return c[i][0]*p+c[i][1]}],
 sch:['Schofield FAO/OMS (<18 a)',(p,t,e,s)=>{if(e>=18)return null;const m=s==='M';
   return e<3?(m?60.9*p-54:61*p-51):e<10?(m?22.7*p+495:22.5*p+499):(m?17.5*p+651:12.2*p+746)}]};
const AF=[['Sedentario',1.2],['Actividad ligera',1.375],['Actividad moderada',1.55],['Actividad intensa',1.725],['Muy intensa',1.9]];
/* GEB → gasto por actividad (GEB×(AF−1)) → ETA (% del GEB+actividad) → GET total */
function en(c,p){const e=edad(p.nac,c.fecha),pe=num(c.peso),t=num(c.est);if(!e||!pe||!t)return null;
 const fm=c.formula||(e.a<18?'sch':'mif'),geb=FM[fm][1](pe,t,e.a,p.sexo),imc=pe/(t/100)**2;if(geb==null)return{imc,err:1};
 const af=num(c.af)||1.2,eP=(c.eta===''||c.eta==null)?10:+c.eta,act=geb*(af-1),et=(geb+act)*eP/100;
 return{imc,geb,act,eta:et,etaP:eP,get:geb+act,tot:geb+act+et}}

/* =====================================================================
   5b. COMPOSICIÓN CORPORAL: rangos de referencia (% del peso) → bajo / óptimo / elevado
   · Masa grasa: Gallagher et al. 2000 (rangos "saludables" por edad y sexo, adultos).
   · Masa muscular: masa muscular esquelética relativa (Janssen et al. 2002), aprox. hombre 33-39 %, mujer 24-30 %.
   · Masa residual: Würch (hombre ≈24.1 %, mujer ≈20.9 % del peso) con margen de ±4 puntos.
   Son guías orientativas para adultos (≥18 años); en deportistas o adultos mayores interpreta con criterio clínico.
   Edita los rangos aquí si usas otra referencia.
   ===================================================================== */
function refComp(sx,age,k){const m=sx==='M';
 if(k==='graso')return age<40?(m?[8,19]:[21,32]):age<60?(m?[11,21]:[23,33]):(m?[13,24]:[24,35]);
 if(k==='musc')return m?[33,39]:[24,30];

 <div class="card" id="eqplan"><h2>Plan de equivalentes y distribución por tiempo de comida</h2>
 <div class="eqwrap"><div class="wrap" id="eqtab"></div><div class="eqside" id="eqside"></div></div>

 <div class="card"><label>Notas de la consulta</label><textarea data-f="notas">${esc(c.notas)}</textarea></div>`},
 i(){const p=cur();if(!p)return;const c=curC();

  const drawEq=()=>{const D=eqData(c),e=en(c,p),mt=metaOf(c,e);
   $('#eqtab').innerHTML=`<table class="eqt"><thead><tr><th>Grupo<th class="n">Eq<th class="n">Kcal<th class="n">Pro<th class="n">Lip<th class="n">HCO${MEALS.map((m,mi)=>`<th class="n${mi?'':' sp'}">${m}`).join('')}<th class="n sp">Por distribuir</tr></thead><tbody>
    ${D.G.map((g,gi)=>`<tr data-g="${gi}"><td>${esc(g)}<td class="n"><input type="number" min="0" step="0.5" data-eqt="${gi}" aria-label="Eq total ${esc(g)}"><td class="n" data-o="kcal"><td class="n" data-o="p"><td class="n" data-o="l"><td class="n" data-o="hc">${MEALS.map((m,mi)=>`<td class="n${mi?'':' sp'}"><input type="number" min="0" step="0.5" data-eq="${gi}|${mi}" aria-label="${esc(g)} · ${m}">`).join('')}<td class="n sp" data-u="${gi}">`).join('')}
    <tr class="h"><td>Total<td class="n" data-t="n"><td class="n" data-t="kcal"><td class="n" data-t="p"><td class="n" data-t="l"><td class="n" data-t="hc">${MEALS.map((m,mi)=>`<td class="n${mi?'':' sp'}" data-mk="${mi}">`).join('')}<td class="n sp" data-t="u">
    <tr><td>% de la energía del día<td><td><td><td><td>${MEALS.map((m,mi)=>`<td class="n${mi?'':' sp'}" data-mp="${mi}">`).join('')}<td class="n sp"></tbody></table>`;
   $('#eqside').innerHTML=`<label>Dieta (meta en kcal)</label><div class="gap"><input data-mt="k" type="number" step="10" min="0" value="${mt.k}" style="max-width:130px"><span class="note" style="margin:0">kcal</span></div>
    <p class="note" style="margin:4px 0 10px">Por defecto toma el GET + ETA de la consulta.</p>
    <table><tr><th><th class="n">%<th class="n">Kcal<th class="n">Gramos</tr>
    ${[['hc','HCO'],['l','Lip'],['p','Pro']].map(([k,n])=>`<tr><td>${n}<td class="n"><input data-mt="${k}" type="number" step="1" min="0" value="${mt[k]}" style="width:64px;text-align:right"><td class="n" data-mk2="${k}"><td class="n" data-mg="${k}">`).join('')}

    <p class="note">La suma de los porcentajes debe ser 100 %.</p>`};
  const updEq=()=>{const D=eqData(c),e=en(c,p),mt=metaOf(c,e),T=D.T,
    goal={kcal:mt.k,p:mt.k*mt.p/400,l:mt.k*mt.l/900,hc:mt.k*mt.hc/400},set=(s,v)=>{const el=$(s);if(el)el.textContent=v};
   D.r.forEach((x,gi)=>{const tr=$(`#eqtab tr[data-g="${gi}"]`);if(!tr)return;
    tr.querySelectorAll('[data-o]').forEach(td=>{const k=td.dataset.o;td.textContent=x.n?fx(x[k],k==='kcal'?0:1):'·'});
    tr.querySelectorAll('input').forEach(inp=>{if(inp===document.activeElement)return;inp.value=inp.dataset.eqt!==undefined?(x.n?qn(x.n):''):(x.m[MEALS[+inp.dataset.eq.split('|')[1]]]||'')});
    const u=tr.querySelector('[data-u]');if(u)u.innerHTML=x.u>0?`<span class="pill" style="background:var(--warn)">${qn(x.u)}</span>`:(x.n?'<span style="color:var(--ok);font-weight:700">✓</span>':'·')});
   set('#eqtab [data-t=n]',qn(T.n));{const U=D.r.reduce((a,x)=>a+x.u,0);set('#eqtab [data-t=u]',U>0?qn(U):'')}set('#eqtab [data-t=kcal]',fx(T.kcal,0));['p','l','hc'].forEach(k=>set(`#eqtab [data-t=${k}]`,fx(T[k],1)));
   MEALS.forEach((m,mi)=>{set(`#eqtab [data-mk="${mi}"]`,fx(D.mk[m],0));set(`#eqtab [data-mp="${mi}"]`,T.kcal?fx(D.mk[m]/T.kcal*100,0)+' %':'—')});
   ['hc','l','p'].forEach(k=>{set(`[data-mk2=${k}]`,fx(mt.k*mt[k]/100,0)+' kcal');set(`[data-mg=${k}]`,fx(goal[k],1)+' g')});
   const sp=mt.hc+mt.l+mt.p,el=$('#mpsum');if(el){el.textContent=fx(sp,0)+' %';el.style.color=Math.round(sp)===100?'var(--ok)':'var(--bad)'}
   const cols=[['Kcal','kcal',0,' kcal'],['Pro','p',1,' g'],['Lip','l',1,' g'],['HCO','hc',1,' g']];
   $('#eqsum').innerHTML=`<div class="wrap"><table><tr><th>${cols.map(([n])=>`<th class="n">${n}`).join('')}</tr>
    <tr><td><b>Suma</b>${cols.map(([,k,d,u])=>`<td class="n">${fx(T[k],d)}${u}`).join('')}
    <tr><td><b>Meta</b>${cols.map(([,k,d,u])=>`<td class="n">${fx(goal[k],d)}${u}`).join('')}
    <tr><td><b>% adecuación</b>${cols.map(([,k])=>`<td class="n">${pill(goal[k]?T[k]/goal[k]*100:null)}`).join('')}</table></div>`};
  const drawDiet=()=>{$('#dtb').innerHTML=(c.dieta||[]).map(dietRow).join('')||'<tr><td colspan=8>Sin alimentos específicos. Agrégalos con el botón + del catálogo.';updEq()};
  const calc=()=>{const ed=edad(p.nac,c.fecha);$('#age').value=edTxt(ed);const e=en(c,p),k=(l,v,u)=>`<div class="card kpi" style="margin:0">${v}<small>${l}${u?' ('+u+')':''}</small></div>`;
   $('#o1').innerHTML=!e?'<div class="msg">Captura peso y estatura para calcular.</div>':e.err?'<div class="msg">La fórmula elegida no aplica a esta edad (Valencia: ≥18 años; Schofield: &lt;18 años). Elige otra.</div>':
    `<div class="grid">${k('IMC',fx(e.imc),'kg/m²')}${k('GEB',fx(e.geb,0),'kcal')}${k('Gasto por actividad',fx(e.act,0),'kcal')}${k('ETA '+e.etaP+' %',fx(e.eta,0),'kcal')}${k('GET',fx(e.get,0),'kcal')}${k('GET + ETA',fx(e.tot,0),'kcal')}</div>`;
   $('#cped').style.display=ed&&ed.a<18?'':'none';$('#o2').innerHTML=pedHTML(c,p);
   /* Composición corporal: masa grasa, masa muscular y residual (peso − grasa − músculo) con semáforo de referencia */
   const pe=num(c.peso),gr=num(c.graso),mu=num(c.musc),age=ed?ed.a:null;
   if(!pe||gr==null||mu==null){$('#o3').innerHTML='<div class="msg">Captura peso, % de grasa y masa muscular para ver la gráfica.</div>';updEq();return}
   const mg=pe*gr/100,res=pe-mg-mu;if(res<0){$('#o3').innerHTML='<div class="msg">La masa grasa + muscular supera el peso. Revisa los datos.</div>';updEq();return}
   const P=[{n:'Masa grasa',k:'graso',v:mg,c:'#e0852b'},{n:'Masa muscular',k:'musc',v:mu,c:'#0e8f78'},{n:'Masa residual',k:'res',v:res,c:'#6b86d6'}];
   const adulto=age!=null&&age>=18;
   let off=25;const arcs=P.map(x=>{const q=x.v/pe*100,s=`<circle class="sl" data-n="${x.n}" data-t="${fx(x.v)} kg · ${fx(q)} %" cx="21" cy="21" r="15.9155" fill="none" stroke="${x.c}" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${off}"/>`;off-=q;return s}).join('');
   $('#o3').innerHTML=`<div class="pw"><svg class="pie" viewBox="0 0 42 42" role="img" aria-label="Composición corporal">${arcs}<text id="pt1" x="21" y="20.5" text-anchor="middle" font-size="3" fill="currentColor" font-weight="700">${fx(pe)} kg</text><text id="pt2" x="21" y="24.5" text-anchor="middle" font-size="2.4" fill="currentColor">Pasa el cursor</text></svg>
    <div class="lg">${P.map(x=>{const q=x.v/pe*100,s=adulto?stComp(p.sexo,age,x.k,q):null;
      return `<div><b style="background:${x.c}"></b>${x.n}: <strong>${fx(x.v)} kg</strong> (${fx(q)} %) ${s?`<span class="pill" style="background:${s.c}">${s.t}</span> <small style="color:var(--mut)">ref. ${fx(s.r[0],0)}–${fx(s.r[1],0)} %</small>`:''}</div>`}).join('')}
    <div style="margin-top:10px;color:var(--mut)">Índice cintura/cadera: <b>${num(c.cin)&&num(c.cad)?fx(c.cin/c.cad,2):'—'}</b></div></div></div>
    <p class="note">${adulto?'Semáforo sobre el % del peso corporal. Grasa: Gallagher 2000 (por edad y sexo) · Músculo: masa muscular esquelética relativa (Janssen 2002) · Residual: Würch ±4 puntos. Son guías orientativas; en deportistas o adultos mayores interpreta con criterio clínico.':'Los rangos bajo/óptimo/elevado aplican a adultos (≥18 años). En menores usa los percentiles de la sección de Pediatría.'}</p>`;
   $('#o3').querySelectorAll('.sl').forEach(s=>{const on=()=>{$('#pt1').textContent=s.dataset.n;$('#pt2').textContent=s.dataset.t};
    s.onmouseenter=on;s.onclick=on;s.onmouseleave=()=>{$('#pt1').textContent=fx(pe)+' kg';$('#pt2').textContent='Pasa el cursor'}});updEq()};
  const v=$('#view');
  v.oninput=e=>{const t=e.target,f=t.dataset.f;
   if(f){c[f]=t.value;if(f==='af')$('#afsel').value='';save();calc();if(f==='fecha')$('#csel').options[$('#csel').selectedIndex].text=c.fecha+(c.peso?' · '+c.peso+' kg':'')}
   if(t.dataset.mt){c.meta=c.meta||{};c.meta[t.dataset.mt]=t.value;save();updEq()}
   if(t.dataset.q!==undefined){const i=+t.dataset.q,d=c.dieta[i],fd2=foodOf(d.k);d.n=t.value;save();const r=t.closest('tr'),n=+d.n||0;
    r.querySelector('.kc').textContent=fx(fd2.kcal*n,0);r.querySelector('.pp').textContent=fx(fd2.p*n);r.querySelector('.ll').textContent=fx(fd2.l*n);r.querySelector('.hh').textContent=fx(fd2.hc*n);updEq()}};
  v.onchange=e=>{const t=e.target;
   /* Eq total editable: lo que no está repartido en los tiempos de comida queda en "Por distribuir" */
   if(t.dataset.eqt!==undefined){const g=Object.keys(GR)[+t.dataset.eqt],k='G|'+g,want=num(t.value),
    sumN=a=>a.reduce((s2,d)=>s2+(+d.n||0),0),dist=sumN(c.dieta.filter(d=>d.t!==UND&&(foodOf(d.k)||{}).g===g));
    c.dieta=c.dieta.filter(d=>!(d.k===k&&d.t===UND));
    if(want!=null&&want>dist)c.dieta.push({k,n:want-dist,t:UND});
    else if(want!=null&&want>0&&want<dist)toast('Ya hay '+qn(dist)+' equivalentes repartidos en los tiempos de comida; redúcelos ahí.');
    save();updEq();const tot=sumN(c.dieta.filter(d=>(foodOf(d.k)||{}).g===g));t.value=tot?qn(tot):'';return}
   if(t.dataset.eq){const gg=Object.keys(GR)[+t.dataset.eq.split('|')[0]],rel0=c.dieta.filter(d=>(foodOf(d.k)||{}).g===gg),
    und0=rel0.filter(d=>d.t===UND).reduce((a,d)=>a+(+d.n||0),0),tgt=rel0.reduce((a,d)=>a+(+d.n||0),0);
    const[gi,mi]=t.dataset.eq.split('|').map(Number),g=Object.keys(GR)[gi],m=MEALS[mi],want=Math.max(0,num(t.value)||0),
    fpart=c.dieta.filter(d=>!d.k.startsWith('G|')&&d.t===m&&(foodOf(d.k)||{}).g===g).reduce((a,d)=>a+(+d.n||0),0),gen=Math.max(0,want-fpart),k='G|'+g,ix=c.dieta.findIndex(d=>d.k===k&&d.t===m);
    if(gen>0){if(ix>=0)c.dieta[ix].n=gen;else c.dieta.push({k,n:gen,t:m})}else if(ix>=0)c.dieta.splice(ix,1);
    if(und0>0){const dn=c.dieta.filter(d=>d.t!==UND&&(foodOf(d.k)||{}).g===gg).reduce((a,d)=>a+(+d.n||0),0),rem=tgt-dn;
     c.dieta=c.dieta.filter(d=>!(d.k==='G|'+gg&&d.t===UND));if(rem>0)c.dieta.push({k:'G|'+gg,n:rem,t:UND})}
    save();updEq();return}
   if(t.id==='afsel'&&t.value){c.af=t.value;$('[data-f=af]').value=t.value;save();calc()}
   if(t.dataset.f==='formula'){c.formula=t.value;save();calc()}
   if(t.id==='csel'){DB.csel[p.id]=t.value;save();render()}
   if(t.dataset.m!==undefined){c.dieta[+t.dataset.m].t=t.value;save();updEq()}};
  v.onclick=e=>{const t=e.target.closest('button');if(!t)return;
   if(t.id==='bnc'){const n=newCons(p);p.cons.push(n);DB.csel[p.id]=n.id;save();render()}
   if(t.id==='bdc'&&confirm('¿Eliminar esta consulta?')){p.cons=p.cons.filter(x=>x.id!==c.id);delete DB.csel[p.id];save();render()}

/* ---------- CATÁLOGO SMAE (buscador en tiempo real + conexión al plan) ---------- */
V.cat={t:'Catálogo SMAE',h(){const p=cur(),gs=[...new Set(FOODS.map(f=>f.g))];
 return `<div class="card"><div class="grid" style="align-items:end"><div style="grid-column:span 2"><label>Buscar por alimento o grupo</label><input id="q" type="search" placeholder="Ej. frijol, frutas, leche…" autofocus></div>
 <div><label>Grupo</label><select id="gf"><option value="">Todos</option>${gs.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
 <div><label>Agregar al plan en</label><select id="mt">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div></div>
 <p id="cnt" class="note"></p><p class="note">${p?'Plan activo: '+esc(p.nombre)+' · consulta '+esc((curC()||{}).fecha||'nueva'):'Selecciona un paciente para poder agregar alimentos a su plan.'}</p></div>
 <div class="card wrap"><table><thead><tr><th>Alimento<th>Grupo<th>Porción<th class="n">Peso neto (g)<th class="n">kcal<th class="n">Prot (g)<th class="n">Lípidos (g)<th class="n">HC (g)<th></tr></thead><tbody id="tb"></tbody></table></div>`},
 i(){const nrm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const draw=()=>{const s=nrm($('#q').value),g=$('#gf').value,r=FOODS.filter(f=>(!g||f.g===g)&&nrm(f.n+' '+f.g).includes(s));
   $('#cnt').textContent=`${r.length} de ${FOODS.length} alimentos · valores por equivalente SMAE.`;
   $('#tb').innerHTML=r.slice(0,300).map(f=>`<tr><td>${esc(f.n)}<td>${esc(f.g)}<td>${esc(f.po)}<td class="n">${fx(f.w,0)}<td class="n">${fx(f.kcal,0)}<td class="n">${fx(f.p)}<td class="n">${fx(f.l)}<td class="n">${fx(f.hc)}<td><button class="s" data-id="${esc(f.id)}">+</button>`).join('')||'<tr><td colspan=9>Sin resultados.'};
  $('#q').oninput=draw;$('#gf').onchange=draw;draw();
  $('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=cur();if(!p)return toast('Selecciona un paciente primero');
   ensureC(p);const c=curC(),t=$('#mt').value,x=c.dieta.find(d=>d.k===b.dataset.id&&d.t===t);
   if(x)x.n=(+x.n||0)+1;else c.dieta.push({k:b.dataset.id,n:1,t});save();toast('Agregado al plan · '+t)}}};

/* ---------- MICRONUTRIMENTOS Y PERFIL LIPÍDICO ---------- */
V.mic={t:'Micronutrimentos y perfil lipídico',h(){const p=cur();if(!p)return noP;ensureC(p);const c=curC(),e=en(c,p),t=planT(c);
 return `<div class="card"><p class="note" style="margin-top:0">Consulta ${esc(c.fecha)}. Si tu base SMAE incluye micronutrientes (campo <code>mic</code>), el plan los suma en <b>Plan</b>; puedes sobrescribir cada valor en <b>Captura</b>. Referencias: IDR de adulto (${p.sexo==='M'?'hombre':'mujer'}); en menores ajusta por edad.</p>
 <div class="wrap"><table><tr><th>Nutriente<th>Unidad<th class="n">Plan<th>Captura<th class="n">Referencia<th>% cubierto</tr>
 ${MIC.map(m=>{if(m.length===1)return`<tr class="h"><td colspan=6>${m[0]}`;const[k,n,u,h,mj,ty]=m;let r=p.sexo==='M'?h:mj;if(r==='ags')r=e?e.tot*.1/9:null;
  return`<tr><td>${n}<td>${u}<td class="n">${t.mic[k]!=null?fx(t.mic[k],2):'—'}<td style="width:110px"><input data-k="${k}" type="number" step="0.01" value="${esc((c.micro||{})[k])}"><td class="n">${r==null?'—':(ty==='max'?'≤ ':'')+fx(r,r<10?1:0)}<td data-b="${k}">`}).join('')}</table></div></div>`},
 i(){const p=cur();if(!p)return;const c=curC(),e=en(c,p),t=planT(c);
  const bars=()=>MIC.forEach(m=>{if(m.length===1)return;const[k,,,h,mj,ty]=m;let r=p.sexo==='M'?h:mj;if(r==='ags')r=e?e.tot*.1/9:null;
   const cell=$(`[data-b=${k}]`);if(!cell)return;const man=num((c.micro||{})[k]),v=man!=null?man:t.mic[k];
   if(r==null||v==null){cell.textContent='—';return}const q=v/r*100,bad=ty==='max'?q>100:q<67;
   cell.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${Math.min(q,100)}%;background:${bad?'var(--bad)':q<90&&ty!=='max'?'var(--warn)':'var(--ok)'}"></i></div>${fx(q,0)} %</div>`});
  $('#view').oninput=ev=>{const k=ev.target.dataset.k;if(k){c.micro=c.micro||{};c.micro[k]=ev.target.value;save();bars()}};bars()}};

/* ---------- AJUSTES ---------- */
V.aj={t:'Ajustes',h(){return `<div class="card"><h2>Base SMAE</h2><p>Alimentos cargados: <b>${FOODS.length}</b> ${DB.smae?'(base propia importada)':'(base incluida)'}.
 Importa tu base estructurada como un archivo JSON con un arreglo de alimentos:</p>
 <pre>[{"n":"Tortilla de maíz","g":"Cereales sin grasa","po":"1 pza","w":30,
  "kcal":70,"p":2,"l":0,"hc":15,"mic":{"ca":45,"fe":0.6}}]</pre>
 <p class="note">Obligatorios: n (nombre), g (grupo), po (porción), w (peso neto g). Si omites kcal/p/l/hc se toman del grupo. Claves de mic: ${MIC.filter(m=>m.length>1).map(m=>m[0]).join(', ')}.</p>
 <button id="bsm">Importar base SMAE (.json)</button> <button class="g" id="brs">Restaurar base incluida</button><input type="file" id="fsm" accept=".json" hidden></div>
 <div class="card"><h2>Respaldo de datos</h2><p>Los datos viven solo en este navegador. Exporta un respaldo con frecuencia.</p>
 <button id="bex">Exportar respaldo (.json)</button> <button class="g" id="bim">Importar respaldo</button><input type="file" id="fim" accept=".json" hidden>
 <button class="d" id="bclr" style="float:right">Borrar todo</button></div>`},
 i(){$('#bsm').onclick=()=>$('#fsm').click();
  $('#fsm').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);
   if(!Array.isArray(a)||!a.every(x=>x.n&&x.g&&x.po!=null&&x.w!=null))throw 0;DB.smae=a;save();loadFoods();toast(a.length+' alimentos importados');render()}catch{toast('JSON no válido: revisa el esquema')}};r.readAsText(e.target.files[0])};
  $('#brs').onclick=()=>{DB.smae=null;save();loadFoods();render();toast('Base incluida restaurada')};
  $('#bex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='nutriclin-respaldo.json';a.click()};

function avHTML(p,size=36,av){
  const a=av===undefined?(p&&p.av):av;let h=0;for(const ch of String((p&&p.id)||'x'))h=(h*31+ch.charCodeAt(0))>>>0;
  const ini=p?((p.nombre||'?')[0]+((p.apellidos||'')[0]||'')).toUpperCase():'?';
  const b=`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;background:${AV_COLORS[h%AV_COLORS.length]}`;
  if(a&&a.type==='photo'&&a.v)return `<span class="av" style="${b}"><img src="${a.v}" alt=""></span>`;
  if(a&&a.type==='emoji'&&a.v)return `<span class="av" style="${b};background:var(--bg);font-size:${Math.round(size*.56)}px">${a.v}</span>`;

function imgURL(file,max,square,q,png){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),x=c.getContext('2d');
  if(square){c.width=c.height=max;const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
  res(c.toDataURL(png?'image/png':'image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function parseCSV(txt){txt=txt.replace(/^\uFEFF/,'');const l1=txt.split(/\r?\n/)[0]||'',d=l1.split(';').length>l1.split(',').length?';':',',rows=[];let row=[],c='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(c);rows.push(row);row=[];c=''}else c+=ch}
 if(c!==''||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

function hcLogo(k,l,w){const lg=DB.logos||{},u=(k in lg)?lg[k]:LOGO_DEF[k];
 return `<div class="lgs"><label for="lg-${k}" title="${u?'Cambiar logo':'Subir logo'}">${u?`<img src="${u}" alt="${esc(l)}">`:`<span class="lgph" style="min-width:${w}px">${esc(l)}<small>Subir logo</small></span>`}</label>
  <input type="file" id="lg-${k}" data-lg="${k}" accept="image/*" hidden>${u?`<button class="s g noprint lx" data-x="lgdel" data-k="${k}" aria-label="Quitar logo">✕</button>`:''}</div>`}
/* ---------- Registro automático del paciente al llenar la historia clínica ----------
   Si no hay paciente activo (o se pulsa “Nueva historia clínica”) se trabaja sobre un borrador; en cuanto tiene
   nombre y fecha de nacimiento se guarda como paciente, queda seleccionado y se crea su primera consulta. */
const newDraft=()=>({id:uid(),nombre:'',apellidos:'',nac:'',sexo:'F',est:'',tel:'',mail:'',antec:'',hist:'',pat:[],cons:[],hci:{},hcd:{}});
const hcPat=()=>HS.draft||cur();
function hcRegister(p){if(HS.draft!==p||!(p.nombre||'').trim()||!p.nac)return;
 HS.draft=null;if(!p.cons.length)p.cons.push(newCons(p));DB.p.push(p);DB.sel=p.id;save();fillSel();
 const b=$('#newpbanner');if(b)b.remove();const an=$('#antro');if(an)an.innerHTML=antroBlock(p);
 toast('Paciente registrado automáticamente: '+pn(p))}
function hcPInput(e){const t=e.target,d=t.dataset;if(d.p===undefined)return false;const p=hcPat();if(!p)return true;p[d.p]=t.value;if(d.p==='nombre')p.apellidos='';
 if(d.p==='nac'){const el=$('#hc-edad');if(el)el.value=edTxt(edad(p.nac))}
 hcRegister(p);if(e.type==='change')fillSel();if(DB.p.includes(p))save();return true}
const draftBanner=p=>HS.draft===p?'<div class="msg noprint" id="newpbanner" style="margin:8px 0">Paciente nuevo: se registrará automáticamente al capturar <b>nombre</b> y <b>fecha de nacimiento</b>.</div>':'';
function identCard(p){return `<div class="card">${draftBanner(p)}<div class="gap" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Datos del paciente</h2><button class="g s noprint" data-x="newhc">＋ Nueva historia clínica</button></div>
 <div class="grid"><div style="grid-column:span 2"><label>Nombre</label><input data-p="nombre" value="${esc(pn(p))}"></div>
 <div><label>Fecha de nacimiento</label><input data-p="nac" type="date" value="${esc(p.nac)}"></div><div><label>Edad</label><input id="hc-edad" readonly value="${edTxt(edad(p.nac))}"></div>
 <div><label>Sexo</label><select data-p="sexo"><option value="F"${p.sexo==='F'?' selected':''}>Mujer</option><option value="M"${p.sexo==='M'?' selected':''}>Hombre</option></select></div>
 <div><label>Teléfono</label><input data-p="tel" type="tel" value="${esc(p.tel)}"></div></div></div>`}
function antroBlock(p){
 const cs=csort(p),pg=Math.min(HS.pg||0,Math.max(0,Math.ceil(cs.length/4)-1)),cols=[0,1,2,3].map(i=>cs[pg*4+i]||null);
 const AR=[['Fecha','fecha','date'],['Peso (kg)','peso'],['Talla (cm)','est'],['IMC (kg/m²)','_imc'],['Clasif. IMC','_cl'],['C. cintura','cin'],['C. abdominal','abd'],['C. brazo','bra'],['% Grasa (S/A)','graso']];
return `<div class="ftw sm"><table class="ft sm an"><tr><th>Parámetro${cols.map((c,i)=>`<th>Consulta ${pg*4+i+1}°`).join('')}</tr>
  ${AR.map(([l,k,ty])=>`<tr><td style="font-style:italic;color:var(--mut)">${l}${cols.map(c=>!c?'<td>':k==='_imc'?`<td data-imc="${c.id}">${imcOf(c)==null?'':fx(imcOf(c))}`:k==='_cl'?`<td data-cl="${c.id}">${esc(clasifIMC(c,p))}`:
   `<td><input data-c="${c.id}|${k}" type="${ty||'number'}" step="0.1" value="${esc(c[k])}">`).join('')}`).join('')}</table></div>
  <div class="gap noprint" style="margin-top:8px"><button class="s" data-x="nc">＋ Agregar consulta</button>${cs.length>4||pg>0?`<button class="s g" data-x="pgp"${pg?'':' disabled'}>‹ Anteriores</button><button class="s g" data-x="pgn"${(pg+1)*4<cs.length?'':' disabled'}>Siguientes ›</button>`:''}
  <span class="note" style="margin:0">Estos datos son los mismos de la sección Consulta.</span></div>`;
}
function instH(){let p=hcPat();if(!p){HS.draft=newDraft();p=HS.draft}const I=p.hci=p.hci||{};if(!I.fecha)I.fecha=today();
 const ox=(g,a)=>a.map(v=>`<label class="ck"><input type="checkbox" data-ir="${g}" value="${esc(v)}"${I[g]===v?' checked':''}>${esc(v)}</label>`).join('');
 const cx=(a,pre)=>a.map(([k,l])=>`<label class="ck"><input type="checkbox" data-ic="${pre}.${k}"${I[pre+'.'+k]?' checked':''}>${esc(l)}</label>`).join('');
 const SZ={sue:'xs','sent.h':'xs',ncom:'xs',ncol:'xs',alc:'s','alc.f':'s','alc.c':'s',tab:'s','tab.f':'s','tab.c':'s','sus.f':'s',agua:'s','sal.t':'s','int.o':'s',pdig:'l','af.f':'l','dg.f':'l',mast:'l'};
 const ti=(k,ph='')=>`<input class="il ${SZ[k]||'m'}" type="text" data-i="${k}" value="${esc(I[k])}" placeholder="${esc(ph)}" aria-label="${esc(ph||k)}">`;
 const q=(l,inner)=>`<div class="q"><b>${l}</b>${inner}</div>`;
 const sec=(t,b)=>`<div class="card hcc" style="border-top:5px solid ${HI_COL}"><h2 style="color:${HI_COL};font-size:17px">${t}</h2>${b}</div>`;
 const SP=w=>typeof w==='string'?` style="grid-column:span ${w.slice(1)}"`:w?` style="width:${w}px"`:'';
 const T=(k,l,t='text',w)=>`<div${SP(w)}><label>${l}</label><input data-i="${k}" type="${t}" value="${esc(I[k])}"></div>`;
 const P=(k,l,t='text',w)=>`<div${SP(w)}><label>${l}</label><input data-p="${k}" type="${t}" value="${esc(p[k])}"></div>`;
 /* --- Antropometría: columnas = consultas (editables, ligadas a la Consulta) --- */
 const antro=`<div id="antro">${antroBlock(p)}</div>`;
 /* --- Bioquímicos --- */
 const bq=`<div class="ftw sm"><table class="ft sm"><tr><th>Indicador<th>Valor normal<th>Consulta 1°<th>Consulta 2°<th>Consulta 3°</tr>
  ${BQ.map(([id,n,ref])=>`<tr><td><b>${n}</b><td>${ref}${[0,1,2].map(i=>{const k=`bq.${id}.${i}`;return `<td><input data-i="${k}" type="number" step="any" value="${esc(I[k])}"${bqOut(id,I[k],p)?' class="out"':''}>`}).join('')}`).join('')}</table></div>
  <p class="note">Los valores fuera de rango se marcan en rojo.</p>`;
 /* --- Recordatorio de 24 h: tabla formal; las colaciones se pueden quitar --- */
 const rcRow=([k,n,col])=>I['off.'+k]?'':`<tr><td style="width:200px"><b>${n}</b><div class="gap" style="margin-top:4px;gap:6px"><span class="note" style="margin:0">Hrs:</span><input type="text" inputmode="numeric" placeholder="hh:mm" data-i="rc.${k}.hr" value="${esc(I['rc.'+k+'.hr'])}" style="width:115px" aria-label="Hora ${n}"></div>
  ${col?`<button class="s g noprint" data-x="rm" data-k="${k}" style="margin-top:6px">Quitar colación</button>`:''}
  <td><textarea data-i="rc.${k}.ali" aria-label="Alimentos ${n}">${esc(I['rc.'+k+'.ali'])}</textarea><td><textarea data-i="rc.${k}.cant" aria-label="Cantidad ${n}">${esc(I['rc.'+k+'.cant'])}</textarea>`;
 const back=REC.filter(r=>r[2]&&I['off.'+r[0]]);
 const rec=`<div class="ftw rec"><table class="ft rec"><tr><th>Tiempo de alimentos<th>Alimentos<th>Cantidad / Preparación</tr>${REC.map(rcRow).join('')}</table></div>
  ${back.length?`<div class="gap noprint" style="margin-top:8px"><span class="note" style="margin:0">El paciente no consume:</span>${back.map(r=>`<button class="s g" data-x="add" data-k="${r[0]}">＋ ${r[1]}</button>`).join('')}</div>`:''}`;
 const hasCol=!(I['off.cm']&&I['off.cv']);
 const hf=`<div class="ftw"><table class="ft"><tr><th>Familiar${HF_COLS.map(c=>`<th style="text-align:center">${c[1]}`).join('')}<th>Otros</tr>
  ${FAMS.map((f,i)=>`<tr><td>${f}${HF_COLS.map(([k])=>`<td style="text-align:center"><input type="checkbox" data-ic="hf.${i}.${k}"${I[`hf.${i}.${k}`]?' checked':''} style="width:auto" aria-label="${f} ${k}">`).join('')}<td><input data-i="hf.${i}.otros" value="${esc(I[`hf.${i}.otros`])}" aria-label="Otros ${f}">`).join('')}</table></div>`;
 return `<div class="card hcc" style="border-top:5px solid ${HI_COL}"><div class="hdr"><div class="hl">${hcLogo('l1','Logo izquierdo',200)}</div>
  <h2 class="ht">Historia Clínica</h2><div class="hr">${hcLogo('r1','Logo derecho',135)}</div></div>
  <div class="hmeta">${T('fecha','Fecha','date',140)}${T('exp','N.º de expediente','text',170)}<button class="g noprint" data-x="print">🖨 Imprimir</button><button class="g noprint" data-x="newhc">＋ Nueva historia clínica</button></div>${draftBanner(p)}</div>`+
 sec('Ficha de Identificación',`<div class="fic"><div style="grid-column:span 8"><label>Nombre</label><input data-p="nombre" value="${esc(pn(p))}"></div><div style="grid-column:span 2"><label>Edad</label><input id="hc-edad" readonly value="${edTxt(edad(p.nac))}"></div>

function buildDocx(list,opt){const body=list.map((p,i)=>(i?PB:'')+bodyOf(p,opt||{})).join('')+'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
 const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',W=NS+'wordprocessingml/2006/main';
 return zipStore([
  {n:'[Content_Types].xml',d:H+`<Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`},
  {n:'_rels/.rels',d:H+`<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`},
  {n:'word/_rels/document.xml.rels',d:H+`<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
  {n:'word/styles.xml',d:H+`<w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="es-MX"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="259" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`},
  {n:'word/document.xml',d:H+`<w:document xmlns:w="${W}"><w:body>${body}</w:body></w:document>`}])}
function exportDocx(list,opt,name){const a=document.createElement('a');a.href=URL.createObjectURL(buildDocx(list,opt));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-docx]');if(!b)return;const id=b.dataset.docx,cb=$('#dx-pagos'),list=id==='ALL'?DB.p:DB.p.filter(x=>x.id===id);
 if(!list.length)return toast('No hay pacientes para exportar');
 try{exportDocx(list,{pagos:!!(cb&&cb.checked)},id==='ALL'?'Historiales-'+today()+'.docx':'Historial-'+pn(list[0]).replace(/\s+/g,'-')+'-'+today()+'.docx');toast('Word generado: revisa tus descargas')}catch(err){console.error(err);toast('No se pudo generar el Word')}});
const bar=p=>`<div class="gap noprint" style="margin:0 0 12px"><button data-docx="${p.id}">⬇ Historial clínico (Word)</button><label class="note" style="margin:0;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="dx-pagos" style="width:auto"> incluir pagos</label></div>`;
const _pacH=V.pac.h;V.pac.h=function(){return _pacH.apply(this,arguments).replace(/<button class="s g" data-a="hist" data-id="([^"]+)">/g,'<button class="s g" data-docx="$1">Word</button> <button class="s g" data-a="hist" data-id="$1">')};
const _datH=V.datos.h;V.datos.h=function(){const p=cur();return _datH.apply(this,arguments)+(p?bar(p):'')};
const _hcH=V.hc.h;V.hc.h=function(){const h=_hcH.apply(this,arguments),p=cur();return(p&&!HS.cfg?bar(p):'')+h};
window.NCX={buildDocx,zipStore};
})();

function fillSel(){paintTop();const s=$('#psel');s.innerHTML='<option value="">— Sin paciente —</option>'+DB.p.map(p=>`<option value="${p.id}"${p.id===DB.sel?' selected':''}>${esc(pn(p))}</option>`).join('')}
$('#psel').onchange=e=>{HS.draft=null;DB.sel=e.target.value||null;save();paintTop();render()};
function render(){const id=(location.hash||'#hc').slice(1),v=V[id]||V.panel;
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===(V[id]?id:'panel')));
 const w=$('#view');w.oninput=w.onchange=w.onclick=null;$('#title').textContent=v.t;w.innerHTML=v.h();v.i&&v.i();enhanceDates(w)}
window.addEventListener('hashchange',()=>{editId=null;render()});
/* =====================================================================
   FECHAS ESCRITAS (sin calendario): todos los campos de fecha se teclean como dd/mm/aaaa.
   · Escribe solo números (13102026 → 13/10/2026; con año de 2 dígitos también: 131026).
   · Presiona H (o T) para poner la fecha de hoy.
   · Por dentro la fecha sigue guardándose como aaaa-mm-dd, así que no cambia nada de lo demás.
   ===================================================================== */
const _vget=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').get,_vset=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
const isoFmt=i=>/^\d{4}-\d{2}-\d{2}$/.test(i||'')?i.slice(8,10)+'/'+i.slice(5,7)+'/'+i.slice(0,4):'';
function isoParse(txt,loose){const d=String(txt).replace(/\D/g,'');let dd,mm,yy;
 if(d.length===8){dd=+d.slice(0,2);mm=+d.slice(2,4);yy=+d.slice(4)}
 else if(loose&&d.length===6){dd=+d.slice(0,2);mm=+d.slice(2,4);const y2=+d.slice(4);yy=y2>(new Date().getFullYear()%100)+1?1900+y2:2000+y2}
 else return '';
 const t=new Date(yy,mm-1,dd);if(yy<1900||yy>2100||t.getFullYear()!==yy||t.getMonth()!==mm-1||t.getDate()!==dd)return '';
 return `${String(yy).padStart(4,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`}
function enhanceDates(root){(root||document).querySelectorAll('input[type=date]').forEach(el=>{
 const iso=el.getAttribute('value')||'';el.type='text';el.classList.add('dt');el._iso=/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:'';
 el.placeholder='dd/mm/aaaa';el.maxLength=10;el.inputMode='numeric';el.autocomplete='off';el.title='Escribe la fecha (solo números) · H = hoy';
 Object.defineProperty(el,'value',{get(){return el._iso},set(v){el._iso=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';_vset.call(el,isoFmt(el._iso))},configurable:true});
 _vset.call(el,isoFmt(el._iso));
 el.addEventListener('focus',()=>el.select());
 el.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[htHT]$/.test(e.key)){e.preventDefault();el._iso=today();_vset.call(el,isoFmt(el._iso));el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}});
 el.addEventListener('input',()=>{const d=_vget.call(el).replace(/\D/g,'').slice(0,8),f=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;_vset.call(el,f);
  if(!f)el._iso='';else{const i=isoParse(f,false);if(i)el._iso=i}},true);
 el.addEventListener('change',()=>{const before=el._iso,t=_vget.call(el);if(!t.trim())el._iso='';else{const i=isoParse(t,true);if(i)el._iso=i}_vset.call(el,isoFmt(el._iso));
  if(el._iso!==before)el.dispatchEvent(new Event('input',{bubbles:true}))},true);
})}
new MutationObserver(()=>enhanceDates($('#view'))).observe($('#view'),{childList:true,subtree:true});

paintBrand();fillSel();render();

 const close=()=>{if(w.classList.contains('out'))return;w.classList.add('out');setTimeout(()=>w.remove(),750)};
 w.onclick=close;setTimeout(close,3600);document.addEventListener('keydown',close,{once:true})})();
