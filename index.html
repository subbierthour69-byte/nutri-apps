<!--
  NutriClin v2.1 — un solo archivo, sin dependencias ni servidor.
  DESPLIEGUE: sube como index.html a un repo y activa Settings → Pages → main / root.
  DATOS: localStorage del navegador (locales y privados). Exporta respaldos en Ajustes.
  PEDIATRÍA: tablas L-M-S oficiales de la CDC (NCHS 2000) incluidas en este script.
  NOVEDADES v2.7: Formato mensual "Actividades de medicina general por grupos de edad y sexo" (primera vez / subsecuente) que se llena solo desde la agenda · imprimir y CSV.
  NOVEDADES v2.6: sin cuadro "Sin paciente" arriba (cada sección pide elegir paciente con lista y buscador; el nombre activo se quita con ✕) · Historia clínica: "Guardar y siguiente paciente".
  NOVEDADES v2.5: pacientes sin duplicar (agenda, historia clínica, notas y Pacientes; con botón para unir duplicados) · citas enlazadas por expediente/nombre · puntos del calendario en orden de horario · "asistió" en verde suave.
  NOVEDADES v2.4: flecha de retroceso en todas las secciones · Guardar/Imprimir arriba a la derecha · Notas subsecuentes con IMC, edad,
  diagnóstico por IMC y percentil (menores) automáticos · horario editable en el R24 · lista "Con paciente" · asistente que sale solo al detectar peso y talla.
  NOVEDADES v2.3: respaldo completo (ambos modos) + copias automáticas internas + lista CSV · AGENDA de citas (asistió / no asistió) ·
  comparación de cada nota subsecuente contra la consulta anterior (solo en pantalla, no se imprime) · autocompletado por expediente o nombre.
  NOVEDADES v2.2: app instalable SIN INTERNET (sw.js + manifest + iconos) · Historia clínica en formato oficial SANNAFARM
  (3 páginas = 2 hojas, Aptos 12 sin espaciado) para Word e impresión/PDF · Asistente flotante (no se imprime).
  NOVEDADES v2.1: semáforo (bajo/óptimo/elevado) en composición corporal · plan de equivalentes
  con distribución por tiempo de comida al lado y % de adecuación en colores.
-->
<style>
/* ===== Tokens claro/oscuro ===== */
:root{--bg:#eef7f6;--card:#fff;--tx:#15303a;--mut:#5f7782;--pri:#0e8f78;--pri2:#2563eb;--acc:#fef08a;--grad:linear-gradient(135deg,#0e8f78,#14b8a6 45%,#2563eb);--bd:#d3e5e8;--side:#0b5a78;--bad:#c8432f;--warn:#d98a14;--ok:#1f9d5a}
:root[data-theme=dark]{--bg:#0a1a24;--card:#102b38;--tx:#e3f1f2;--mut:#93b0b8;--bd:#1f4352;--side:#06293a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}a{color:var(--pri)}
/* ===== Menú lateral ===== */
aside{width:236px;background:linear-gradient(180deg,#0e8f78 0%,#0f7a96 45%,#2563eb 100%);color:#eafffb;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:left .2s;z-index:20}
.brand{font-size:18px;font-weight:700;color:#fff;padding:4px 10px 10px}
.sec{font-size:11px;color:#c7f9ee;margin:16px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover{background:#ffffff1f}nav a.on{background:#ffffff33;color:#fff;font-weight:700;box-shadow:inset 4px 0 0 var(--acc)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ===== Contenido ===== */
main{flex:1;min-width:0;padding:20px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top h1{flex:1}#title{background:linear-gradient(90deg,#0e8f78,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}:root[data-theme=dark] #title{background:linear-gradient(90deg,#5eead4,#93c5fd);-webkit-background-clip:text;background-clip:text}
#burger{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:8px 14px;background:var(--grad);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right}.wrap{overflow-x:auto}
td input{padding:4px 6px;min-width:70px}
.kpi{font-size:24px;font-weight:700;margin:0}.kpi small{font-size:12px;color:var(--mut);font-weight:400;display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);margin:2px;cursor:pointer;font-size:12px;background:var(--bg)}
.chip.on{background:var(--grad);border-color:var(--pri);color:#fff}
.msg{padding:12px;border-radius:8px;background:#d98a1422;border:1px solid var(--warn)}
tr.h td{background:var(--bg);font-weight:700;color:var(--pri)}
.bar{height:8px;border-radius:4px;background:var(--bd);min-width:90px}.bar i{display:block;height:100%;border-radius:4px}
.pw{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pie{width:230px;height:230px}.sl{transition:stroke-width .15s;cursor:pointer}.sl:hover{stroke-width:9}
.lg div{margin:6px 0}.lg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
#toast{position:fixed;bottom:18px;right:18px;background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50}
.av{border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;font-weight:700;color:#fff;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.gap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btnlike{display:inline-flex;align-items:center;margin:0;padding:4px 9px;font-size:12px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);cursor:pointer}
nav a.on{background:#ffffff33;color:#fff}
/* ===== Semáforo (v2.1): píldoras de estado y plan de equivalentes ===== */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:12px;white-space:nowrap;line-height:1.5}
.eqwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.eqt td,.eqt th{padding:4px 6px}
.eqt input{width:58px;min-width:0;padding:3px 5px;text-align:right}
.eqt .sp{border-left:2px solid var(--bd)}
.eqt tr.h td{border-top:2px solid var(--pri)}
.eqt thead th{background:var(--grad);color:#fff}
.eqside{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--bg)}
.eqside input{background:var(--card)}
.eqsum{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--pri);margin-top:12px;padding-top:6px;z-index:5}
.eqsum th{background:var(--grad);color:#fff}
details.dd{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}details.dd summary{cursor:pointer;font-weight:600}
/* ===== Dietas dinámicas: pestañas de colores ===== */
.dtabs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.dtab{flex:1 1 190px;max-width:270px;flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:18px 14px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:18px;font-weight:800;box-shadow:0 4px 12px #0003;opacity:.7;transform:scale(.96);transition:transform .15s,opacity .15s,box-shadow .15s}
.dtab:hover{opacity:1}
.dtab.on{opacity:1;transform:scale(1.04);box-shadow:0 8px 22px #0004,0 0 0 3px var(--card),0 0 0 6px var(--a)}
.dtab .de{font-size:32px;line-height:1.1}.dtab small{font-size:12px;font-weight:600}
.dsec{border-top:6px solid var(--a);background-image:linear-gradient(180deg,color-mix(in srgb,var(--a) 9%,transparent),transparent 140px)}
button.pr{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.dsec .chip.on{background:var(--a);border-color:var(--a)}
/* ===== Selector de modo ===== */
#picker{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#0b6b63,#0f5a99 55%,#1e40af);padding:20px;overflow:auto}
#picker[hidden]{display:none}
.pk{max-width:780px;text-align:center;color:#e8f5f2}.pk h1{font-size:36px;color:#fff;margin-bottom:6px}
.pkg{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.pkc{flex:1 1 290px;max-width:350px;flex-direction:column;justify-content:center;gap:8px;padding:30px 22px;border-radius:24px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:24px;box-shadow:0 12px 32px #0007;transition:transform .15s;position:relative;text-align:center}
.pkc:hover,.pkc:focus-visible{transform:translateY(-5px) scale(1.03)}
.pke{font-size:56px;line-height:1}.pkc small{font-size:13px;font-weight:400;opacity:.95;line-height:1.4}
.pkc em{position:absolute;top:12px;right:14px;font-size:11px;font-style:normal;background:#0005;padding:2px 9px;border-radius:99px}
.msub{font-size:12px;color:#d8fff6;font-weight:500;padding:0 10px}
/* ===== Historia clínica institucional: tablas formales, casillas e impresión ===== */
.ftw{border:1px solid var(--bd);border-radius:10px;overflow-x:auto}
.ft{border-collapse:collapse;width:100%}
.ft th{background:var(--grad);color:#fff;font-weight:600;padding:8px 10px;text-align:left;border:0;font-size:13px}
.ft td{padding:6px 10px;border:0;border-bottom:1px solid var(--bd);vertical-align:top;white-space:normal}
.ft tr:last-child td{border-bottom:0}
.ft input:not([type=checkbox]),.ft textarea{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%;min-width:0}
.ft input:not([type=checkbox]):hover,.ft textarea:hover{border-color:var(--bd)}
.ft input:not([type=checkbox]):focus,.ft textarea:focus{background:var(--card);border-color:var(--pri)}
.ft textarea{min-height:46px}
.ft input.out{border-color:var(--bad)!important;background:#c8432f1f!important;color:var(--bad);font-weight:700}
.ck{display:inline-flex;align-items:center;gap:6px;margin:3px 16px 3px 0;font-size:13px;color:var(--tx);cursor:pointer}
.ck input{width:auto}
.q{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:5px 0}
.hcc{margin-bottom:10px;padding:12px 14px}.hcc h2{margin-bottom:8px}
.q input.il{width:190px;flex:none}.q input.il{padding:3px 8px}.q input.il.xs{width:64px}.q input.il.s{width:120px}.q input.il.l{width:340px;max-width:100%}
.fic{display:grid;grid-template-columns:repeat(12,1fr);gap:6px 12px}.fic>div{min-width:0}
@media screen and (max-width:900px){.fic{grid-template-columns:repeat(6,1fr)}.fic>div{grid-column:span 3!important}}
.hdr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
.hl{display:flex;gap:12px;align-items:center;justify-content:flex-start}.hr{display:flex;justify-content:flex-end}
.hcc h2.ht{text-align:center;font-size:28px!important;margin:10px 0 6px!important;color:var(--tx)!important;white-space:nowrap}
.lgs{height:58px;display:flex;align-items:center;justify-content:center;position:relative}.lgs label{display:flex;height:100%;align-items:center;justify-content:center;margin:0;cursor:pointer}
.lgs img{height:100%;width:auto;display:block}
.lgph{width:100%;height:100%;border:1.5px dashed var(--bd);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--mut);line-height:1.2}.lgph small{font-size:10px;opacity:.8}
.lx{position:absolute;top:-6px;right:-6px;padding:0 6px!important;font-size:11px}
.hmeta{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid var(--bd);align-items:flex-end}
@media(max-width:1000px){.lgs{height:44px}}
@media(max-width:700px){.hdr{grid-template-columns:1fr;justify-items:center}.hl,.hr{justify-content:center;flex-wrap:wrap}.hmeta{justify-content:center}}
/* Tipo de letra Aptos y casillas con palomita (✓) al seleccionar */
.hcc,.hcc input,.hcc select,.hcc textarea,.hcc button,.hcc label{font-family:Aptos,Calibri,Carlito,'Segoe UI',Arial,sans-serif}
.hcc input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;display:inline-block;flex:none;width:19px;height:19px;margin:0;vertical-align:middle;border:1.6px solid #55655f;border-radius:4px;background:#fff;cursor:pointer;padding:0}
.hcc input[type=checkbox]:checked{border-color:#111}
.hcc input[type=checkbox]:checked::after{content:'';position:absolute;left:5.5px;top:1px;width:5px;height:10px;border:solid #111;border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
.hcc input[type=checkbox]:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ck{gap:7px}
.ic .q{margin:1px 0;gap:2px 14px}.ic .q input.il{padding:3px 8px}.ic p{margin:4px 0 0!important}.ic .ck{margin-top:1px;margin-bottom:1px}
.keep{break-inside:avoid}
.free{border:0!important;background:transparent!important;box-shadow:none;resize:none;overflow:hidden;padding:4px 2px!important;width:100%;min-height:54px;line-height:1.5}
.free:hover{background:#0e8f7810!important}.free:focus{outline:none;background:#2563eb12!important}
.sig{max-width:380px;margin:22px 0 0 auto;text-align:center}.sig input.free{text-align:center;min-height:0}
.sigl{border-top:1px solid var(--tx);margin-top:2px;padding-top:3px;font-size:12px;font-weight:600}
.ftw.sm{display:inline-block;max-width:100%}.ft.sm{width:auto}.ft.sm td,.ft.sm th{padding:2px 8px;font-size:12px}.ft.sm input:not([type=checkbox]){width:56px!important;text-align:center;font-size:12px;padding:2px 4px}
.ft.an .pcd{font-size:10px;color:var(--mut);line-height:1.1}.ft.an td,.ft.an th{padding:2px 8px}.ft.an td+td,.ft.an th+th,.ft.sm td+td,.ft.sm th+th{text-align:center}.ft.an input:not([type=checkbox]){width:88px!important}.ft.an input.dt{width:96px!important}
.ft.rec td{border-bottom:1px solid #9fb0ab}.ft.rec td+td,.ft.rec th+th{border-left:1px solid #9fb0ab}
@media print{
 @page{size:letter;margin:7mm 8mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 aside,.top,#toast,#picker,#welcome,.noprint{display:none!important}
 body{display:block;background:#fff;color:#000;font-size:9.5px;line-height:1.22}main{padding:0}
 .card{border:0!important;border-top:.75pt solid #777!important;border-radius:0;box-shadow:none;margin:0 0 3px;padding:3px 0;break-inside:auto;background:none}
 .hcc{padding:3px 0;margin:0 0 3px}.hcc h2{color:#000!important;font-size:11px!important;margin:0 0 2px;break-after:avoid}
 .ftw{border:.5pt solid #888;border-radius:0;break-inside:avoid}
 .ft th{background:#e6e6e6!important;color:#000;font-size:9px;padding:1px 4px;border-bottom:.5pt solid #888}
 .ft td{padding:1px 4px;border-bottom:.5pt solid #bbb}
 .ft.rec td{border-bottom:.5pt solid #777}.ft.rec td+td,.ft.rec th+th{border-left:.5pt solid #777}
 .ft.sm td,.ft.sm th{padding:0 5px;font-size:8.5px}.ft.sm input:not([type=checkbox]){width:44px!important;font-size:8.5px}.ft.an input:not([type=checkbox]){width:64px!important}.ft.an input.dt{width:66px!important}.ft tr{break-inside:avoid}.ft.rec textarea{min-height:26px}
 input,select,textarea{border:0!important;background:transparent!important;padding:0 2px!important;font-size:9.5px;min-height:0;appearance:none;-webkit-appearance:none}
 ::placeholder{color:transparent}
 textarea{resize:none!important}input[type=date]::-webkit-calendar-picker-indicator{display:none}

 .hcc input[type=checkbox]{width:11px;height:11px;border-width:1px}.hcc input[type=checkbox]:checked::after{left:3px;top:0;width:3px;height:6px;border-width:0 1.6px 1.6px 0}
}
/* ===== Animación de bienvenida ===== */
#welcome{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;text-align:center;color:#fff;cursor:pointer;
 background:linear-gradient(135deg,#0e8f78,#14b8a6,#2563eb,#0e8f78);background-size:300% 300%;animation:wbg 6s ease infinite;transition:opacity .7s ease,transform .7s ease}
#welcome.out{opacity:0;transform:scale(1.06);pointer-events:none}
@keyframes wbg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wl{position:relative;z-index:2;padding:20px}
.wbrand{font-size:15px;letter-spacing:.35em;text-transform:uppercase;font-weight:700;opacity:0;animation:wup .8s .1s ease forwards}
#welcome h1{font-size:clamp(34px,7vw,72px);line-height:1.1;margin:14px 0 22px;font-weight:800;text-shadow:0 4px 24px #0004}
#welcome h1 span{display:block;opacity:0;transform:translateY(24px) scale(.96);animation:wup .9s ease forwards}
#welcome h1 .w1{animation-delay:.5s}#welcome h1 .w2{animation-delay:.95s;color:#fef08a}
.wbar{width:min(260px,60vw);height:5px;border-radius:99px;background:#ffffff40;margin:0 auto;overflow:hidden;opacity:0;animation:wup .6s 1.4s ease forwards}
.wbar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;animation:wfill 1.7s 1.4s ease forwards}
.wsub{font-size:13px;opacity:0;margin:12px 0 0;animation:wup .6s 1.8s ease forwards}
@keyframes wup{to{opacity:1;transform:none}}
@keyframes wfill{to{width:100%}}
.wf{position:absolute;font-size:clamp(30px,5vw,54px);opacity:0;animation:wfloat 5s ease-in-out infinite,wshow .8s ease forwards;filter:drop-shadow(0 4px 8px #0003)}
.f1{left:8%;top:18%;animation-delay:.2s}.f2{left:84%;top:14%;animation-delay:.5s}.f3{left:14%;top:70%;animation-delay:.8s}.f4{left:80%;top:68%;animation-delay:.3s}
.f5{left:44%;top:8%;animation-delay:.6s}.f6{left:50%;top:84%;animation-delay:.9s}.f7{left:90%;top:42%;animation-delay:.4s}.f8{left:4%;top:44%;animation-delay:.7s}
@keyframes wfloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
@keyframes wshow{to{opacity:.95}}
@media(prefers-reduced-motion:reduce){#welcome,.wf,.wbrand,#welcome h1 span,.wbar,.wbar i,.wsub{animation:none!important;opacity:1;transform:none}.wbar i{width:100%}.wf{display:none}}
/* ===== Responsivo ===== */
@media(max-width:1100px){.eqwrap{grid-template-columns:1fr}}
@media(max-width:820px){aside{position:fixed;left:-250px}aside.open{left:0}#burger{display:inline-flex}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Historia clínica en pantalla: Aptos (cuerpo) — títulos 16 pt · textos 14 pt ===== */

<script>
/* =====================================================================

   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;

/* Semáforo de adecuación: < ADQ[0] % = falta (amarillo) · ADQ[0]-ADQ[1] % = óptimo (verde) · > ADQ[1] % = se pasó (rojo).

const ADQ=[90,110];
const adq=q=>q==null||!isFinite(q)?{c:'var(--mut)',t:'—'}:q<ADQ[0]?{c:'var(--warn)',t:'Falta'}:q<=ADQ[1]?{c:'var(--ok)',t:'Óptimo'}:{c:'var(--bad)',t:'Se pasó'};
const pill=q=>{const a=adq(q);return `<span class="pill" style="background:${a.c}">${q==null||!isFinite(q)?'—':fx(q,0)+' %'} · ${a.t}</span>`};

   DB.sel      id del paciente activo   · DB.csel[idPaciente] consulta activa

let MODE=localStorage.getItem('nutriclin_modo');if(!MODOS[MODE])MODE='priv';
const KEY=MODE==='inst'?'nutriclin_v2_inst':'nutriclin_v2';
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{p:[],sel:null,csel:{},theme:null,smae:null};
const save=()=>{const s=JSON.stringify(DB);localStorage.setItem(KEY,s);mirror(s)};
/* Copia espejo automática en IndexedDB (segundo almacén del navegador): última versión + una copia por día (7 días) */
var _mt;
function mirror(s){clearTimeout(_mt);_mt=setTimeout(()=>idbPut(s),700)}
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('nutriclin_mirror',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(db,k){return new Promise((res,rej)=>{const r=db.transaction('s').objectStore('s').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(s){try{const db=await idbOpen(),rec={t:Date.now(),n:(DB.p||[]).length,d:s},day=today();
 await new Promise((res,rej)=>{const t=db.transaction('s','readwrite'),st=t.objectStore('s');st.put(rec,KEY+'|latest');st.put(rec,KEY+'|'+day);
  const rq=st.getAllKeys();rq.onsuccess=()=>{const ks=rq.result.filter(x=>String(x).startsWith(KEY+'|2')).sort();ks.slice(0,Math.max(0,ks.length-7)).forEach(x=>st.delete(x))};
  t.oncomplete=res;t.onerror=()=>rej(t.error)});db.close()}catch(e){}}
const cur=()=>DB.p.find(x=>x.id===DB.sel);
const curC=()=>{const p=cur();if(!p||!p.cons||!p.cons.length)return null;return p.cons.find(c=>c.id===DB.csel[p.id])||p.cons[p.cons.length-1]};
function newCons(p){const l=[...(p.cons||[])].sort((a,b)=>a.fecha.localeCompare(b.fecha)).pop()||{};
 return{id:uid(),fecha:today(),peso:'',est:l.est||p.est||'',graso:'',musc:'',cin:'',abd:'',cad:'',bra:'',mus:'',

/* Descomprime RAW → CDC[clave][sexo] = [[edad_meses,L,M,S],...]   (sexo 1=niño, 2=niña) */
const CDC={};for(const k in RAW){const[ag,b,g]=RAW[k];CDC[k]={1:b.split(' ').map((r,i)=>[ag[i],...r.split(',').map(Number)]),2:g.split(' ').map((r,i)=>[ag[i],...r.split(',').map(Number)])}}

/* Interpolación lineal de L, M, S a la edad exacta en meses */
function lms(k,sx,mes){const t=CDC[k][sx],n=t.length;if(mes<t[0][0]||mes>t[n-1][0]+.6)return null;
 if(mes>=t[n-1][0])return t[n-1].slice(1);
 let i=0;while(i<n-2&&mes>t[i+1][0])i++;const a=t[i],b=t[i+1],f=(mes-a[0])/(b[0]-a[0]);
 return[1,2,3].map(j=>a[j]+(b[j]-a[j])*f)}
/* Z = ((X/M)^L − 1)/(L·S)  si L≠0 ;  Z = ln(X/M)/S  si L=0   (fórmula oficial CDC) */
const zs=(x,[L,M,S])=>L?((x/M)**L-1)/(L*S):Math.log(x/M)/S;
/* Percentil = Φ(Z)·100, función de distribución normal estándar (Abramowitz-Stegun) */
const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),
 q=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-q:q};
function dx(k,z,pc){if(k==='bmi')return pc<5?'Bajo peso':pc<85?'Normal':pc<95?'Sobrepeso':'Obesidad';
 return z<-2?'Bajo (< −2 DE)':z>2?'Alto (> +2 DE)':'Normal'}

/* Resultado pediátrico (<18 años): Peso/Edad, Talla/Edad, IMC/Edad con edad exacta en la fecha de consulta */
function pedHTML(c,p){const e=edad(p.nac,c.fecha);if(!e||e.a>=18)return '';
 const pe=num(c.peso),t=num(c.est);if(!pe||!t)return '<div class="msg">Captura peso y estatura para calcular percentiles y Z-scores.</div>';
 const sx=p.sexo==='M'?1:2,inf=e.dec<24,age=e.dec,imc=pe/(t/100)**2;
 const rows=[['Peso/Edad',inf?'wti':'wt',pe,'kg'],[inf?'Longitud/Edad':'Talla/Edad',inf?'len':'sta',t,'cm'],['IMC/Edad','bmi',imc,'kg/m²']];
 return '<div class="wrap"><table><tr><th>Indicador<th class="n">Valor<th class="n">Z-score<th class="n">Percentil<th>Interpretación</tr>'+
 rows.map(([n,k,v,u])=>{const L=k==='bmi'&&inf?null:lms(k,sx,age);
  if(!L)return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td colspan=3>${k==='bmi'?'La CDC define IMC/Edad desde los 24 meses':'Fuera de rango de las tablas CDC'}`;
  const z=zs(v,L),pc=cdf(z)*100;return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td class="n">${fx(z,2)}<td class="n">P${fx(pc,1)}<td>${dx(k,z,pc)}`}).join('')+
 '</table></div><p class="note">Referencia CDC 2000 (EE. UU.). En menores de 2 años la OMS suele preferirse; los percentiles son una herramienta de apoyo, no un diagnóstico.</p>'}

/* Edad exacta (años + meses + meses decimales) a la fecha de referencia */
function edad(nac,ref){if(!nac)return null;const n=new Date(nac+'T00:00'),h=ref?new Date(ref+'T00:00'):new Date();
 let m=(h.getFullYear()-n.getFullYear())*12+h.getMonth()-n.getMonth();if(h.getDate()<n.getDate())m--;
 return m<0?null:{a:Math.floor(m/12),m:m%12,tot:m,dec:(h-n)/(30.4375*864e5)}}
const edTxt=e=>e?`${e.a} años ${e.m} meses`:'—';
/* GEB en kcal/día. p=kg · t=cm · e=años · s='M'|'F' */
const FM={
 mif:['Mifflin-St Jeor',(p,t,e,s)=>10*p+6.25*t-5*e+(s==='M'?5:-161)],
 hb:['Harris-Benedict',(p,t,e,s)=>s==='M'?66.5+13.75*p+5.003*t-6.755*e:655.1+9.563*p+1.85*t-4.676*e],
 val:['Valencia (población mexicana, ≥18 a)',(p,t,e,s)=>{if(e<18)return null;const i=e<30?0:e<60?1:2;
   const c=s==='M'?[[13.37,747],[13.08,693],[14.21,429]]:[[11.02,679],[10.92,677],[10.98,520]];return c[i][0]*p+c[i][1]}],
 sch:['Schofield FAO/OMS (<18 a)',(p,t,e,s)=>{if(e>=18)return null;const m=s==='M';
   return e<3?(m?60.9*p-54:61*p-51):e<10?(m?22.7*p+495:22.5*p+499):(m?17.5*p+651:12.2*p+746)}]};
const AF=[['Sedentario',1.2],['Actividad ligera',1.375],['Actividad moderada',1.55],['Actividad intensa',1.725],['Muy intensa',1.9]];
/* GEB → gasto por actividad (GEB×(AF−1)) → ETA (% del GEB+actividad) → GET total */
function en(c,p){const e=edad(p.nac,c.fecha),pe=num(c.peso),t=num(c.est);if(!e||!pe||!t)return null;
 const fm=c.formula||(e.a<18?'sch':'mif'),geb=FM[fm][1](pe,t,e.a,p.sexo),imc=pe/(t/100)**2;if(geb==null)return{imc,err:1};
 const af=num(c.af)||1.2,eP=(c.eta===''||c.eta==null)?10:+c.eta,act=geb*(af-1),et=(geb+act)*eP/100;
 const adj=c.obj==='def'?-(num(c.objk)??500):c.obj==='sup'?(num(c.objk)??300):0;
 return{imc,geb,act,eta:et,etaP:eP,get:geb+act,tot:geb+act+et,adj,obj:geb+act+et+adj}}

/* =====================================================================
   5b. COMPOSICIÓN CORPORAL: rangos de referencia (% del peso) → bajo / óptimo / elevado
   · Masa grasa: Gallagher et al. 2000 (rangos "saludables" por edad y sexo, adultos).
   · Masa muscular: masa muscular esquelética relativa (Janssen et al. 2002), aprox. hombre 33-39 %, mujer 24-30 %.
   · Masa residual: Würch (hombre ≈24.1 %, mujer ≈20.9 % del peso) con margen de ±4 puntos.
   Son guías orientativas para adultos (≥18 años); en deportistas o adultos mayores interpreta con criterio clínico.
   Edita los rangos aquí si usas otra referencia.
   ===================================================================== */
function refComp(sx,age,k){const m=sx==='M';
 if(k==='graso')return age<40?(m?[8,19]:[21,32]):age<60?(m?[11,21]:[23,33]):(m?[13,24]:[24,35]);
 if(k==='musc')return m?[33,39]:[24,30];
 return m?[20.1,28.1]:[16.9,24.9]}
function stComp(sx,age,k,q){const[a,b]=refComp(sx,age,k);
 if(q<a)return{t:'Bajo',c:'var(--warn)',r:[a,b]};
 if(q>b)return{t:'Elevado',c:k==='graso'?'var(--bad)':k==='musc'?'#2f7fd1':'var(--warn)',r:[a,b]};
 return{t:'Óptimo',c:'var(--ok)',r:[a,b]}}

/* ---------- ALIMENTOS SMAE · RECORDATORIO 24 H (base del Excel SmaeR24) ---------- */
/* columnas de cada alimento: 0 nombre · 1 categoría · 2 cantidad · 3 unidad · 4 peso bruto · 5 peso neto · 6 kcal · 7 prot · 8 lípidos · 9 HC · 10 AGsat · 11 AGmono · 12 AGpoli · 13 colesterol · 14 azúcar · 15 fibra · 16 vit A · 17 vit C · 18 ác. fólico · 19 calcio · 20 hierro · 21 potasio · 22 sodio · 23 fósforo · 24 etanol · 25 IG · 26 carga glicémica */
const SMR_M=[['des','Desayuno'],['cm','Colación matutina'],['alm','Almuerzo'],['cv','Colación vespertina'],['cen','Cena']];
const SMR_X=[[6,'Energía','kcal',0],[7,'Proteína','g',1],[8,'Lípidos','g',1],[9,'Hidratos de carbono','g',1],[15,'Fibra','g',1],[14,'Azúcar','g',1],[10,'AG saturados','g',1],[13,'Colesterol','mg',0],[22,'Sodio','mg',0],[19,'Calcio','mg',0],[20,'Hierro','mg',1],[21,'Potasio','mg',0],[16,'Vitamina A','µg RE',0],[17,'Ácido ascórbico','mg',1]];
const smrS=()=>{const p=cur();DB.r24c=DB.r24c||{};const k=p?p.id:'_';return DB.r24c[k]=DB.r24c[k]||{}};
function smrR(){const S=smrS(),f1=v=>fx(v,1);let tot=SMR_X.map(()=>0),h='';
 SMR_M.forEach(([k,l])=>{const L=S[k]||[];if(!L.length)return;let kc=0;
  h+=`<h3 style="margin:14px 0 6px">${l}</h3><div class="wrap"><table><thead><tr><th>Alimento<th>Porción<th class="n">Porciones<th class="n">kcal<th class="n">Prot (g)<th class="n">Lip (g)<th class="n">HC (g)<th></tr></thead><tbody>`+L.map((e,j)=>{const r=SMR[e.i];SMR_X.forEach(([ix],q)=>{if(r[ix]!=null)tot[q]+=r[ix]*e.n});kc+=(r[6]||0)*e.n;
   return `<tr><td>${esc(r[0])}<td>${smrQ(r[2]*e.n)} ${esc(r[3])}<td class="n"><input type="number" min="0" step="0.25" value="${e.n}" data-k="${k}" data-j="${j}" style="width:80px"><td class="n">${fx((r[6]||0)*e.n,0)}<td class="n">${f1((r[7]||0)*e.n)}<td class="n">${f1((r[8]||0)*e.n)}<td class="n">${f1((r[9]||0)*e.n)}<td><button class="s d" data-del="${k}:${j}">✕</button>`}).join('')+`<tr><td colspan=3><b>Subtotal</b><td class="n"><b>${fx(kc,0)}</b><td colspan=4></tbody></table></div>`});
 if(!h)return '<h2>Recordatorio de 24 horas</h2><p class="note">Aún no hay alimentos. Busca arriba y pulsa <b>+</b> para agregarlos al tiempo de comida elegido.</p>';
 const kc=tot[0],pc=[tot[1]*4,tot[2]*9,tot[3]*4].map(v=>kc?v/kc*100:0);
 return '<h2>Recordatorio de 24 horas</h2>'+h+`<h3 style="margin:18px 0 6px">Total del día</h3><div class="wrap"><table><tbody>`+SMR_X.map(([ix,l,u,d],q)=>`<tr><th style="width:220px">${l}<td class="n"><b>${fx(tot[q],d)}</b> ${u}`).join('')+`</tbody></table></div><p class="note">Distribución de energía: proteína ${fx(pc[0],0)} % · lípidos ${fx(pc[1],0)} % · hidratos de carbono ${fx(pc[2],0)} %. Los datos marcados ND (no disponible) en la base se cuentan como 0.</p><p><button data-a="tohc">Pasar a la historia clínica</button> <button class="g" data-a="clr">Limpiar recordatorio</button></p>`}
V.smr={t:'Calculadora de recordatorio 24 h (SMAE)',h(){const p=cur();
 return `<div class="card"><p class="note" style="margin-top:0">Base SMAE con ${SMR.length} alimentos y su aporte nutrimental por porción. Busca el alimento, agrégalo al tiempo de comida y ajusta cuántas porciones consumió${p?' '+esc(p.nombre):' el paciente'}.</p><div class="grid" style="align-items:end"><div style="grid-column:span 2"><label>Buscar alimento</label><input id="sq" type="search" placeholder="Ej. tortilla, pollo, manzana…" autofocus></div><div><label>Categoría</label><select id="sc"><option value="">Todas</option>${SMR_C.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select></div><div><label>Agregar a</label><select id="sm">${SMR_M.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div><p id="scnt" class="note"></p></div>

  $('#r24box').onchange=e=>{const t=e.target;if(t.dataset.k===undefined)return;const S=smrS(),x=(S[t.dataset.k]||[])[+t.dataset.j];if(!x)return;const v=num(t.value);x.n=v>0?v:1;save();paint()};

   else if(b.dataset.a==='clr'){if(confirm('¿Limpiar todo el recordatorio?')){DB.r24c[cur()?cur().id:'_']={};save();paint()}}
   else if(b.dataset.a==='tohc'){const p=cur();if(!p)return toast('Selecciona un paciente primero');const I=p.hci=p.hci||{};
    if(SMR_M.some(([k])=>String(I['rc.'+k+'.ali']||'').trim())&&!confirm('La historia clínica ya tiene datos en el recordatorio de 24 h. ¿Reemplazar los tiempos que tienen alimentos aquí?'))return;
    SMR_M.forEach(([k])=>{const L=S[k]||[];if(!L.length)return;I['rc.'+k+'.ali']=L.map(e=>SMR[e.i][0]+' ('+smrQ(SMR[e.i][2]*e.n)+' '+SMR[e.i][3]+')').join('\n');delete I['rc.'+k+'.cant']});save();toast('Pasado al recordatorio de la historia clínica')}}}};

function avHTML(p,size=36,av){

function imgURL(file,max,square,q,png){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),x=c.getContext('2d');
  if(square){c.width=c.height=max;const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
  res(c.toDataURL(png?'image/png':'image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

 if(t==='sel')return `<div><label for="${id}">${l}</label><select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
 return `<div><label for="${id}">${l}</label><input id="${id}" type="${t==='num'?'number':t==='dl'?'text':t}" ${t==='num'?'step="any"':''} value="${esc(v)}" ${t==='dl'?`list="dl-${k}"`:''} autocomplete="off">${t==='dl'?`<datalist id="dl-${k}">${o.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}</div>`}

   `<div class="card wrap"><table><tr>${cols.map(f=>`<th>${f[1]}`).join('')}<th></tr>${rows.map(r=>`<tr>${cols.map(f=>`<td>${cellHTML(f,r[f[0]])}`).join('')}<td class="n">${M.print?`<button class="s" data-x="print" data-id="${r.id}">Imprimir</button> `:''}<button class="s g" data-x="edit" data-id="${r.id}">Editar</button> <button class="s d" data-x="del" data-id="${r.id}">✕</button>`).join('')||`<tr><td colspan="${cols.length+1}">Aún no hay registros.`}</table></div>`},

 if(f.type.startsWith('image/')){const d=await imgURL(f,imgOnly?900:1400,false,.8);return{name:f.name,type:'image/jpeg',size:Math.round(d.length*.75),data:d}}

  :'<div class="msg">Aún no hay equivalentes. Captura equivalentes en el cuadro de la Consulta o agrega alimentos desde el catálogo (botón +).</div>';
 const rows=(edit?G:used),sumRow=(l,k,d)=>`<tr class="h"><td>${l}${M.map(m=>`<td class="n">${fx(mt[m][k],d)}`).join('')}<td class="n">${fx(T[k],d)}`;
 const t2=`<div class="wrap"><table><tr><th>Grupo${M.map(m=>`<th class="n">${m}`).join('')}<th class="n">Total</tr>
  ${rows.map(g=>`<tr><td>${esc(g)}${M.map((m,mi)=>{const v=cell[g][m]||0,hint=fp[g][m]?` title="Incluye ${qn(fp[g][m])} de alimentos específicos del catálogo"`:'';

}

 $('.brand').innerHTML=`NutriClin<div class="msub">${m.e} ${m.n}${DB.org?' · '+esc(DB.org):''}</div><button class="g s" id="swmode" style="margin:8px 0 0 0;color:#c9e6df;border-color:#ffffff33">⇄ Cambiar modo</button>`;

 <div class="grid" style="align-items:end"><div><label for="org">Nombre de la institución o consultorio (opcional)</label><input id="org" value="${esc(DB.org)}"></div><div><button id="bmode">⇄ Cambiar modo</button></div></div></div>`;

/* ---------- Plantilla de historia clínica ---------- */
const HC_TIPOS=[['text','Texto corto'],['area','Texto largo'],['num','Número'],['date','Fecha'],['sel','Lista de opciones']];
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const hf=(l,tp='text',o)=>({id:rid(),l,tp,o:o||[]}),hs=(t,f)=>({id:rid(),t,f});
const SN=['Sí','No'];
function hcBase(m){
 if(m==='inst')return{nombre:'Historia clínica nutricional · Institución',ref:null,secs:[
  hs('Identificación institucional',[hf('No. de expediente'),hf('Servicio / área'),hf('Cama / habitación'),hf('Fecha de ingreso','date'),hf('Médico tratante'),hf('Diagnóstico médico','area'),hf('Derechohabiencia / seguro')]),
  hs('Antecedentes',[hf('Heredofamiliares','area'),hf('Personales patológicos','area'),hf('Quirúrgicos','area'),hf('Alergias e intolerancias alimentarias'),hf('Medicamentos actuales','area')]),
  hs('Valoración del estado nutricional',[hf('Herramienta de tamizaje','sel',['NRS-2002','MUST','MNA','Otra']),hf('Puntaje del tamizaje','num'),hf('Riesgo nutricional','sel',['Sin riesgo','Riesgo bajo','Riesgo medio','Riesgo alto']),hf('Pérdida de peso reciente'),hf('Vía de alimentación','sel',['Oral','Enteral','Parenteral','Mixta']),hf('Dieta prescrita'),hf('Tolerancia a la dieta','area'),hf('Disfagia','sel',SN),hf('Edema','sel',['No','Leve','Moderado','Severo'])]),
  hs('Evolución y plan',[hf('Interconsultas','area'),hf('Observaciones','area'),hf('Plan al egreso','area')])]};
 return{nombre:'Historia clínica nutricional · Consulta privada',ref:null,secs:[
  hs('Ficha y motivo',[hf('Ocupación'),hf('Estado civil','sel',['Soltero/a','Casado/a','Unión libre','Divorciado/a','Viudo/a']),hf('Motivo de consulta','area'),hf('Objetivo del paciente','area')]),
  hs('Antecedentes',[hf('Heredofamiliares','area'),hf('Personales patológicos','area'),hf('Quirúrgicos','area'),hf('Alergias e intolerancias alimentarias'),hf('Medicamentos y suplementos','area')]),
  hs('Estilo de vida',[hf('Horario de trabajo / estudio'),hf('Quién prepara los alimentos'),hf('Come fuera de casa','sel',['Nunca','Ocasional','Frecuente']),hf('Tabaquismo','sel',['No','Ocasional','Diario']),hf('Alcohol','sel',['No','Ocasional','Frecuente']),hf('Actividad física'),hf('Horas de sueño','num')]),
  hs('Historia alimentaria',[hf('Alimentos que no le gustan','area'),hf('Alimentos preferidos','area'),hf('Apetito','sel',['Disminuido','Normal','Aumentado']),hf('Consumo de agua (L/día)','num')]),
  hs('Gastrointestinal',[hf('Evacuaciones','sel',['Estreñimiento','Normal','Diarrea','Alternado']),hf('Síntomas digestivos','area')])]}}
function getHC(){if(!DB.hc||!DB.hc.secs){DB.hc=hcBase(MODE);save()}return DB.hc}
const HS={cfg:false};
function parseCSV(txt){txt=txt.replace(/^\uFEFF/,'');const l1=txt.split(/\r?\n/)[0]||'',d=l1.split(';').length>l1.split(',').length?';':',',rows=[];let row=[],c='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(c);rows.push(row);row=[];c=''}else c+=ch}
 if(c!==''||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const tipoOf=s=>{const t=nrm2(s);return /larg|area|parraf|abiert/.test(t)?'area':/^num|cant/.test(t)?'num':/fech|date/.test(t)?'date':/list|sel|opci|elegir/.test(t)?'sel':'text'};
function csvToTemplate(txt){const rows=parseCSV(txt);if(rows.length&&nrm2(rows[0][0]).startsWith('secci'))rows.shift();
 const map=new Map();rows.forEach(r=>{const s=(r[0]||'').trim()||'General',l=(r[1]||'').trim();if(!l)return;const tp=tipoOf(r[2]),o=(r[3]||'').trim();
  if(!map.has(s))map.set(s,[]);map.get(s).push(hf(l,tp,tp==='sel'&&o?(o.includes('|')?o.split('|'):o.split(/[;,]/)).map(x=>x.trim()).filter(Boolean):[]))});
 return{secs:[...map].map(([t,f])=>hs(t,f))}}
function jsonToTemplate(txt){const j=JSON.parse(txt);if(!j||!Array.isArray(j.secs))throw 0;
 return{nombre:j.nombre,secs:j.secs.map(s=>hs(String(s.t||'Sección'),(s.f||[]).filter(f=>f&&f.l).map(f=>({id:rid(),l:String(f.l),tp:HC_TIPOS.some(x=>x[0]===f.tp)?f.tp:'text',o:Array.isArray(f.o)?f.o.map(String):[]}))))}}
/* Aplica una plantilla nueva conservando los datos ya capturados de campos con el mismo nombre */
function applyTemplate(t){const old=getHC(),mp=new Map();old.secs.forEach(s=>s.f.forEach(f=>mp.set(nrm2(f.l),f.id)));
 let n=0;t.secs.forEach(s=>s.f.forEach(f=>{const k=nrm2(f.l);if(mp.has(k)){f.id=mp.get(k);mp.delete(k)}n++}));
 DB.hc={nombre:t.nombre||old.nombre,ref:old.ref,secs:t.secs};save();return n}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const hcField=(f,v)=>{const id='h-'+f.id,l=`<label for="${id}">${esc(f.l)}</label>`;
 if(f.tp==='area')return `<div style="grid-column:1/-1">${l}<textarea id="${id}" data-h="${f.id}">${esc(v)}</textarea></div>`;
 if(f.tp==='sel')return `<div>${l}<select id="${id}" data-h="${f.id}"><option value=""></option>${(f.o||[]).map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}${v&&!(f.o||[]).includes(v)?`<option selected>${esc(v)}</option>`:''}</select></div>`;
 return `<div>${l}<input id="${id}" data-h="${f.id}" type="${f.tp==='num'?'number':f.tp==='date'?'date':'text'}" ${f.tp==='num'?'step="any"':''} value="${esc(v)}"></div>`};
function hcFind(id){for(const s of getHC().secs){const i=s.f.findIndex(f=>f.id===id);if(i>=0)return{s,i,f:s.f[i]}}}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
V.hc={t:'Historia clínica',
 h(){const H=getHC(),m=MODOS[MODE];
  if(!HS.cfg){const p=hcPat();if(!p)return noP+'<p><button class="g" data-x="cfg">⚙ Configurar plantilla</button></p>';
   return `<div class="gap" style="margin-bottom:12px"><h2 style="margin:0;flex:1">${esc(H.nombre)}</h2>${H.ref?`<a href="${H.ref.data}" download="${esc(H.ref.name)}"><button class="g s" type="button">📎 Formato de referencia</button></a>`:''}<button class="g s" data-x="cfg">⚙ Configurar plantilla</button></div>`+
    (H.secs.map(s=>`<div class="card" style="border-top:5px solid ${m.a}"><h2>${esc(s.t)}</h2><div class="grid">${s.f.map(f=>hcField(f,(p.hcd||{})[f.id])).join('')}</div></div>`).join('')||'<div class="msg">La plantilla no tiene campos. Usa “Configurar plantilla”.</div>')}
  return `<div class="card" style="border-top:5px solid ${m.a}"><div class="gap"><h2 style="margin:0;flex:1">Configurar historia clínica · ${m.e} ${m.n}</h2><button class="g" data-x="done">← Volver a la historia</button></div>
   <p class="note">Cada modo tiene su propia plantilla. Importa la tuya (CSV con columnas <b>Sección, Campo, Tipo, Opciones</b> o JSON) o edítala aquí. Los datos ya capturados se conservan en los campos que mantengan el mismo nombre.</p>
   <div class="grid" style="margin-top:8px"><div style="grid-column:span 2"><label>Nombre de la plantilla</label><input data-cn="nombre" value="${esc(H.nombre)}"></div></div>
   <div class="gap" style="margin-top:12px"><button data-x="imp">⬆ Importar plantilla (.csv / .json)</button><input type="file" id="hc-imp" accept=".csv,.json,.txt" hidden>
   <button class="g" data-x="exp">⬇ Exportar plantilla</button><button class="g" data-x="csvex">Ejemplo de CSV</button>
   <label class="g btnlike" for="hc-ref">📎 Subir formato de referencia</label><input type="file" id="hc-ref" accept="image/*,.pdf" hidden>${H.ref?`<span class="note" style="margin:0">${esc(H.ref.name)}</span><button class="g s" data-x="refdel">Quitar</button>`:''}
   <button class="d" data-x="reset" style="margin-left:auto">Restaurar plantilla base</button></div></div>`+
  H.secs.map(s=>`<div class="card"><div class="gap"><input data-cs="${s.id}" value="${esc(s.t)}" style="flex:1;min-width:200px;font-weight:700" aria-label="Nombre de la sección">
    <button class="s g" data-x="su" data-s="${s.id}">↑</button><button class="s g" data-x="sd" data-s="${s.id}">↓</button><button class="s d" data-x="sdel" data-s="${s.id}">✕ Sección</button></div>
   <div class="wrap"><table><tr><th>Campo<th>Tipo<th>Opciones (separadas por coma)<th></tr>
   ${s.f.map(f=>`<tr><td><input data-cf="${f.id}" data-k="l" value="${esc(f.l)}" style="min-width:220px"><td><select data-cf="${f.id}" data-k="tp">${HC_TIPOS.map(([k,n])=>`<option value="${k}"${f.tp===k?' selected':''}>${n}</option>`).join('')}</select>
    <td><input data-cf="${f.id}" data-k="o" value="${esc((f.o||[]).join(', '))}" style="min-width:240px"${f.tp==='sel'?'':' disabled'}>
    <td class="n"><button class="s g" data-x="fu" data-f="${f.id}">↑</button> <button class="s g" data-x="fd" data-f="${f.id}">↓</button> <button class="s d" data-x="fdel" data-f="${f.id}">✕</button>`).join('')||'<tr><td colspan=4>Sin campos.'}</table></div>
   <p style="margin-bottom:0"><button class="s" data-x="fa" data-s="${s.id}">＋ Campo</button></p></div>`).join('')+
  '<p><button data-x="sa">＋ Nueva sección</button></p>'},
 i(){const v=$('#view'),H=getHC();
  v.oninput=e=>{const t=e.target,d=t.dataset;
   if(hcPInput(e))return;
   if(d.h){const p=hcPat();if(!p)return;p.hcd=p.hcd||{};p.hcd[d.h]=t.value;if(DB.p.includes(p))save()}
   else if(d.cn){H.nombre=t.value;save()}
   else if(d.cs){const s=H.secs.find(x=>x.id===d.cs);if(s){s.t=t.value;save()}}
   else if(d.cf&&d.k!=='tp'){const r=hcFind(d.cf);if(r){r.f[d.k]=d.k==='o'?t.value.split(',').map(x=>x.trim()).filter(Boolean):t.value;save()}}};
  v.onchange=async e=>{const t=e.target,d=t.dataset;
   if(hcPInput(e))return;
   if(d.h){const p=hcPat();if(p){p.hcd=p.hcd||{};p.hcd[d.h]=t.value;if(DB.p.includes(p))save()}}
   else if(d.cf&&d.k==='tp'){const r=hcFind(d.cf);if(r){r.f.tp=t.value;save();render()}}
   else if(t.id==='hc-imp'){const f=t.files[0];if(!f)return;try{const tx=await f.text(),tpl=/\.json$/i.test(f.name)?jsonToTemplate(tx):csvToTemplate(tx);
     if(!tpl.secs.length)throw 0;if(!confirm('Se reemplazará la plantilla actual por la importada ('+tpl.secs.reduce((a,s)=>a+s.f.length,0)+' campos). ¿Continuar?'))return;
     const n=applyTemplate(tpl);toast(n+' campos importados');render()}catch{toast('No se pudo leer: revisa el formato (Sección, Campo, Tipo, Opciones)')}}
   else if(t.id==='hc-ref'){const f=t.files[0];if(!f)return;try{const a=await attach(f,false);if(a){H.ref=a;try{save()}catch{H.ref=null;toast('Almacenamiento lleno')}render()}}catch{toast('No se pudo leer el archivo')}}};
  v.onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x,d=b.dataset;
   const si=()=>H.secs.findIndex(s=>s.id===d.s);
   if(x==='newhc'){HS.draft=newDraft();render();return}
   if(x==='cfg')HS.cfg=true;else if(x==='done')HS.cfg=false;
   else if(x==='imp'){$('#hc-imp').click();return}
   else if(x==='exp'){download('plantilla-historia-clinica.json',JSON.stringify({nombre:H.nombre,secs:H.secs.map(s=>({t:s.t,f:s.f.map(f=>({l:f.l,tp:f.tp,o:f.o}))}))},null,1),'application/json');return}
   else if(x==='csvex'){download('ejemplo-historia-clinica.csv','\uFEFFSección,Campo,Tipo,Opciones\nAntecedentes,Alergias,texto,\nAntecedentes,Heredofamiliares,texto largo,\nEstilo de vida,Tabaquismo,lista,No|Ocasional|Diario\nEstilo de vida,Horas de sueño,número,\nIngreso,Fecha de ingreso,fecha,\n','text/csv');return}
   else if(x==='refdel'){H.ref=null;save()}
   else if(x==='reset'){if(!confirm('Se restaurará la plantilla base de este modo. Los datos capturados de campos que ya no existan dejarán de mostrarse. ¿Continuar?'))return;DB.hc=hcBase(MODE);save()}
   else if(x==='sa'){H.secs.push(hs('Nueva sección',[hf('Nuevo campo')]));save()}
   else if(x==='su'){mv(H.secs,si(),-1);save()}else if(x==='sd'){mv(H.secs,si(),1);save()}
   else if(x==='sdel'){if(!confirm('¿Eliminar esta sección y sus campos?'))return;H.secs.splice(si(),1);save()}
   else if(x==='fa'){H.secs[si()].f.push(hf('Nuevo campo'));save()}
   else if(x==='fu'||x==='fd'){const r=hcFind(d.f);if(r){mv(r.s.f,r.i,x==='fu'?-1:1);save()}}
   else if(x==='fdel'){const r=hcFind(d.f);if(r){r.s.f.splice(r.i,1);save()}}
   render()}}};

/* =====================================================================
   8d. HISTORIA CLÍNICA INSTITUCIONAL — formato SANNAFARM · Gobierno del Estado de Campeche
   Se muestra en el modo "Institución". Todo se guarda en p.hci; la ficha de identificación y la valoración
   antropométrica se enlazan con el paciente y con sus consultas (no hay que capturar dos veces).
   ===================================================================== */
const HI_COL='#2563eb';
const FAMS=['Madre','Padre','Abuelo Materno','Abuela Materna','Abuelo Paterno','Abuela Paterna'];
const HF_COLS=[['ob','Obesidad'],['dm','DM'],['hta','HTA'],['dis','Dislipidemia'],['car','Enf. Cardio'],['can','Cáncer']];
const SIGNOS=[['piel','Piel seca'],['cab','Cabello quebradizo / caída'],['una','Uñas frágiles'],['ojo','Ojos pálidos'],['muc','Mucosas pálidas'],['glo','Glositis / queilitis'],['enc','Encías inflamadas'],['xer','Xeroftalmia']];
const EMO=[['est','Estable'],['ans','Ansiedad'],['dep','Depresión'],['str','Estrés']];
const DIG=[['nau','Náuseas'],['vom','Vómitos'],['dia','Diarrea'],['est','Estreñimiento'],['ref','Reflujo/acidez'],['dol','Dolor']];
const BEB=[['cafe','Café'],['te','Té'],['jug','Jugos'],['ref','Refrescos'],['ene','Energéticos'],['otro','Otro']];
const INTOL=[['nin','Ninguna'],['lac','Lactosa'],['glu','Glúten'],['otro','Otro']];
/* Recordatorio de 24 h: [clave, nombre, ¿es colación? (se puede quitar)] */
const REC=[['des','Desayuno',0],['alm','Almuerzo',0],['cen','Cena',0],['cm','Colación matutina',1],['cv','Colación vespertina',1]];
/* Bioquímicos: [clave, nombre, texto de referencia, mín, máx, máx exclusivo?]  (hemoglobina según sexo) */
const BQ=[['glu','Glucosa ayuno','70-100 mg/dL',70,100],['cre','Creatinina','0.6-1.2 mg/dL',.6,1.2],['hba','HbA1c','<5.7 %',null,5.7,1],
 ['hb','Hemoglobina','♀: 12–15 · ♂: 13–17 g/dL',null,null],['alt','ALT (TGP)','10-40 U/L',10,40],['tg','Triglicéridos','<150 mg/dL',null,150,1],
 ['ldl','LDL','<100 mg/dL',null,100,1],['col','Colesterol total','<200 mg/dL',null,200,1]];
function bqOut(id,val,p){const q=BQ.find(x=>x[0]===id),v=num(val);if(!q||v==null)return false;
 let lo=q[3],hi=q[4],ex=q[5];if(id==='hb'){[lo,hi]=p.sexo==='M'?[13,17]:[12,15]}
 return(lo!=null&&v<lo)||(hi!=null&&(ex?v>=hi:v>hi))}
/* Clasificación del IMC: adultos OMS; menores de 18 por percentil CDC (desde 2 años) */
function clasifIMC(c,p){const pe=num(c.peso),t=num(c.est);if(!pe||!t)return'';const imc=pe/(t/100)**2,e=edad(p.nac,c.fecha);
 if(e&&e.a<18){if(e.dec<24)return'—';const L=lms('bmi',p.sexo==='M'?1:2,e.dec);return L?dx('bmi',0,cdf(zs(imc,L))*100):'—'}

/* ---------- Registro automático del paciente al llenar la historia clínica ----------
   Si no hay paciente activo (o se pulsa “Nueva historia clínica”) se trabaja sobre un borrador; en cuanto tiene
   nombre y fecha de nacimiento se guarda como paciente, queda seleccionado y se crea su primera consulta. */
const newDraft=()=>({id:uid(),nombre:'',apellidos:'',nac:'',sexo:'F',est:'',tel:'',mail:'',antec:'',hist:'',pat:[],cons:[],hci:{},hcd:{}});
const hcPat=()=>HS.draft||cur();
function hcRegister(p){if(HS.draft!==p||!(p.nombre||'').trim()||!p.nac)return;
 const dp=findDup(pn(p),pExp(p),p.nac);
 if(dp&&dupAsk(dp,pn(p))){const ex=dp.p;fillBlank(ex,p);HS.draft=null;DB.sel=ex.id;if(!ex.cons||!ex.cons.length)ex.cons=[newCons(ex)];agFirst(ex);agDedupe();save();fillSel();render();toast('Este paciente ya estaba registrado: se abrió su ficha (no se duplicó)');return}
 HS.draft=null;if(!p.cons.length)p.cons.push(newCons(p));DB.p.push(p);DB.sel=p.id;agFirst(p);agDedupe();save();fillSel();
 const b=$('#newpbanner');if(b)b.remove();const an=$('#antro');if(an)an.innerHTML=antroBlock(p);
 toast('Paciente registrado automáticamente: '+pn(p))}
function hcPInput(e){const t=e.target,d=t.dataset;if(d.p===undefined)return false;const p=hcPat();if(!p)return true;p[d.p]=t.value;if(d.p==='nombre')p.apellidos='';
 if(d.p==='nac'){const el=$('#hc-edad');if(el)el.value=edTxt(edad(p.nac));if(e.type==='change'){const an=$('#antro');if(an)an.innerHTML=antroBlock(p)}}
 hcRegister(p);if(e.type==='change')fillSel();if(DB.p.includes(p))save();return true}
const draftBanner=p=>HS.draft===p?'<div class="msg noprint" id="newpbanner" style="margin:8px 0">Paciente nuevo: se registrará automáticamente al capturar <b>nombre</b> y <b>fecha de nacimiento</b>.</div>':'';
function identCard(p){return `<div class="card">${draftBanner(p)}<div class="gap" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Datos del paciente</h2><button class="g s noprint" data-x="newhc">＋ Nueva historia clínica</button></div>
 <div class="grid"><div style="grid-column:span 2"><label>Nombre</label><input data-p="nombre" value="${esc(pn(p))}"></div>
 <div><label>Fecha de nacimiento</label><input data-p="nac" type="date" value="${esc(p.nac)}"></div><div><label>Edad</label><input id="hc-edad" readonly value="${edTxt(edad(p.nac))}"></div>
 <div><label>Sexo</label><select data-p="sexo"><option value="F"${p.sexo==='F'?' selected':''}>Mujer</option><option value="M"${p.sexo==='M'?' selected':''}>Hombre</option></select></div>
 <div><label>Teléfono</label><input data-p="tel" type="tel" value="${esc(p.tel)}"></div></div></div>`}
const pcHTML=(c,p)=>{const r=window.NCA&&NCA.pcOf?NCA.pcOf(c,p):null;return r?esc(r.t)+(r.dx?`<div class="pcd">${esc(r.dx)}</div>`:''):''};
function antroBlock(p){
 const e0=edad(p.nac),minor=!!(e0&&e0.a<18);
 const cs=csort(p),pg=Math.min(HS.pg||0,Math.max(0,Math.ceil(cs.length/4)-1)),cols=[0,1,2,3].map(i=>cs[pg*4+i]||null);
 const AR=[['Fecha','fecha','date'],['Peso (kg)','peso'],['Talla (cm)','est'],['IMC (kg/m²)','_imc'],...(minor?[['Percentil','_pc']]:[]),['Clasif. IMC','_cl'],['C. cintura','cin'],['C. abdominal','abd'],['C. brazo','bra'],['% Grasa (S/A)','graso']];
return `<div class="ftw sm"><table class="ft sm an"><tr><th>Parámetro${cols.map((c,i)=>`<th>Consulta ${pg*4+i+1}°`).join('')}</tr>
  ${AR.map(([l,k,ty])=>`<tr><td style="font-style:italic;color:var(--mut)">${l}${cols.map((c,i)=>!c?(i===cols.indexOf(null)&&k!=='_imc'&&k!=='_cl'&&k!=='_pc'?`<td><input data-nx="${k}" type="${ty||'number'}" step="0.1" placeholder="${k==='peso'?'Anotar peso':''}" aria-label="${l} (nueva consulta)">`:'<td>'):k==='_imc'?`<td data-imc="${c.id}">${imcOf(c)==null?'':fx(imcOf(c))}`:k==='_pc'?`<td data-pc="${c.id}">${pcHTML(c,p)}`:k==='_cl'?`<td data-cl="${c.id}">${esc(clasifIMC(c,p))}`:
   `<td><input data-c="${c.id}|${k}" type="${ty||'number'}" step="0.1" value="${esc(c[k])}">`).join('')}`).join('')}</table></div>
  <div class="gap noprint" style="margin-top:8px"><button class="s" data-x="nc">＋ Agregar consulta</button>${cs.length>4||pg>0?`<button class="s g" data-x="pgp"${pg?'':' disabled'}>‹ Anteriores</button><button class="s g" data-x="pgn"${(pg+1)*4<cs.length?'':' disabled'}>Siguientes ›</button>`:''}
  <span class="note" style="margin:0">Estos datos son los mismos de la sección Consulta.</span></div>`;
}

 const ox=(g,a)=>a.map(v=>`<label class="ck"><input type="checkbox" data-ir="${g}" value="${esc(v)}"${I[g]===v?' checked':''}>${esc(v)}</label>`).join('');

 const back=REC.filter(r=>r[2]&&I['off.'+r[0]]);
 const rec=`<div class="ftw rec"><table class="ft rec"><tr><th>Tiempo de alimentos<th>Alimentos, cantidad y preparación</tr>${REC.map(rcRow).join('')}</table></div>

function instI(){const p=hcPat();if(!p)return;const I=p.hci=p.hci||{},v=$('#view');
 const refresh=c=>{const a=$(`[data-imc="${c.id}"]`),b=$(`[data-cl="${c.id}"]`),q=$(`[data-pc="${c.id}"]`);if(a)a.textContent=imcOf(c)==null?'':fx(imcOf(c));if(b)b.textContent=clasifIMC(c,p);if(q)q.innerHTML=pcHTML(c,p)};
 const grow=t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,40)+'px'};v.querySelectorAll('textarea.free').forEach(grow);
 v.oninput=v.onchange=e=>{const t=e.target,d=t.dataset,ch=e.type==='change';
  if(d.lg!==undefined){if(!ch)return;const f=t.files[0];if(f)imgURL(f,900,false,.92,true).then(u=>{DB.logos=DB.logos||{};DB.logos[d.lg]=u;try{save()}catch{toast('Almacenamiento lleno')}render()}).catch(()=>toast('No se pudo leer la imagen'));return}
  if(t.classList.contains('free')&&t.tagName==='TEXTAREA')grow(t);
  if(d.i!==undefined){I[d.i]=t.value;if(d.i.startsWith('bq.'))t.classList.toggle('out',bqOut(d.i.split('.')[1],t.value,p))}
  else if(d.ic)I[d.ic]=t.checked;
  else if(d.ir){if(!ch)return;if(t.checked){I[d.ir]=t.value;v.querySelectorAll(`[data-ir="${d.ir}"]`).forEach(x=>{if(x!==t)x.checked=false})}else I[d.ir]=''}
  else if(d.p!==undefined){hcPInput(e);return}
  else if(d.pp!==undefined)p.pat=t.value.split(',').map(x=>x.trim()).filter(Boolean);
  else if(d.nx!==undefined){if(!ch||t.value==='')return;const n=newCons(p);n[d.nx]=t.value;p.cons.push(n);HS.pg=Math.floor((csort(p).length-1)/4);hcRegister(p);if(DB.p.includes(p))save();render();return}
  else if(d.c){const[id,k]=d.c.split('|'),c=p.cons.find(x=>x.id===id);if(!c)return;c[k]=t.value;refresh(c)}
  else return;
  save()};
 v.onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x,k=b.dataset.k;
  if(x==='print'){window.print();return}
  if(x==='newhc'){HS.draft=newDraft();render();return}
  if(x==='lgdel'){DB.logos=DB.logos||{};DB.logos[k]='';save();render();return}
  if(x==='nc'){const n=newCons(p);p.cons.push(n);HS.pg=Math.floor((csort(p).length-1)/4)}
  else if(x==='pgp')HS.pg=Math.max(0,(HS.pg||0)-1);else if(x==='pgn')HS.pg=(HS.pg||0)+1;
  else if(x==='rm'){if(!confirm('¿Quitar esta colación del recordatorio? Podrás agregarla de nuevo.'))return;I['off.'+k]=true}
  else if(x==='add')delete I['off.'+k];
  save();render()}}

function notaHTML(p){
 const L=((p.mod&&p.mod.notas)||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id)),
 r=(NP&&L.find(x=>x.id===NP))||L[0]||{},
 e=v=>esc(v==null?'':String(v)),
 u=v=>v!==undefined&&v!==null&&String(v).trim()!==''?`<span class="uv">${e(v)}</span>`:'<span class="ub" style="width:7ch"></span>',
 n=v=>v===undefined||v===null||v===''?'':e(v),
 dm=iso=>iso?iso.split('-').reverse().join(' / '):'&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;',
 H=p.hci||{},exp=H.exp||p.exp||'',
 pes=num(r.peso),tal=num(r.talla),imc=pes&&tal?Math.round(pes/((tal/100)**2)*10)/10:'',
 o=imcDx(p,r.date,pes,tal),hr=v=>v?`<b>${e(v)} hrs</b>`:'',
 nut=r.nut||(DB.nut&&DB.nut.nut)||NP_DEF.nut,cp=r.cp||(DB.nut&&DB.nut.cp)||NP_DEF.cp,
 fh=(r.date?fd(r.date):'')+(r.hora?'  '+r.hora+' hrs':''),
 al=(l,v,un)=>`<div class="al"><span>${l}</span><b>${n(v)}</b><i>${un}</i></div>`,
 BQ=[['GLUCOSA SERICA:','glu','70/100mg/dL'],['HEMOGLOBINA:','hb','♀:12–15 ♂:13–17g/dL'],['COLESTEROL TOTAL:','colt','&lt;200mg/dL'],['HDL (BUENO):','hdl','♀:50mg/dL ♂:40mg/dL'],['LDL (MALO):','ldl','&lt;100mg/dL'],['TRIGLICERIDOS:','tg','&lt;150mg/dL'],['UREA:','urea','15-40 mg/dL'],['CREATININA:','cre','♀:0.6-1.1mg/dL ♂:3.4- 7.0 mg/dL']],
 tx=(l,v,g,cls,mh)=>`<div class="r g ${cls||''}" style="flex:${g} 0 auto;min-height:${mh}in"><div class="lb">${l}</div><div class="tx">${n(v)}</div></div>`;
 const ln=(v,c)=>Math.ceil(String(v||'').length/c),load=ln(r.ev,95)+ln(r.dx,95)+ln(r.pl,95)+ln(r.pend,95)+Math.max(ln(r.des,26),ln(r.com,26),ln(r.cen,26),ln(r.col,26)),sz=load>36?' s2':load>23?' s1':'';
 return `<section class="pgp npg${sz}">
 <div class="nph"><div class="npl"><div class="nplg"><img src="${NP_LOGO.a}" alt="" decoding="sync"><img class="lb2" src="${NP_LOGO.b}" alt="" decoding="sync"></div><div class="npt1">NOTAS DE</div><div class="npt2">EVOLUCIÓN  Y TRATAMIENTO NUTRICIONAL</div></div>
  <div class="npb"><div class="npnm"><span>NOMBRE: ${u(pn(p))}</span><span>EDAD: ${u(o.e?edShort(o.e):'')}</span></div><div class="nprow"><span>EXPEDIENTE: ${u(exp)}</span><span>FECHA DE N: ${u(p.nac?p.nac.split('-').reverse().join('/'):'')}</span></div><div class="npdx">DIAGNOSTICO NUTRICIONAL: ${u(o.dx)}</div></div></div>
 <div class="npt">
  <div class="r r1"><div class="c1">FECHA / HORA: <b>${n(fh)}</b></div><div class="c2">NOTAS DE EVOLUCIÓN NUTRICIONAL Y TRATAMIENTO NUTRICIONAL</div></div>
  ${tx('EVOLUCIÓN NUTRICIONAL ACTUAL (SINTOMAS Y SIGNOS):',r.ev,2.4,'',.8)}
  <div class="r"><div class="ct">EVALUACIÓN DIETETICA R24 HRS</div></div>
  <div class="r r4"><div>DESAYUNO: ${hr(r.hdes)}</div><div>COMIDA: ${hr(r.hcom)}</div><div>CENA: ${hr(r.hcen)}</div><div>COLACIÓN: ${hr(r.hcol)}</div></div>
  <div class="r r4 g4" style="flex:2.2 0 auto;min-height:.8in"><div class="tx">${n(r.des)}</div><div class="tx">${n(r.com)}</div><div class="tx">${n(r.cen)}</div><div class="tx">${n(r.col)}</div></div>
  <div class="r"><div class="ct">EVOLUCIÓN ACTUAL</div></div>
  <div class="r eg eh"><div>ANTROPOMETRIA</div><div>BIOQUIMICO <span class="bfe">Fecha: ${dm(r.bfecha)}</span></div></div>
  <div class="r eg eb"><div class="ea">${al('PESO ACTUAL:',r.peso,'Kg')}${al('TALLA ACTUAL:',r.talla,'Cm')}${al('PESO IDEAL:',r.pideal,'Kg')}${al('IMC:',imc,'Kg/m2')}${o.minor&&o.pv?al('PERCENTIL:',o.pv,o.pu):''}${al('C. CINTURA:',r.cin,'Cm')}${al('C. ABDOMINAL:',r.abd,'Cm')}</div>
   <div class="eq">${BQ.map(([l,k,ref])=>`<div class="bq"><span>${l} <b>${n(r[k])}</b></span><span class="ref">${ref}</span></div>`).join('')}</div>
</div>
  ${tx('DIAGNOSTICO NUTRICIONAL PES:',r.dx,1,'bd',.4)}
  ${tx('PLAN / RECOMENDACIONES :',r.pl,2.4,'bd',.8)}
  ${tx('PENDIENTES:',r.pend,1,'bd',.4)}
 </div>
 <div class="npf"><span class="uv">${e(nut)}</span><div>Nombre y firma de la nutrióloga</div><div>CP: ${e(cp)}</div></div>
</section>`}

   · Escribe solo números (13102026 → 13/10/2026; con año de 2 dígitos también: 131026).

const _vget=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').get,_vset=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
const isoFmt=i=>/^\d{4}-\d{2}-\d{2}$/.test(i||'')?i.slice(8,10)+'/'+i.slice(5,7)+'/'+i.slice(0,4):'';
function isoParse(txt,loose){const d=String(txt).replace(/\D/g,'');let dd,mm,yy;
 if(d.length===8){dd=+d.slice(0,2);mm=+d.slice(2,4);yy=+d.slice(4)}
 else if(loose&&d.length===6){dd=+d.slice(0,2);mm=+d.slice(2,4);const y2=+d.slice(4);yy=y2>(new Date().getFullYear()%100)+1?1900+y2:2000+y2}
 else return '';
 const t=new Date(yy,mm-1,dd);if(yy<1900||yy>2100||t.getFullYear()!==yy||t.getMonth()!==mm-1||t.getDate()!==dd)return '';
 return `${String(yy).padStart(4,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`}
function enhanceDates(root){(root||document).querySelectorAll('input[type=date]').forEach(el=>{
 const iso=el.getAttribute('value')||'';el.type='text';el.classList.add('dt');el._iso=/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:'';
 el.placeholder='dd/mm/aaaa';el.maxLength=10;el.inputMode='numeric';el.autocomplete='off';el.title='Escribe la fecha (solo números) · H = hoy';
 Object.defineProperty(el,'value',{get(){return el._iso},set(v){el._iso=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';_vset.call(el,isoFmt(el._iso))},configurable:true});
 _vset.call(el,isoFmt(el._iso));
 el.addEventListener('focus',()=>el.select());
 el.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[htHT]$/.test(e.key)){e.preventDefault();el._iso=today();_vset.call(el,isoFmt(el._iso));el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}});
 el.addEventListener('input',()=>{const d=_vget.call(el).replace(/\D/g,'').slice(0,8),f=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;_vset.call(el,f);
  if(!f)el._iso='';else{const i=isoParse(f,false);if(i)el._iso=i}},true);
