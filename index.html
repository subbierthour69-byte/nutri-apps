<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriClin · Sistema clínico de nutrición</title>
<meta name="description" content="Expediente clínico, cálculo energético, plan de alimentación por equivalentes SMAE y lista de compras para nutriólogos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<script>
/* Tema antes de pintar (evita parpadeo). */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('nutriclin.v1') || '{}');
    var pref = (s.settings && s.settings.theme) || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#f7f9fb; --text:#12202b; --muted:#5d6e7d; --border:#e2e8ee;
  --brand:#0f766e; --brand-600:#0b625b; --brand-50:#e5f3f1; --brand-ink:#ffffff;
  --accent:#2563eb; --good:#15803d; --good-bg:#e5f5ea; --warn:#b45309; --warn-bg:#fcf0dc; --bad:#b91c1c; --bad-bg:#fde7e7;
  --info-bg:#e8f0fe; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06); --radius:14px;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0e1519; --surface:#151f25; --surface-2:#1a262d; --text:#e6edf2; --muted:#92a3b1; --border:#25343d;
  --brand:#2dd4bf; --brand-600:#5eead4; --brand-50:#12302f; --brand-ink:#06201d;
  --accent:#7aa2ff; --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#33270f; --bad:#f87171; --bad-bg:#3a1717;
  --info-bg:#172540; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text);background:var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:.86rem} .xs{font-size:.78rem} .right{text-align:right} .nowrap{white-space:nowrap}
.mt{margin-top:16px} .mt-s{margin-top:8px} .mb{margin-bottom:16px} .gap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
[hidden]{display:none!important}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:1.1rem}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#34d399);display:grid;place-items:center;color:#fff;font-size:18px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:550}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--brand-50);color:var(--brand)}
.nav .sep{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 4px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface-2);font-size:.8rem;color:var(--muted)}
.main-wrap{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar .menu-btn{display:none}
.view{padding:24px 28px 64px;max-width:1320px}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h p{color:var(--muted);margin-top:4px}

/* ===== Componentes ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.sticky{position:sticky;top:76px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ico{width:44px;height:44px;border-radius:12px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}
.stat .v{font-size:1.6rem;font-weight:700;line-height:1.1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:#c7d2db}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.86rem;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--accent);border-color:transparent}
.chip.brand{background:var(--brand-50);color:var(--brand);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);display:inline-block}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);min-width:0}
.field textarea{min-height:92px;resize:vertical}
.field .hint{font-size:.76rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.form-grid .wide{grid-column:1/-1}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:1.9rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.note{padding:10px 12px;border-radius:10px;font-size:.88rem;background:var(--info-bg);color:var(--text)}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)} .note.good{background:var(--good-bg)}
.up{color:var(--bad)} .d-good{color:var(--good);font-weight:650} .d-bad{color:var(--bad);font-weight:650} .d-warn{color:var(--warn);font-weight:650} .d-neutral{color:var(--muted)}
.macro{margin-bottom:12px}.macro .spread{margin-bottom:4px}
.mini{padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);break-inside:avoid}
.charts{gap:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem}
.legend span{display:inline-flex;gap:6px;align-items:center}
svg.chart{display:block;height:auto}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
svg.chart .grid{stroke:var(--border);stroke-width:1}
.timeline{display:flex;flex-direction:column;gap:12px}
.t-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.t-date{min-width:92px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.meal{padding:14px;background:var(--surface-2);box-shadow:none}
.meal-h{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.meal-h select{max-width:220px;font-weight:650}
.item-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,1.2fr) 92px 86px auto;gap:8px;align-items:center;margin-bottom:8px}
.item-kcal{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* ===== Modal / toast ===== */
.modal-back{position:fixed;inset:0;background:rgba(10,18,24,.55);display:grid;place-items:start center;padding:40px 16px;overflow:auto;z-index:100}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--border);width:min(720px,100%);box-shadow:0 24px 60px rgba(0,0,0,.35);padding:22px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#toast-root{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:360px}
.toast.bad{background:var(--bad);color:#fff} .toast.good{background:var(--good);color:#fff}

/* ===== Reporte / impresión ===== */
.report{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;max-width:900px;margin:0 auto}
.rpt-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:18px}
.rpt-sec{margin-top:22px;break-inside:avoid}
.rpt-sec>h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.rpt-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
.rpt-kv div span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rpt-kv div b{font-size:.98rem}
.sign{margin-top:46px;display:flex;justify-content:flex-end}
.sign div{border-top:1px solid var(--text);padding-top:6px;min-width:260px;text-align:center;font-size:.86rem}
.shop-cat{break-inside:avoid;margin-bottom:14px}
.shop-cat h4{display:flex;align-items:center;gap:8px;font-size:.95rem;margin-bottom:6px}
.shop-list{list-style:none;margin:0;padding:0}
.shop-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border)}
.shop-list input{margin-top:4px}
.shop-list .generic{color:var(--muted);font-style:italic}

/* ===== Responsivo ===== */
@media (max-width:1100px){.split{grid-template-columns:1fr}.sticky{position:static}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .topbar{padding:10px 16px}.topbar .menu-btn{display:inline-flex}
  .view{padding:18px 16px 56px}
  .g2,.g3{grid-template-columns:1fr}
  .item-row{grid-template-columns:1fr 1fr}
  .t-item{grid-template-columns:1fr}
  .rpt-kv{grid-template-columns:repeat(2,1fr)}
}

/* ===== Impresión / PDF (siempre en claro) ===== */
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f4f6f8;--text:#111;--muted:#555;--border:#d5dce2;--brand:#0f766e;--brand-50:#e5f3f1;--good:#15803d;--good-bg:#e5f5ea;--warn:#b45309;--warn-bg:#fcf0dc;--bad:#b91c1c;--bad-bg:#fde7e7;--info-bg:#e8f0fe;--accent:#2563eb;--shadow:none}
  html,body{background:#fff}
  .sidebar,.topbar,.no-print,#toast-root,#modal-root{display:none!important}
  .app{display:block}.view{padding:0;max-width:none}
  .report,.card{box-shadow:none;border:0;padding:0}
  .card{border:1px solid var(--border);padding:12px;break-inside:avoid}
  .report{max-width:none}
  .tbl tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:14mm}
}
</style>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="brand"><span class="logo">🥗</span><span>NutriClin</span></div>
    <nav class="nav" id="nav">

      <a href="#/pacientes" data-nav="pacientes"></a>

      <a href="#/compras" data-nav="compras"></a>

        <span class="muted small" id="today-label"></span>

        <button class="btn sm" data-act="new-patient" id="top-new-patient"></button>
        <button class="btn ghost sm" data-act="toggle-theme" aria-label="Cambiar tema" id="theme-btn"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   NutriClin — aplicación de una sola página (sin dependencias externas)
   Secciones:
   1. Utilidades            5. Catálogo SMAE y alimentos
   2. Estado y almacenamiento 6. Motor de plan, compras y evolución
   3. Motor clínico         7. Vistas (UI)
   4. Router y eventos
   ===================================================================== */

/* ============================ 1. UTILIDADES ============================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const round = (v, d = 1) => { const f = 10 ** d; return Math.round((v + Number.EPSILON) * f) / f; };
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const utc = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const addDaysISO = (iso, n) => { const t = new Date(utc(iso) + n * 86400000); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
function ageYears(birth, on) {
  const [by, bm, bd] = birth.split('-').map(Number), [y, m, d] = on.split('-').map(Number);
  let a = y - by; if (m < bm || (m === bm && d < bd)) a--; return a;
}
const fmtDate = iso => iso ? new Date(utc(iso)).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
const fmtShort = iso => new Date(utc(iso)).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', timeZone: 'UTC' });
const fmt = (n, d = 1) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtSigned = (n, d = 1) => { if (n === null || n === undefined || Number.isNaN(n)) return '—'; const r = round(n, d); return r === 0 ? '0' : (r > 0 ? '+' : '−') + fmt(Math.abs(r), d); };
const toNum = v => { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const clone = o => JSON.parse(JSON.stringify(o));
const byDateAsc = (a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || '');
const byDateDesc = (a, b) => byDateAsc(b, a);
const lines = s => String(s || '').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
const setPath = (o, path, v) => { const k = path.split('.'); let c = o; for (let i = 0; i < k.length - 1; i++) c = c[k[i]]; c[k[k.length - 1]] = v; };
const getPath = (o, path) => path.split('.').reduce((c, k) => (c == null ? c : c[k]), o);

/* Fracciones estilo SMAE: 3.5 → "3 1/2" */
const FRACS = [[0, ''], [1 / 4, '1/4'], [1 / 3, '1/3'], [1 / 2, '1/2'], [2 / 3, '2/3'], [3 / 4, '3/4'], [1, '']];
function formatFraction(q) {
  const whole = Math.floor(q + 1e-9), rest = q - whole;
  let best = FRACS[0]; for (const f of FRACS) if (Math.abs(f[0] - rest) < Math.abs(best[0] - rest)) best = f;
  if (Math.abs(best[0] - rest) > 0.04) return fmt(q, 2);
  if (best[0] === 1) return String(whole + 1);
  if (best[0] === 0) return String(whole);
  return whole === 0 ? best[1] : `${whole} ${best[1]}`;
}
function parseQty(s) {
  const t = String(s ?? '').trim().replace(',', '.'); if (!t) return null;
  let total = 0; for (const part of t.split(/\s+/)) {
    if (part.includes('/')) { const [a, b] = part.split('/').map(Number); if (!b) return null; total += a / b; }
    else { const n = Number(part); if (!Number.isFinite(n)) return null; total += n; }
  }
  return total;
}
const isMetricUnit = u => /^(g|gr|grs|gramos?|ml|mililitros?)$/i.test(String(u).trim());
function pluralizeUnit(unit, q) {
  const u = String(unit).trim(); if (q <= 1 || /s$/i.test(u)) return u;
  return /[aeiouáéíóú]$/i.test(u) ? u + 's' : u + 'es';
}
const formatWeight = (a, unit) => a >= 1000 ? `${fmt(a / 1000, 2)} ${unit === 'ml' ? 'L' : 'kg'}` : `${fmt(a, 0)} ${unit}`;

/* ---- Iconos ---- */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',

const ACTIVITY = {

/* FAO/OMS/UNU 1985 (Schofield): [edadMin, edadMax, pendiente, constante] */
const FAO = {
  male: [[0, 3, 60.9, -54], [3, 10, 22.7, 495], [10, 18, 17.5, 651], [18, 30, 15.3, 679], [30, 60, 11.6, 879], [60, Infinity, 13.5, 487]],

/* Valencia et al. (población mexicana, adultos) */
const VAL = {
  male: [[18, 30, 13.37, 747], [30, 60, 13.08, 693], [60, Infinity, 14.21, 429]],
  female: [[18, 30, 11.02, 679], [30, 60, 10.92, 677], [60, Infinity, 10.98, 520]]

const bracket = (t, age) => t.find(x => age >= x[0] && age < x[1]);
const BMR_ORDER = ['mifflin_st_jeor', 'harris_benedict_1919', 'harris_benedict_1984', 'valencia', 'fao_oms', 'katch_mcardle'];
const BMR_EQ = {
  mifflin_st_jeor: { label: 'Mifflin-St Jeor', ref: 'Mifflin et al., 1990', calc: i => 10 * i.w + 6.25 * i.h - 5 * i.age + (i.sex === 'male' ? 5 : -161) },
  harris_benedict_1919: { label: 'Harris-Benedict (1919)', ref: 'Harris & Benedict, 1919', calc: i => i.sex === 'male' ? 66.47 + 13.75 * i.w + 5.003 * i.h - 6.755 * i.age : 655.1 + 9.563 * i.w + 1.85 * i.h - 4.676 * i.age },
  harris_benedict_1984: { label: 'Harris-Benedict revisada (1984)', ref: 'Roza & Shizgal, 1984', calc: i => i.sex === 'male' ? 88.362 + 13.397 * i.w + 4.799 * i.h - 5.677 * i.age : 447.593 + 9.247 * i.w + 3.098 * i.h - 4.33 * i.age },
  valencia: { label: 'Valencia (población mexicana)', ref: 'Valencia et al., 1994', minAge: 18, calc: i => { const b = bracket(VAL[i.sex], i.age); return b[2] * i.w + b[3]; } },
  fao_oms: { label: 'FAO/OMS/UNU (Schofield 1985)', ref: 'FAO/WHO/UNU 1985', calc: i => { const b = bracket(FAO[i.sex], i.age); return b[2] * i.w + b[3]; } },

function eqUnavailable(id, i) {
  const e = BMR_EQ[id];
  if (e.needsLean && !(i.lean > 0)) return 'requiere % de grasa';
  if (e.minAge != null && i.age < e.minAge) return `desde los ${e.minAge} años`;

}
function refWeight(w, h, basis) {

}
const GOAL_DEFAULTS = {

/* Cálculo completo: GEB → GET → meta → macros. Función pura. */
function computeEnergy(inp, cfg) {
  const w = inp.weightKg, h = inp.heightCm, warnings = [];
  if (!(w > 0) || !(h > 0)) return { ok: false, error: 'Captura peso y estatura.' };
  if (inp.age < 18) warnings.push('Menor de 18 años: las ecuaciones de adulto y la clasificación OMS de IMC no aplican. Esta versión no incluye las tablas CDC pediátricas.');
  const lean = inp.bodyFatPct != null ? w * (1 - inp.bodyFatPct / 100) : null;
  const ref = refWeight(w, h, cfg.weightBasis);
  const i = { sex: inp.sex, age: inp.age, w: ref, h, lean };
  const why = eqUnavailable(cfg.equationId, i);
  if (why) return { ok: false, error: `${BMR_EQ[cfg.equationId].label}: ${why}.` };
  const bmr = BMR_EQ[cfg.equationId].calc(i);
  const model = cfg.model === 'auto' ? (cfg.equationId === 'fao_oms' ? 'factorial' : 'additive') : cfg.model;

  let factor, afKcal;
  if (cfg.activityMode === 'preset') { factor = ACTIVITY[cfg.activityPreset].f; afKcal = bmr * (factor - 1); }
  else if (cfg.activityMode === 'factor') {
    factor = cfg.activityFactor;
    if (!(factor >= 1 && factor <= 2.5)) return { ok: false, error: 'El factor de actividad (FA) debe estar entre 1.0 y 2.5.' };
    afKcal = bmr * (factor - 1);
  } else {
    const k = cfg.activityKcal;
    if (!(k >= 0 && k <= 5000)) return { ok: false, error: 'Las kcal de actividad física deben estar entre 0 y 5000.' };
    afKcal = k; factor = 1 + k / bmr;
  }

  let etaKcal = 0, etaPct = 0, tee;
  if (model === 'factorial') {
    tee = bmr * factor; afKcal = tee - bmr;
    warnings.push('Modelo factorial (GET = GEB × FA): el ETA ya está incluido en el factor de actividad.');
  } else {
    etaPct = cfg.etaPercent;
    if (!(etaPct >= 0 && etaPct <= 30)) return { ok: false, error: 'El ETA debe estar entre 0 % y 30 %.' };
    const base = cfg.etaBase === 'bmr' ? bmr : bmr + afKcal;
    etaKcal = etaPct / 100 * base; tee = bmr + etaKcal + afKcal;
    if (cfg.equationId === 'mifflin_st_jeor' && etaPct > 0) warnings.push('Mifflin-St Jeor estima el gasto en reposo; algunos autores no recomiendan sumar ETA con esta ecuación.');
    if (etaPct > 0 && factor > 1 && cfg.activityMode !== 'kcal') warnings.push('Algunos factores de actividad publicados ya incluyen el ETA: verifica que no se duplique.');
  }
  const adj = cfg.goalAdjustPct;
  if (!(adj >= -50 && adj <= 50)) return { ok: false, error: 'El ajuste por objetivo debe estar entre −50 % y +50 %.' };
  const target = tee * (1 + adj / 100);
  const floor = inp.sex === 'male' ? 1500 : 1200;
  if (target < floor) warnings.push(`La meta (${fmt(target, 0)} kcal) está por debajo del mínimo orientativo de ${floor} kcal: requiere supervisión clínica.`);
  if (target < bmr) warnings.push('La meta calórica es menor que el GEB.');

  const pG = cfg.proteinMode === 'gkg' ? cfg.proteinValue * ref : target * cfg.proteinValue / 100 / 4;
  const pK = pG * 4, lK = target * cfg.lipidsPct / 100;
  let cK = target - pK - lK;
  if (cK < 0) { cK = 0; warnings.push('Proteína + lípidos exceden la meta calórica: carbohidratos en 0.'); }
  const pctOf = k => round(k / target * 100, 1);
  const pPct = pctOf(pK), lPct = pctOf(lK);
  if (pPct >= 30) warnings.push(`Proteína alta (${fmt(pPct)} % de las kcal). En pacientes con sobrepeso u obesidad considera usar el peso ajustado o ideal como peso de referencia.`);
  if (lPct < 20 || lPct > 35) warnings.push(`Lípidos fuera del rango orientativo 20–35 % (${fmt(lPct)} %).`);

  return {
    ok: true, equationId: cfg.equationId, equationLabel: BMR_EQ[cfg.equationId].label, model, weightBasis: cfg.weightBasis, referenceWeightKg: ref,
    bmr: round(bmr, 1), activityFactor: round(factor, 3), afKcal: round(afKcal, 1), etaPercent: etaPct, etaKcal: round(etaKcal, 1),
    tee: round(tee, 1), goal: cfg.goal, goalAdjustPct: adj, goalAdjustKcal: round(target - tee, 1), targetKcal: round(target, 0),
    macros: {
      protein: { g: round(pG, 1), kcal: round(pK, 0), pct: pPct, gkg: round(pG / ref, 2) },
      lipids: { g: round(lK / 9, 1), kcal: round(lK, 0), pct: lPct, gkg: round(lK / 9 / ref, 2) },
      carbs: { g: round(cK / 4, 1), kcal: round(cK, 0), pct: pctOf(cK), gkg: round(cK / 4 / ref, 2) }
    },
    warnings
  };
}
function allBmr(inp, basis) {
  const lean = inp.bodyFatPct != null ? inp.weightKg * (1 - inp.bodyFatPct / 100) : null;
  const i = { sex: inp.sex, age: inp.age, w: refWeight(inp.weightKg, inp.heightCm, basis), h: inp.heightCm, lean };
  return BMR_ORDER.map(id => { const why = eqUnavailable(id, i); return { id, label: BMR_EQ[id].label, ref: BMR_EQ[id].ref, why, value: why ? null : round(BMR_EQ[id].calc(i), 1) }; });
}

/* ============================ 6. MOTOR DE PLAN, COMPRAS Y EVOLUCIÓN ============================ */
function itemNutr(it) {
  const f = it.foodId ? foodById(it.foodId) : null, g = GROUP_BY_ID[it.groupId];
  const src = f ? { kcal: f.kcal, p: f.protein, l: f.lipids, c: f.carbs } : g ? { kcal: g.kcal, p: g.p, l: g.l, c: g.c } : { kcal: 0, p: 0, l: 0, c: 0 };
  const s = Number(it.servings) || 0;
  return { kcal: src.kcal * s, p: src.p * s, l: src.l * s, c: src.c * s };
}
function planTotals(plan) {
  const tot = { kcal: 0, p: 0, l: 0, c: 0 }, meals = [], eq = {};
  for (const m of plan.meals) {
    const mt = { kcal: 0, p: 0, l: 0, c: 0 };
    for (const it of m.items) {
      const n = itemNutr(it); for (const k of ['kcal', 'p', 'l', 'c']) { mt[k] += n[k]; tot[k] += n[k]; }
      eq[it.groupId] = (eq[it.groupId] || 0) + (Number(it.servings) || 0);
    }
    meals.push({ id: m.id, ...mt });
  }
  return { total: tot, meals, eq };
}
function emptyMeals() {
  return ['desayuno', 'colacion_matutina', 'comida', 'colacion_vespertina', 'cena'].map(t => ({ id: uid('meal'), type: t, items: [] }));
}
/* Propuesta de equivalentes SMAE para una meta (resuelve P, L y C con AOA, aceites y cereales). */
function allocate(total, weights) {
  const units = Math.round(total * 2), ws = weights.reduce((a, b) => a + b, 0);
  if (!units || !ws) return weights.map(() => 0);
  const raw = weights.map(w => units * w / ws), base = raw.map(Math.floor);
  let rem = units - base.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rem > 0) { base[i]++; rem--; } });
  return base.map(u => u / 2);
}
const half = x => Math.max(0, Math.round(x * 2) / 2);
function suggestPlan(energy) {
  const t = { kcal: energy.targetKcal, p: energy.macros.protein.g, l: energy.macros.lipids.g, c: energy.macros.carbs.g };
  const low = t.kcal < 1400;
  const fixed = { 1: low ? 3 : 4, 2: low ? 2 : 3, 5: low ? 0.5 : 1, 11: 1 };           // verduras, frutas, leguminosas, leche semidescremada
  const base = { p: 0, l: 0, c: 0 };
  for (const [id, s] of Object.entries(fixed)) { const g = GROUP_BY_ID[id]; base.p += g.p * s; base.l += g.l * s; base.c += g.c * s; }
  const cereal = Math.max((t.c - base.c) / 15, 0);                                       // cereales sin grasa: 15 g C, 2 g P
  const aoa = Math.max((t.p - base.p - 2 * cereal) / 7, 0);                              // AOA bajo aporte de grasa: 7 g P, 3 g L
  const oil = Math.max((t.l - base.l - 3 * aoa) / 5, 0);                                 // aceites sin proteína: 5 g L
  const totals = { ...fixed, 3: half(cereal), 7: half(aoa), 14: half(oil) };
  const types = ['desayuno', 'colacion_matutina', 'comida', 'colacion_vespertina', 'cena'];
  const W = { 1: [1, 0, 2, 0, 1], 2: [1, 1, 0, 1, 0], 3: [2, 1, 3, 0, 2], 5: [0, 0, 1, 0, 0], 7: [2, 0, 3, 0, 2], 11: [1, 0, 0, 0, 1], 14: [1, 0, 2, 0, 1] };
  const meals = types.map(type => ({ id: uid('meal'), type, items: [] }));
  for (const gid of Object.keys(totals)) {
    const parts = allocate(totals[gid], W[gid]);
    parts.forEach((s, mi) => { if (s > 0) meals[mi].items.push({ id: uid('it'), groupId: Number(gid), foodId: null, servings: s }); });
  }

/* Lista de compras: consolida por alimento/equivalente y agrupa por pasillo. */
function buildShopping(plan, days, step = 10) {
  const acc = new Map(), warnings = [];
  for (const m of plan.meals) for (const it of m.items) {
    const s = Number(it.servings) || 0; if (s <= 0) continue;
    const food = it.foodId ? foodById(it.foodId) : null;
    if (it.foodId && !food) warnings.push('Un alimento del plan ya no existe en el catálogo; se listó como equivalente genérico.');
    const useFood = food || null, key = useFood ? 'f:' + useFood.id : 'g:' + it.groupId;
    const cur = acc.get(key) || { key, food: useFood, group: GROUP_BY_ID[useFood ? useFood.groupId : it.groupId], servings: 0 };
    cur.servings += s; acc.set(key, cur);
  }
  const byCat = new Map();
  for (const a of acc.values()) {
    const cat = a.group ? a.group.cat : 'Otros', sv = a.servings * days;
    let line;
    if (a.food) {
      const f = a.food, measure = sv * f.qty, net = sv * f.net, gross = f.gross != null ? sv * f.gross : null;
      const buy = Math.ceil((gross ?? net) / step - 1e-9) * step;
      const isPiece = /^pieza/i.test(f.unit), pm = isPiece ? Math.ceil(measure - 1e-9) : round(measure, 2);
      const metric = isMetricUnit(f.unit);
      line = {
        name: f.name, generic: false, servings: round(sv, 2), measure: pm, unit: f.unit, buy, wunit: f.wunit,
        text: metric ? formatWeight(buy, f.wunit) : `${formatFraction(pm)} ${pluralizeUnit(f.unit, pm)}`,
        extra: metric ? '' : `≈ ${formatWeight(buy, f.wunit)} ${gross != null ? 'peso bruto' : 'peso neto'}`
      };
    } else {
      line = { name: groupName(a.group), generic: true, servings: round(sv, 2), text: `${formatFraction(round(sv, 2))} ${sv === 1 ? 'equivalente' : 'equivalentes'}`, extra: 'elegir alimentos del grupo' };
    }
    (byCat.get(cat) || byCat.set(cat, []).get(cat)).push(line);
  }
  const cats = SHOP_ORDER.filter(c => byCat.has(c)).map(c => ({ cat: c, items: byCat.get(c).sort((x, y) => (x.generic - y.generic) || x.name.localeCompare(y.name, 'es')) }));
  return { cats, warnings: [...new Set(warnings)], total: cats.reduce((n, c) => n + c.items.length, 0) };
}
/* ---- Evolución ---- */
function metricsOf(c) {
  const a = c.anthro, w = a.weightKg;
  return {
    weight: w, bmi: a.bmi, fatPct: a.bodyFatPct ?? null, fatKg: a.bodyFatPct != null ? round(w * a.bodyFatPct / 100, 2) : null,
    musclePct: a.musclePct ?? null, muscleKg: a.musclePct != null ? round(w * a.musclePct / 100, 2) : null,
    visceral: a.visceralFat ?? null, metAge: a.metabolicAge ?? null, waist: a.waist ?? null, abdomen: a.abdomen ?? null, hip: a.hip ?? null
  };
}
const METRIC_DEFS = [
  { key: 'weight', label: 'Peso', unit: 'kg', dec: 1, good: 'goal', eps: 0.05 }, { key: 'bmi', label: 'IMC', unit: 'kg/m²', dec: 1, good: 'goal', eps: 0.05 },
  { key: 'fatKg', label: 'Masa grasa', unit: 'kg', dec: 1, good: 'down', eps: 0.05 }, { key: 'fatPct', label: '% de grasa', unit: '%', dec: 1, good: 'down', eps: 0.05 },
  { key: 'muscleKg', label: 'Músculo esquelético', unit: 'kg', dec: 1, good: 'up', eps: 0.05 }, { key: 'musclePct', label: '% de músculo', unit: '%', dec: 1, good: 'up', eps: 0.05 },
  { key: 'visceral', label: 'Grasa visceral', unit: 'nivel', dec: 0, good: 'down', eps: 0.5 }, { key: 'metAge', label: 'Edad metabólica', unit: 'años', dec: 0, good: 'down', eps: 0.5 },
  { key: 'waist', label: 'Cintura', unit: 'cm', dec: 1, good: 'down', eps: 0.05 }, { key: 'abdomen', label: 'Abdomen', unit: 'cm', dec: 1, good: 'down', eps: 0.05 },
  { key: 'hip', label: 'Cadera', unit: 'cm', dec: 1, good: 'none', eps: 0.05 }
];
function progressRows(cur, prev, goal) {
  const a = metricsOf(prev), b = metricsOf(cur), rows = [];
  for (const d of METRIC_DEFS) {
    const pv = a[d.key], cv = b[d.key]; if (pv == null && cv == null) continue;
    const delta = pv != null && cv != null ? cv - pv : null, pct = delta != null && pv ? delta / pv * 100 : null;
    let cls = 'neutral';
    if (delta != null && Math.abs(delta) >= d.eps && d.good !== 'none') {
      const up = delta > 0;
      if (d.good === 'up') cls = up ? 'good' : 'bad';
      else if (d.good === 'down') cls = up ? 'bad' : 'good';
      else if (goal === 'fat_loss') cls = up ? 'bad' : 'good';
      else if (goal === 'hypertrophy') cls = up ? 'good' : 'warn';
      else cls = Math.abs(pct) <= 1 ? 'good' : 'warn';
    }
    rows.push({ ...d, prev: pv, cur: cv, delta, pct, cls });
  }

}
function progressTable(rows) {
  if (!rows.length) return '<p class="muted small">Sin datos comparables.</p>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Métrica</th><th class="num">Anterior</th><th class="num">Actual</th><th class="num">Cambio</th><th class="num">% cambio</th></tr></thead><tbody>${rows.map(r => `
    <tr><td>${esc(r.label)} <span class="muted xs">${esc(r.unit)}</span></td><td class="num">${fmt(r.prev, r.dec)}</td><td class="num">${fmt(r.cur, r.dec)}</td>
    <td class="num d-${r.cls}">${fmtSigned(r.delta, r.dec)}</td><td class="num d-${r.cls}">${r.pct == null ? '—' : fmtSigned(r.pct, 1) + ' %'}</td></tr>`).join('')}</tbody></table></div>`;
}
function progressSummary(cur, prev) {
  const a = metricsOf(prev), b = metricsOf(cur), days = daysBetween(prev.date, cur.date), parts = [];
  const add = (lab, k, d = 1) => { if (a[k] != null && b[k] != null) parts.push(`${lab} ${fmtSigned(b[k] - a[k], d)} kg`); };
  add('Peso', 'weight'); add('Grasa', 'fatKg'); add('Músculo', 'muscleKg');
  const wk = days > 0 && a.weight != null ? round((b.weight - a.weight) / days * 7, 2) : null;
  return `${parts.join(' · ')}${parts.length ? ' ' : ''}${days === 0 ? 'el mismo día' : `en ${days} día${days === 1 ? '' : 's'}`}${wk != null && days > 0 ? ` (${fmtSigned(wk, 2)} kg/semana)` : ''}`;
}
/* Gráficas SVG de líneas, una por métrica (sin librerías). */
function miniChart(pts, s) {
  const data = pts.filter(p => p.v[s.key] != null);
  const W = 300, H = 176, P = { l: 42, r: 12, t: 12, b: 28 };
  const sameDay = new Set(data.map(p => p.date)).size < 2;
  const xs = data.map((p, i) => sameDay ? i : utc(p.date)), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const vs = data.map(p => p.v[s.key]); let y0 = Math.min(...vs), y1 = Math.max(...vs);
  const span = (y1 - y0) || 1, padY = span * 0.25; y0 -= padY; y1 += padY;
  const X = i => P.l + (x1 === x0 ? (W - P.l - P.r) / 2 : (xs[i] - x0) / (x1 - x0) * (W - P.l - P.r));
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const dec = (y1 - y0) < 6 ? 1 : 0;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${P.l - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(v, dec)}</text>`; }
  const step = Math.max(1, Math.ceil(data.length / 4));
  data.forEach((p, i) => { if (i % step === 0 || i === data.length - 1) g += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}">${fmtShort(p.date)}</text>`; });
  const d = data.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v[s.key]).toFixed(1)}`).join(' ');
  const dots = data.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v[s.key]).toFixed(1)}" r="4" fill="${s.color}"><title>${esc(s.label)}: ${fmt(p.v[s.key], 1)} ${s.unit} (${fmtDate(p.date)})</title></circle>`).join('');
  const delta = vs[vs.length - 1] - vs[0], eps = 0.05;
  const cls = Math.abs(delta) < eps ? '' : ((s.good === 'down') === (delta < 0) ? 'good' : 'bad');
  return `<div class="mini"><div class="spread"><b class="small">${esc(s.label)}</b><span class="chip ${cls}">${fmtSigned(delta, 1)} ${s.unit}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de ${esc(s.label)}">${g}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}
function lineChart(cons) {
  const SERIES = [{ key: 'weight', label: 'Peso', unit: 'kg', color: '#0f766e', good: 'down' }, { key: 'fatKg', label: 'Masa grasa', unit: 'kg', color: '#e8663d', good: 'down' }, { key: 'muscleKg', label: 'Músculo esquelético', unit: 'kg', color: '#2563eb', good: 'up' }];
  const pts = cons.map(c => ({ date: c.date, v: metricsOf(c) }));
  if (pts.length < 2) return '<div class="note">Se necesitan al menos 2 consultas para graficar la evolución.</div>';
  const charts = SERIES.filter(s => pts.filter(p => p.v[s.key] != null).length >= 2).map(s => miniChart(pts, s));
  return charts.length ? `<div class="grid g3 charts">${charts.join('')}</div>` : '<div class="note">Sin datos suficientes para graficar.</div>';
}

function syncInputs() {

}
ACTIONS['tab'] = el => {

  ['antro', 'energia', 'plan', 'notas'].forEach(k => { $('#tab-' + k).hidden = k !== curTab; });
};
function onBind(el, isChange) {
  const path = el.dataset.bind; let v = el.value;
  if (el.dataset.t === 'num') v = toNum(v);
  setPath(D, path, v);
  if (path === 'cfg.goal' && isChange) {
    const g = GOAL_DEFAULTS[v]; D.cfg.goalAdjustPct = g.adj; D.cfg.proteinMode = g.proteinMode; D.cfg.proteinValue = g.proteinValue; D.cfg.lipidsPct = g.lipidsPct; syncInputs();
  }
  if (path === 'cfg.proteinMode' && isChange) { D.cfg.proteinValue = v === 'gkg' ? GOAL_DEFAULTS[D.cfg.goal].proteinValue : 20; syncInputs(); }
  if (path === 'date' && isChange && !consultById(D.id)) { const cs = consOf(D.patientId); D.type = cs.length ? 'subsecuente' : 'primera_vez'; syncInputs(); }
  refreshCalcs();
}
function draftInputs() {

}

      <div><div class="lbl">IMC</div><div class="big">${fmt(bmi, 1)}</div><span class="chip ${who.cls}">${who.label}</span></div>
      <div><div class="lbl">Masa grasa</div><div class="big">${m.fatKg != null ? fmt(m.fatKg, 1) : '—'}<span class="small muted"> kg</span></div></div>

      ${inp.age < 18 ? '<p class="note warn mt">Paciente menor de 18 años: la clasificación OMS del IMC es para adultos.</p>' : ''}</div>`;
  } else $('#anthro-derived').innerHTML = '<div class="note">Captura peso y estatura para calcular el IMC y la composición corporal.</div>';

  const mac = (n, m, color) => `<div class="macro"><div class="spread"><b>${n}</b><span class="small"><b>${fmt(m.g, 0)} g</b> · ${fmt(m.kcal, 0)} kcal · ${fmt(m.pct, 0)} %</span></div><div class="bar"><i style="width:${Math.min(m.pct, 100)}%;background:${color}"></i></div></div>`;
  return `<div class="grid g2"><div>
    ${row('Ecuación', esc(R.equationLabel))}${row('Peso de referencia', `${fmt(R.referenceWeightKg)} kg`)}${row('GEB', `${fmt(R.bmr, 0)} kcal`, true)}

    ${E ? sec('Requerimiento energético', `<div class="rpt-kv">${kv('Ecuación', esc(E.equationLabel))}${kv('GEB', fmt(E.bmr, 0) + ' kcal')}${kv(`Actividad física (FA ${fmt(E.activityFactor, 2)})`, fmt(E.afKcal, 0) + ' kcal')}${kv('ETA', E.model === 'additive' ? `${fmt(E.etaPercent)} % · ${fmt(E.etaKcal, 0)} kcal` : 'incluido en FA')}
      ${kv('GET', fmt(E.tee, 0) + ' kcal')}${kv('Objetivo', GOAL_LABEL[E.goal] + ` (${fmtSigned(E.goalAdjustPct, 0)} %)`)}${kv('Meta calórica', `<span style="color:var(--brand)">${fmt(E.targetKcal, 0)} kcal/día</span>`)}${kv('Peso de referencia', fmt(E.referenceWeightKg) + ' kg')}</div>
      <table class="tbl mt"><thead><tr><th>Macronutrimento</th><th class="num">Gramos</th><th class="num">kcal</th><th class="num">% kcal</th><th class="num">g/kg</th></tr></thead><tbody>
      ${[['Proteínas', E.macros.protein], ['Lípidos', E.macros.lipids], ['Hidratos de carbono', E.macros.carbs]].map(([n, x]) => `<tr><td>${n}</td><td class="num">${fmt(x.g, 0)} g</td><td class="num">${fmt(x.kcal, 0)}</td><td class="num">${fmt(x.pct, 0)} %</td><td class="num">${fmt(x.gkg, 2)}</td></tr>`).join('')}</tbody></table>`) : ''}
    ${hasPlan ? sec('Plan de alimentación (sistema de equivalentes SMAE)', `${mealsHTML}<table class="tbl mt"><thead><tr><th>Total diario del plan</th><th class="num">Energía</th><th class="num">Proteínas</th><th class="num">Lípidos</th><th class="num">HC</th></tr></thead><tbody>
      <tr><td><b>Plan</b></td><td class="num">${fmt(T.kcal, 0)} kcal</td><td class="num">${fmt(T.p, 0)} g</td><td class="num">${fmt(T.l, 0)} g</td><td class="num">${fmt(T.c, 0)} g</td></tr>
      ${E ? `<tr><td><b>Meta</b></td><td class="num">${fmt(E.targetKcal, 0)} kcal</td><td class="num">${fmt(E.macros.protein.g, 0)} g</td><td class="num">${fmt(E.macros.lipids.g, 0)} g</td><td class="num">${fmt(E.macros.carbs.g, 0)} g</td></tr>` : ''}</tbody></table>
      ${eqRows ? `<h4 class="mt mb">Equivalentes por día</h4><table class="tbl"><tbody>${eqRows}</tbody></table>` : ''}`) : ''}
    ${c.notes ? sec('Notas clínicas', `<p style="white-space:pre-wrap">${esc(c.notes)}</p>`) : ''}
    ${shop ? sec('Lista de compras', shop) : ''}
    <div class="sign"><div>${esc(S_.nutritionist || 'Nutriólogo(a)')}${S_.license ? '<br><span class="muted xs">Cédula ' + esc(S_.license) + '</span>' : ''}</div></div>
    <p class="xs muted mt">Valores de equivalentes: Sistema Mexicano de Alimentos Equivalentes (SMAE), 5ª ed., Tabla 2 (aporte nutrimental promedio). Documento de apoyo; no sustituye el juicio clínico.</p></article>`;
}

/* ---------- Catálogo de alimentos ---------- */
function viewFoods() {
  const rows = [...S.foods].sort((a, b) => a.groupId - b.groupId || a.name.localeCompare(b.name, 'es'));
  view().innerHTML = pageHead('Catálogo de alimentos', 'Alimentos con medida casera y peso para convertir equivalentes en lista de compras',
    `<button class="btn" data-act="foods-export">${icon('download', 16)} Exportar</button><button class="btn primary" data-act="food-form">${icon('plus', 16)} Agregar alimento</button>`) +
    `<div class="note mb">El catálogo inicia con <b>${seedFoods().length} alimentos verificados</b> de la tabla de Verduras del SMAE 5ª ed. Agrega los que uses a diario o impórtalos en bloque desde una hoja de cálculo (CSV). Los valores de cada alimento deben copiarse de tu edición del SMAE.</div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Alimento</th><th>Grupo SMAE</th><th>Porción</th><th class="num">Peso bruto</th><th class="num">Peso neto</th><th class="num">kcal</th><th class="num">P</th><th class="num">L</th><th class="num">HC</th><th></th></tr></thead><tbody>
    ${rows.map(f => `<tr><td><b>${esc(f.name)}</b><div class="xs muted">${esc(f.source || 'Personalizado')}</div></td><td><i class="dot" style="--c:${(GROUP_BY_ID[f.groupId] || {}).color}"></i> ${esc(groupName(GROUP_BY_ID[f.groupId]))}</td><td>${formatFraction(f.qty)} ${esc(f.unit)}</td><td class="num">${f.gross != null ? fmt(f.gross, 0) + ' ' + f.wunit : '—'}</td><td class="num">${fmt(f.net, 0)} ${f.wunit}</td><td class="num">${fmt(f.kcal, 0)}</td><td class="num">${fmt(f.protein)}</td><td class="num">${fmt(f.lipids)}</td><td class="num">${fmt(f.carbs)}</td><td class="right"><button class="btn ghost sm danger" data-act="food-del" data-id="${f.id}" aria-label="Eliminar">${icon('trash', 15)}</button></td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card mt"><div class="card-h"><h2>Importar desde CSV</h2></div><p class="muted small mb">Encabezados: <code>alimento, grupo_id, cantidad, unidad, peso_bruto, peso_neto, kcal, proteina, lipidos, carbohidratos</code>. Acepta coma, punto y coma o tabulador. La cantidad admite fracciones (1/2, 3 1/2). <code>grupo_id</code> es el número del grupo SMAE (1 = Verduras, 2 = Frutas, 3 = Cereales sin grasa, …, 19).</p>
    <div class="field"><textarea id="csv-in" placeholder="alimento;grupo_id;cantidad;unidad;peso_bruto;peso_neto;kcal;proteina;lipidos;carbohidratos&#10;Apio crudo;1;1;taza;101;90;14;0.6;0.2;2.7"></textarea></div>
    <div class="gap mt"><button class="btn primary" data-act="foods-import">Importar</button><details class="small muted"><summary>Ver ids de grupos</summary>${GROUPS.map(g => `${g.id} = ${esc(groupName(g))}`).join(' · ')}</details></div></div>`;
}
ACTIONS['food-form'] = () => {
  const f = (lab, id, attrs = '') => `<div class="field"><label for="ff-${id}">${lab}</label><input id="ff-${id}" ${attrs}></div>`;
  openModal(`<h2 class="mb">Agregar alimento</h2><div class="form-grid">
    <div class="field wide"><label for="ff-name">Nombre *</label><input id="ff-name" autocomplete="off"></div>
    <div class="field wide"><label for="ff-group">Grupo SMAE *</label><select id="ff-group">${groupOptions(1)}</select></div>
    ${f('Cantidad sugerida *', 'qty', 'placeholder="1/2, 1, 3 1/2…"')}${f('Unidad *', 'unit', 'placeholder="taza, pieza, gramos…"')}
    ${f('Peso bruto', 'gross', 'type="number" step="any" min="0"')}${f('Peso neto *', 'net', 'type="number" step="any" min="0"')}
    <div class="field"><label for="ff-wunit">Unidad de peso</label><select id="ff-wunit"><option value="g">g</option><option value="ml">ml</option></select></div>
    ${f('Energía (kcal) *', 'kcal', 'type="number" step="any" min="0"')}${f('Proteína (g)', 'protein', 'type="number" step="any" min="0"')}${f('Lípidos (g)', 'lipids', 'type="number" step="any" min="0"')}${f('Hidratos de carbono (g)', 'carbs', 'type="number" step="any" min="0"')}</div>
    <div class="m-foot"><button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" data-act="food-save">Guardar</button></div>`);
};
ACTIONS['food-save'] = () => {
  const g = id => $('#ff-' + id).value.trim(), qty = parseQty(g('qty')), net = toNum(g('net')), kcal = toNum(g('kcal'));
  if (!g('name') || !g('unit') || !(qty > 0) || !(net > 0) || kcal == null || kcal < 0) return toast('Completa nombre, cantidad, unidad, peso neto y kcal.', 'bad');
  S.foods.push({ id: uid('food'), name: g('name'), groupId: Number(g('group')), qty, unit: g('unit'), gross: toNum(g('gross')), net, wunit: g('wunit'), kcal, protein: toNum(g('protein')) || 0, lipids: toNum(g('lipids')) || 0, carbs: toNum(g('carbs')) || 0, source: 'Personalizado' });
  save(); closeModal(); toast('Alimento agregado.', 'good'); viewFoods();
};
ACTIONS['food-del'] = el => {
  const f = foodById(el.dataset.id); if (!f) return;
  const used = S.consultations.filter(c => c.plan.meals.some(m => m.items.some(i => i.foodId === f.id))).length;
  if (!confirm(`¿Eliminar "${f.name}" del catálogo?${used ? `\nSe usa en ${used} consulta(s); esos renglones pasarán a equivalente genérico.` : ''}`)) return;
  S.foods = S.foods.filter(x => x.id !== f.id); save(); viewFoods();
};
ACTIONS['foods-export'] = () => download('catalogo-alimentos.json', JSON.stringify(S.foods, null, 2), 'application/json');
ACTIONS['foods-import'] = () => {
  const txt = $('#csv-in').value.trim(); if (!txt) return toast('Pega el contenido CSV.', 'bad');
  const rows = txt.split(/\r?\n/).filter(r => r.trim()), delim = rows[0].includes('\t') ? '\t' : rows[0].includes(';') ? ';' : ',';
  const head = rows[0].split(delim).map(h => h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  const col = n => head.indexOf(n); const need = ['alimento', 'grupo_id', 'cantidad', 'unidad', 'peso_neto', 'kcal'];
  const miss = need.filter(n => col(n) < 0); if (miss.length) return toast('Faltan columnas: ' + miss.join(', '), 'bad');
  let ok = 0; const bad = [];
  rows.slice(1).forEach((r, i) => {
    const c = r.split(delim).map(x => x.trim()), gid = Number(c[col('grupo_id')]), qty = parseQty(c[col('cantidad')]), net = toNum(c[col('peso_neto')]), kcal = toNum(c[col('kcal')]);
    if (!c[col('alimento')] || !GROUP_BY_ID[gid] || !(qty > 0) || !(net > 0) || kcal == null) { bad.push(i + 2); return; }
    const gi = col('peso_bruto'), pi = col('proteina'), li = col('lipidos'), ci = col('carbohidratos');
    S.foods.push({ id: uid('food'), name: c[col('alimento')], groupId: gid, qty, unit: c[col('unidad')], gross: gi >= 0 ? toNum(c[gi]) : null, net, wunit: 'g', kcal, protein: pi >= 0 ? toNum(c[pi]) || 0 : 0, lipids: li >= 0 ? toNum(c[li]) || 0 : 0, carbs: ci >= 0 ? toNum(c[ci]) || 0 : 0, source: 'Importado (CSV)' }); ok++;
  });
  save(); toast(`${ok} alimento(s) importado(s)${bad.length ? `; filas con error: ${bad.slice(0, 8).join(', ')}` : ''}.`, bad.length ? 'bad' : 'good'); viewFoods();
};

/* ---------- Ajustes y respaldo ---------- */
function viewSettings() {
  const s = S.settings;
  view().innerHTML = pageHead('Ajustes', 'Datos del consultorio, valores por defecto y respaldos') +
    `<div class="card"><div class="card-h"><h2>Consultorio y reportes</h2></div><div class="form-grid">
      <div class="field"><label for="s-clinic">Nombre del consultorio</label><input id="s-clinic" value="${esc(s.clinicName)}"></div>
      <div class="field"><label for="s-nut">Nutriólogo(a)</label><input id="s-nut" value="${esc(s.nutritionist)}"></div>
      <div class="field"><label for="s-lic">Cédula profesional</label><input id="s-lic" value="${esc(s.license)}"></div>
      <div class="field"><label for="s-eta">ETA por defecto (%)</label><input id="s-eta" type="number" step="0.5" min="0" max="30" value="${esc(s.defaultEta)}"></div>
      <div class="field"><label for="s-days">Días de la lista de compras</label><input id="s-days" type="number" min="1" max="60" value="${esc(s.shoppingDays)}"></div>
      <div class="field"><label for="s-theme">Tema</label><select id="s-theme"><option value="auto" ${s.theme === 'auto' ? 'selected' : ''}>Automático</option><option value="light" ${s.theme === 'light' ? 'selected' : ''}>Claro</option><option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Oscuro</option></select></div></div>
      <div class="mt"><button class="btn primary" data-act="save-settings">Guardar ajustes</button></div></div>
    <div class="card"><div class="card-h"><h2>Respaldo de datos</h2></div><p class="muted small mb">La información vive en el almacenamiento de este navegador. Descarga un respaldo antes de limpiar el navegador o cambiar de equipo.</p>
      <div class="gap"><button class="btn" data-act="export-backup">${icon('download', 16)} Descargar respaldo (JSON)</button><label class="btn" for="import-file">${icon('upload', 16)} Restaurar respaldo</label><input id="import-file" type="file" accept="application/json,.json" hidden>
      <button class="btn" data-act="load-demo">Cargar datos de demostración</button><button class="btn danger" data-act="reset-all">Borrar todos los datos</button></div></div>
    <div class="card"><div class="card-h"><h2>Acerca de las fórmulas</h2></div><ul class="small muted" style="margin:0;padding-left:18px;line-height:1.7">
      <li>GEB: Mifflin-St Jeor, Harris-Benedict (1919 y 1984), Valencia (población mexicana), FAO/OMS/UNU 1985 (Schofield) y Katch-McArdle.</li>
      <li>GET aditivo: GEB + ETA + AF. Factorial (FAO/OMS): GEB × FA. El ETA (10 % por defecto) y el FA son editables.</li>
      <li>Equivalentes: SMAE 5ª edición, Tabla 2 (aporte nutrimental promedio por grupo y subgrupo).</li>
      <li>IMC: clasificación de la OMS para adultos. Las tablas CDC pediátricas no están incluidas en esta versión.</li></ul></div>`;
}
ACTIONS['save-settings'] = () => {
  Object.assign(S.settings, { clinicName: $('#s-clinic').value.trim(), nutritionist: $('#s-nut').value.trim(), license: $('#s-lic').value.trim(), theme: $('#s-theme').value });
  const eta = toNum($('#s-eta').value), days = toNum($('#s-days').value);
  if (eta != null && eta >= 0 && eta <= 30) S.settings.defaultEta = eta;
  if (days != null && days >= 1 && days <= 60) S.settings.shoppingDays = Math.round(days);
  save(); applyTheme(); toast('Ajustes guardados.', 'good');
};
function download(name, text, mime) {
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: mime }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
ACTIONS['export-backup'] = () => download(`nutriclin-respaldo-${todayISO()}.json`, JSON.stringify({ app: 'nutriclin', exportedAt: new Date().toISOString(), data: S }, null, 2), 'application/json');
function importBackup(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), d = o.data || o;
      if (!Array.isArray(d.patients) || !Array.isArray(d.consultations)) throw new Error('Formato no reconocido');
      if (!confirm('Se reemplazarán TODOS los datos actuales por los del respaldo. ¿Continuar?')) return;
      const base = defaultState(); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, base, d, { settings: { ...base.settings, ...(d.settings || {}) } });
      save(); applyTheme(); toast('Respaldo restaurado.', 'good'); go('#/panel');
    } catch (e) { toast('No se pudo leer el respaldo: ' + e.message, 'bad'); }
  };
  r.readAsText(file); input.value = '';
}
ACTIONS['reset-all'] = () => {
  if (!confirm('¿Borrar TODOS los pacientes, consultas y alimentos personalizados? No se puede deshacer.')) return;
  const base = defaultState(); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, base); save(); applyTheme(); toast('Datos borrados.'); go('#/panel');
};
ACTIONS['load-demo'] = () => {
  if (S.patients.some(p => p.id === 'demo_patient')) return toast('Los datos de demostración ya existen.');
  const t = todayISO(), pat = { id: 'demo_patient', firstName: 'María Fernanda', lastName: 'López Hernández', birthDate: '1990-05-14', sex: 'female', phone: '981 000 0000', email: 'demo@ejemplo.com', heightCm: 163, pathologies: ['Resistencia a la insulina'], allergies: ['Nuez'], medications: [], notes: 'Paciente de demostración (datos ficticios).', createdAt: new Date().toISOString() };
  S.patients.push(pat);
  const rows = [[-56, 82.4, 38.5, 27.0, 9, 41, 94, 99, 108, 'Primera consulta. Refiere comer fuera de casa con frecuencia y poca ingesta de agua. Se inicia déficit moderado y plan por equivalentes.'],
  [-28, 80.6, 37.2, 27.4, 8, 40, 92, 97, 107, 'Buena adherencia (≈80 %). Aumenta consumo de verduras. Se mantiene el plan.'],
  [-3, 79.1, 36.0, 27.9, 8, 38, 90.5, 95, 106, 'Continúa descenso de grasa con ganancia de músculo. Se refuerza actividad de fuerza 2 veces por semana.']];
  rows.forEach(([off, w, fat, mus, vis, ma, waist, abd, hip, notes], i) => {
    const date = addDaysISO(t, off), cfg = { ...defaultCfg('fat_loss'), equationId: 'valencia', activityPreset: 'light' };
    const energy = computeEnergy({ sex: 'female', age: ageYears(pat.birthDate, date), weightKg: w, heightCm: 163, bodyFatPct: fat }, cfg);
    S.consultations.push({ id: uid('con'), patientId: pat.id, type: i === 0 ? 'primera_vez' : 'subsecuente', date, anthro: { weightKg: w, heightCm: 163, bodyFatPct: fat, musclePct: mus, visceralFat: vis, metabolicAge: ma, waist, abdomen: abd, hip, bmi: calcBMI(w, 163) }, cfg, energy, plan: suggestPlan(energy), notes, createdAt: new Date(utc(date)).toISOString(), updatedAt: new Date().toISOString() });
  });
  save(); toast('Datos de demostración cargados.', 'good'); go('#/paciente/demo_patient');
};

/* ============================ ARRANQUE ============================ */
initChrome();
route();
</script>
