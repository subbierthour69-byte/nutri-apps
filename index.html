<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriClin · Nutrición clínica</title>
<!--
  NutriClin v2 — un solo archivo, sin dependencias ni servidor.
  DESPLIEGUE: sube como index.html a un repo y activa Settings → Pages → main / root.
  DATOS: localStorage del navegador (locales y privados). Exporta respaldos en Ajustes.
  PEDIATRÍA: tablas L-M-S oficiales de la CDC (NCHS 2000) incluidas en este script.
-->
<style>
/* ===== Tokens claro/oscuro ===== */
:root{--bg:#f3f6f4;--card:#fff;--tx:#17302c;--mut:#667a76;--pri:#0e8f78;--bd:#dde7e4;--side:#10302c;--bad:#c8432f;--warn:#d98a14;--ok:#1f9d5a}
:root[data-theme=dark]{--bg:#0e1917;--card:#162623;--tx:#e3efec;--mut:#92aaa5;--bd:#27403b;--side:#09201d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}a{color:var(--pri)}
/* ===== Menú lateral ===== */
aside{width:236px;background:var(--side);color:#c9e6df;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:left .2s;z-index:20}
.brand{font-size:18px;font-weight:700;color:#fff;padding:4px 10px 10px}
.sec{font-size:11px;color:#7fb5a9;margin:16px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover{background:#ffffff14}nav a.on{background:var(--pri);color:#fff}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ===== Contenido ===== */
main{flex:1;min-width:0;padding:20px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top h1{flex:1}
#burger{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:8px;padding:8px 14px;background:var(--pri);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right}.wrap{overflow-x:auto}
td input{padding:4px 6px;min-width:70px}
.kpi{font-size:24px;font-weight:700;margin:0}.kpi small{font-size:12px;color:var(--mut);font-weight:400;display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);margin:2px;cursor:pointer;font-size:12px;background:var(--bg)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.msg{padding:12px;border-radius:8px;background:#d98a1422;border:1px solid var(--warn)}
tr.h td{background:var(--bg);font-weight:700;color:var(--pri)}
.bar{height:8px;border-radius:4px;background:var(--bd);min-width:90px}.bar i{display:block;height:100%;border-radius:4px}
.pw{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pie{width:230px;height:230px}.sl{transition:stroke-width .15s;cursor:pointer}.sl:hover{stroke-width:9}
.lg div{margin:4px 0}.lg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
#toast{position:fixed;bottom:18px;right:18px;background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50}
.av{border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;font-weight:700;color:#fff;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.gap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btnlike{display:inline-flex;align-items:center;margin:0;padding:4px 9px;font-size:12px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);cursor:pointer}
nav a.on{background:var(--pri);color:#fff}
/* ===== Responsivo ===== */
@media(max-width:820px){aside{position:fixed;left:-250px}aside.open{left:0}#burger{display:inline-flex}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =====================================================================
   1. UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

/* =====================================================================

   ===================================================================== */
const KEY='nutriclin_v2';
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||{p:[],sel:null,csel:{},theme:null,smae:null};

const cur=()=>DB.p.find(x=>x.id===DB.sel);
const curC=()=>{const p=cur();if(!p||!p.cons||!p.cons.length)return null;return p.cons.find(c=>c.id===DB.csel[p.id])||p.cons[p.cons.length-1]};
function newCons(p){const l=[...(p.cons||[])].sort((a,b)=>a.fecha.localeCompare(b.fecha)).pop()||{};
 return{id:uid(),fecha:today(),peso:'',est:l.est||p.est||'',graso:'',musc:'',cin:'',cad:'',bra:'',mus:'',
  formula:l.formula||'',af:l.af||'',eta:l.eta??'',dieta:JSON.parse(JSON.stringify(l.dieta||[])),micro:{},notas:''}}

/* Interpolación lineal de L, M, S a la edad exacta en meses */
function lms(k,sx,mes){const t=CDC[k][sx],n=t.length;if(mes<t[0][0]||mes>t[n-1][0]+.6)return null;
 if(mes>=t[n-1][0])return t[n-1].slice(1);
 let i=0;while(i<n-2&&mes>t[i+1][0])i++;const a=t[i],b=t[i+1],f=(mes-a[0])/(b[0]-a[0]);
 return[1,2,3].map(j=>a[j]+(b[j]-a[j])*f)}
/* Z = ((X/M)^L − 1)/(L·S)  si L≠0 ;  Z = ln(X/M)/S  si L=0   (fórmula oficial CDC) */
const zs=(x,[L,M,S])=>L?((x/M)**L-1)/(L*S):Math.log(x/M)/S;
/* Percentil = Φ(Z)·100, función de distribución normal estándar (Abramowitz-Stegun) */
const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),
 q=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-q:q};
function dx(k,z,pc){if(k==='bmi')return pc<5?'Bajo peso':pc<85?'Normal':pc<95?'Sobrepeso':'Obesidad';
 return z<-2?'Bajo (< −2 DE)':z>2?'Alto (> +2 DE)':'Normal'}

/* Resultado pediátrico (<18 años): Peso/Edad, Talla/Edad, IMC/Edad con edad exacta en la fecha de consulta */
function pedHTML(c,p){const e=edad(p.nac,c.fecha);if(!e||e.a>=18)return '';
 const pe=num(c.peso),t=num(c.est);if(!pe||!t)return '<div class="msg">Captura peso y estatura para calcular percentiles y Z-scores.</div>';
 const sx=p.sexo==='M'?1:2,inf=e.dec<24,age=e.dec,imc=pe/(t/100)**2;
 const rows=[['Peso/Edad',inf?'wti':'wt',pe,'kg'],[inf?'Longitud/Edad':'Talla/Edad',inf?'len':'sta',t,'cm'],['IMC/Edad','bmi',imc,'kg/m²']];
 return '<div class="wrap"><table><tr><th>Indicador<th class="n">Valor<th class="n">Z-score<th class="n">Percentil<th>Interpretación</tr>'+
 rows.map(([n,k,v,u])=>{const L=k==='bmi'&&inf?null:lms(k,sx,age);
  if(!L)return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td colspan=3>${k==='bmi'?'La CDC define IMC/Edad desde los 24 meses':'Fuera de rango de las tablas CDC'}`;
  const z=zs(v,L),pc=cdf(z)*100;return`<tr><td>${n}<td class="n">${fx(v)} ${u}<td class="n">${fx(z,2)}<td class="n">P${fx(pc,1)}<td>${dx(k,z,pc)}`}).join('')+
 '</table></div><p class="note">Referencia CDC 2000 (EE. UU.). En menores de 2 años la OMS suele preferirse; los percentiles son una herramienta de apoyo, no un diagnóstico.</p>'}

/* Edad exacta (años + meses + meses decimales) a la fecha de referencia */
function edad(nac,ref){if(!nac)return null;const n=new Date(nac+'T00:00'),h=ref?new Date(ref+'T00:00'):new Date();
 let m=(h.getFullYear()-n.getFullYear())*12+h.getMonth()-n.getMonth();if(h.getDate()<n.getDate())m--;
 return m<0?null:{a:Math.floor(m/12),m:m%12,tot:m,dec:(h-n)/(30.4375*864e5)}}
const edTxt=e=>e?`${e.a} años ${e.m} meses`:'—';
/* GEB en kcal/día. p=kg · t=cm · e=años · s='M'|'F' */
const FM={
 mif:['Mifflin-St Jeor',(p,t,e,s)=>10*p+6.25*t-5*e+(s==='M'?5:-161)],
 hb:['Harris-Benedict',(p,t,e,s)=>s==='M'?66.5+13.75*p+5.003*t-6.755*e:655.1+9.563*p+1.85*t-4.676*e],
 val:['Valencia (población mexicana, ≥18 a)',(p,t,e,s)=>{if(e<18)return null;const i=e<30?0:e<60?1:2;
   const c=s==='M'?[[13.37,747],[13.08,693],[14.21,429]]:[[11.02,679],[10.92,677],[10.98,520]];return c[i][0]*p+c[i][1]}],
 sch:['Schofield FAO/OMS (<18 a)',(p,t,e,s)=>{if(e>=18)return null;const m=s==='M';
   return e<3?(m?60.9*p-54:61*p-51):e<10?(m?22.7*p+495:22.5*p+499):(m?17.5*p+651:12.2*p+746)}]};
const AF=[['Sedentario',1.2],['Actividad ligera',1.375],['Actividad moderada',1.55],['Actividad intensa',1.725],['Muy intensa',1.9]];
/* GEB → gasto por actividad (GEB×(AF−1)) → ETA (% del GEB+actividad) → GET total */
function en(c,p){const e=edad(p.nac,c.fecha),pe=num(c.peso),t=num(c.est);if(!e||!pe||!t)return null;
 const fm=c.formula||(e.a<18?'sch':'mif'),geb=FM[fm][1](pe,t,e.a,p.sexo),imc=pe/(t/100)**2;if(geb==null)return{imc,err:1};
 const af=num(c.af)||1.2,eP=(c.eta===''||c.eta==null)?10:+c.eta,act=geb*(af-1),et=(geb+act)*eP/100;
 return{imc,geb,act,eta:et,etaP:eP,get:geb+act,tot:geb+act+et}}

const dietRow=(d,i)=>{const f=foodOf(d.k);if(!f)return'';const n=+d.n||0;
 return`<tr data-i="${i}"><td><select data-m="${i}">${MEALS.map(m=>`<option${m===d.t?' selected':''}>${m}</option>`).join('')}</select><td>${esc(f.n)} <small style="color:var(--mut)">(${esc(f.po)})</small>
 <td><input data-q="${i}" type="number" min="0" step="0.5" value="${d.n}" style="width:80px"><td class="n kc">${fx(f.kcal*n,0)}<td class="n pp">${fx(f.p*n)}<td class="n ll">${fx(f.l*n)}<td class="n hh">${fx(f.hc*n)}<td><button class="s d" data-d="${i}">✕</button>`};
V.cons={t:'Consulta',h(){const p=cur();if(!p)return noP;ensureC(p);const c=curC();DB.csel[p.id]=c.id;
 const d=(k,l,u,st='0.1')=>`<div><label>${l}</label><input data-f="${k}" type="number" step="${st}" value="${esc(c[k])}" placeholder="${u}"></div>`;
 const cs=[...p.cons].sort((a,b)=>b.fecha.localeCompare(a.fecha));
 return `<div class="card"><h2>${avHTML(p,34)} ${esc(p.nombre+' '+p.apellidos)} · ${p.sexo==='M'?'Hombre':'Mujer'}</h2><div class="grid" style="align-items:end">
 <div><label>Historial de consultas</label><select id="csel">${cs.map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${x.fecha}${x.peso?' · '+x.peso+' kg':''}</option>`).join('')}</select></div>
 <div><button id="bnc">+ Nueva consulta</button> <button class="d s" id="bdc">Eliminar</button></div>
 <div><label>Fecha de la consulta</label><input data-f="fecha" type="date" value="${esc(c.fecha)}"></div>
 <div><label>Edad en esta consulta</label><input id="age" readonly></div></div></div>
 <div class="card"><h2>Gasto energético</h2><div class="grid">${d('peso','Peso','kg')}${d('est','Estatura','cm')}
 <div><label>Fórmula de GEB</label><select data-f="formula">${Object.entries(FM).map(([k,v])=>`<option value="${k}"${(c.formula||(edad(p.nac,c.fecha)?.a<18?'sch':'mif'))===k?' selected':''}>${v[0]}</option>`).join('')}</select></div>
 <div><label>Nivel de actividad (sugerido)</label><select id="afsel"><option value="">Elegir…</option>${AF.map(([n,v])=>`<option value="${v}">${n} (${v})</option>`).join('')}</select></div>
 ${d('af','Factor de actividad (editable)','1.2','0.001')}${d('eta','ETA % (efecto térmico)','10','1')}</div><div id="o1" style="margin-top:14px"></div></div>
 <div class="card" id="cped"><h2>Pediatría CDC · método LMS</h2><div id="o2"></div></div>
 <div class="card"><h2>Antropometría y composición corporal</h2><div class="grid">${d('graso','% de grasa','%')}${d('musc','Masa muscular','kg')}
 ${d('cin','Perímetro cintura','cm')}${d('cad','Perímetro cadera','cm')}${d('bra','Perímetro brazo','cm')}${d('mus','Perímetro muslo','cm')}</div><div id="o3" style="margin-top:14px"></div></div>
 <div class="card"><h2>Plan de equivalentes (se arma desde el <a href="#cat">Catálogo SMAE</a>)</h2>
 <div class="wrap"><table><thead><tr><th>Tiempo<th>Alimento<th>Porciones<th class="n">kcal<th class="n">Prot (g)<th class="n">Lípidos (g)<th class="n">HC (g)<th></tr></thead><tbody id="dtb"></tbody></table></div>
 <div id="dtot" style="margin-top:12px"></div></div>
 <div class="card"><h2>Equivalentes y distribución</h2><div id="eqt"></div></div>
 <div class="card"><label>Notas de la consulta</label><textarea data-f="notas">${esc(c.notas)}</textarea></div>`},
 i(){const p=cur();if(!p)return;const c=curC();
  const rowsUpd=()=>{const t=planT(c),e=en(c,p),s=(t.p*4+t.l*9+t.hc*4)||1;
   const gl=Object.entries(t.g).map(([g,n])=>`${esc(g)}: <b>${fx(n,1)}</b>`).join(' · ')||'Sin alimentos en el plan';
   $('#dtot').innerHTML=`<div class="grid">${kpi('Energía del plan',fx(t.kcal,0)+' kcal')}${e&&e.tot?kpi('% del GET + ETA',fx(t.kcal/e.tot*100,0)+' %'):''}
   ${kpi('Proteínas',fx(t.p)+' g · '+fx(t.p*4/s*100,0)+' %')}${kpi('Lípidos',fx(t.l)+' g · '+fx(t.l*9/s*100,0)+' %')}${kpi('Hidratos de carbono',fx(t.hc)+' g · '+fx(t.hc*4/s*100,0)+' %')}</div>
   <p class="note">Equivalentes por grupo — ${gl}</p>`;const q=$('#eqt');if(q)q.innerHTML=eqHTML(c,p,true)};
  const drawDiet=()=>{$('#dtb').innerHTML=(c.dieta||[]).map(dietRow).join('')||'<tr><td colspan=8>Agrega alimentos con el botón + del catálogo.';rowsUpd()};
  const calc=()=>{const ed=edad(p.nac,c.fecha);$('#age').value=edTxt(ed);const e=en(c,p),k=(l,v,u)=>`<div class="card kpi" style="margin:0">${v}<small>${l}${u?' ('+u+')':''}</small></div>`;
   $('#o1').innerHTML=!e?'<div class="msg">Captura peso y estatura para calcular.</div>':e.err?'<div class="msg">La fórmula elegida no aplica a esta edad (Valencia: ≥18 años; Schofield: &lt;18 años). Elige otra.</div>':
    `<div class="grid">${k('IMC',fx(e.imc),'kg/m²')}${k('GEB',fx(e.geb,0),'kcal')}${k('Gasto por actividad',fx(e.act,0),'kcal')}${k('ETA '+e.etaP+' %',fx(e.eta,0),'kcal')}${k('GET',fx(e.get,0),'kcal')}${k('GET + ETA',fx(e.tot,0),'kcal')}</div>`;
   $('#cped').style.display=ed&&ed.a<18?'':'none';$('#o2').innerHTML=pedHTML(c,p);
   /* Composición corporal: masa grasa, masa muscular y residual (peso − grasa − músculo) */
   const pe=num(c.peso),gr=num(c.graso),mu=num(c.musc);
   if(!pe||gr==null||mu==null){$('#o3').innerHTML='<div class="msg">Captura peso, % de grasa y masa muscular para ver la gráfica.</div>';rowsUpd();return}
   const mg=pe*gr/100,res=pe-mg-mu;if(res<0){$('#o3').innerHTML='<div class="msg">La masa grasa + muscular supera el peso. Revisa los datos.</div>';rowsUpd();return}
   const P=[{n:'Masa grasa',v:mg,c:'#e0852b'},{n:'Masa muscular',v:mu,c:'#0e8f78'},{n:'Masa residual',v:res,c:'#6b86d6'}];
   let off=25;const arcs=P.map(x=>{const q=x.v/pe*100,s=`<circle class="sl" data-n="${x.n}" data-t="${fx(x.v)} kg · ${fx(q)} %" cx="21" cy="21" r="15.9155" fill="none" stroke="${x.c}" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${off}"/>`;off-=q;return s}).join('');
   $('#o3').innerHTML=`<div class="pw"><svg class="pie" viewBox="0 0 42 42" role="img" aria-label="Composición corporal">${arcs}<text id="pt1" x="21" y="20.5" text-anchor="middle" font-size="3" fill="currentColor" font-weight="700">${fx(pe)} kg</text><text id="pt2" x="21" y="24.5" text-anchor="middle" font-size="2.4" fill="currentColor">Pasa el cursor</text></svg>
    <div class="lg">${P.map(x=>`<div><b style="background:${x.c}"></b>${x.n}: <strong>${fx(x.v)} kg</strong> (${fx(x.v/pe*100)} %)</div>`).join('')}
    <div style="margin-top:10px;color:var(--mut)">Índice cintura/cadera: <b>${num(c.cin)&&num(c.cad)?fx(c.cin/c.cad,2):'—'}</b></div></div></div>`;
   $('#o3').querySelectorAll('.sl').forEach(s=>{const on=()=>{$('#pt1').textContent=s.dataset.n;$('#pt2').textContent=s.dataset.t};
    s.onmouseenter=on;s.onclick=on;s.onmouseleave=()=>{$('#pt1').textContent=fx(pe)+' kg';$('#pt2').textContent='Pasa el cursor'}});rowsUpd()};
  const v=$('#view');
  v.oninput=e=>{const t=e.target,f=t.dataset.f;
   if(f){c[f]=t.value;if(f==='af')$('#afsel').value='';save();calc();if(f==='fecha')$('#csel').options[$('#csel').selectedIndex].text=c.fecha+(c.peso?' · '+c.peso+' kg':'')}
   if(t.dataset.q!==undefined){const i=+t.dataset.q,d=c.dieta[i],fd=foodOf(d.k);d.n=t.value;save();const r=t.closest('tr'),n=+d.n||0;
    r.querySelector('.kc').textContent=fx(fd.kcal*n,0);r.querySelector('.pp').textContent=fx(fd.p*n);r.querySelector('.ll').textContent=fx(fd.l*n);r.querySelector('.hh').textContent=fx(fd.hc*n);rowsUpd()}};
  v.onchange=e=>{const t=e.target;
   if(t.dataset.eq){const[gi,mi]=t.dataset.eq.split('|').map(Number),g=Object.keys(GR)[gi],m=MEALS[mi],want=Math.max(0,num(t.value)||0),
    fpart=c.dieta.filter(d=>!d.k.startsWith('G|')&&d.t===m&&(foodOf(d.k)||{}).g===g).reduce((a,d)=>a+(+d.n||0),0),gen=Math.max(0,want-fpart),k='G|'+g,ix=c.dieta.findIndex(d=>d.k===k&&d.t===m);
    if(gen>0){if(ix>=0)c.dieta[ix].n=gen;else c.dieta.push({k,n:gen,t:m})}else if(ix>=0)c.dieta.splice(ix,1);
    save();drawDiet();return}
   if(t.id==='afsel'&&t.value){c.af=t.value;$('[data-f=af]').value=t.value;save();calc()}
   if(t.dataset.f==='formula'){c.formula=t.value;save();calc()}
   if(t.id==='csel'){DB.csel[p.id]=t.value;save();render()}
   if(t.dataset.m!==undefined){c.dieta[+t.dataset.m].t=t.value;save()}};
  v.onclick=e=>{const t=e.target.closest('button');if(!t)return;
   if(t.id==='bnc'){const n=newCons(p);p.cons.push(n);DB.csel[p.id]=n.id;save();render()}
   if(t.id==='bdc'&&confirm('¿Eliminar esta consulta?')){p.cons=p.cons.filter(x=>x.id!==c.id);delete DB.csel[p.id];save();render()}
   if(t.dataset.d!==undefined){c.dieta.splice(+t.dataset.d,1);save();drawDiet()}};
  drawDiet();calc()}};

/* ---------- CATÁLOGO SMAE (buscador en tiempo real + conexión al plan) ---------- */
V.cat={t:'Catálogo SMAE',h(){const p=cur(),gs=[...new Set(FOODS.map(f=>f.g))];
 return `<div class="card"><div class="grid" style="align-items:end"><div style="grid-column:span 2"><label>Buscar por alimento o grupo</label><input id="q" type="search" placeholder="Ej. frijol, frutas, leche…" autofocus></div>
 <div><label>Grupo</label><select id="gf"><option value="">Todos</option>${gs.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div>
 <div><label>Agregar al plan en</label><select id="mt">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div></div>
 <p id="cnt" class="note"></p><p class="note">${p?'Plan activo: '+esc(p.nombre)+' · consulta '+esc((curC()||{}).fecha||'nueva'):'Selecciona un paciente para poder agregar alimentos a su plan.'}</p></div>
 <div class="card wrap"><table><thead><tr><th>Alimento<th>Grupo<th>Porción<th class="n">Peso neto (g)<th class="n">kcal<th class="n">Prot (g)<th class="n">Lípidos (g)<th class="n">HC (g)<th></tr></thead><tbody id="tb"></tbody></table></div>`},
 i(){const nrm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const draw=()=>{const s=nrm($('#q').value),g=$('#gf').value,r=FOODS.filter(f=>(!g||f.g===g)&&nrm(f.n+' '+f.g).includes(s));
   $('#cnt').textContent=`${r.length} de ${FOODS.length} alimentos · valores por equivalente SMAE.`;
   $('#tb').innerHTML=r.slice(0,300).map(f=>`<tr><td>${esc(f.n)}<td>${esc(f.g)}<td>${esc(f.po)}<td class="n">${fx(f.w,0)}<td class="n">${fx(f.kcal,0)}<td class="n">${fx(f.p)}<td class="n">${fx(f.l)}<td class="n">${fx(f.hc)}<td><button class="s" data-id="${esc(f.id)}">+</button>`).join('')||'<tr><td colspan=9>Sin resultados.'};
  $('#q').oninput=draw;$('#gf').onchange=draw;draw();
  $('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=cur();if(!p)return toast('Selecciona un paciente primero');
   ensureC(p);const c=curC(),t=$('#mt').value,x=c.dieta.find(d=>d.k===b.dataset.id&&d.t===t);
   if(x)x.n=(+x.n||0)+1;else c.dieta.push({k:b.dataset.id,n:1,t});save();toast('Agregado al plan · '+t)}}};

/* ---------- MICRONUTRIMENTOS Y PERFIL LIPÍDICO ---------- */
V.mic={t:'Micronutrimentos y perfil lipídico',h(){const p=cur();if(!p)return noP;ensureC(p);const c=curC(),e=en(c,p),t=planT(c);
 return `<div class="card"><p class="note" style="margin-top:0">Consulta ${esc(c.fecha)}. Si tu base SMAE incluye micronutrientes (campo <code>mic</code>), el plan los suma en <b>Plan</b>; puedes sobrescribir cada valor en <b>Captura</b>. Referencias: IDR de adulto (${p.sexo==='M'?'hombre':'mujer'}); en menores ajusta por edad.</p>
 <div class="wrap"><table><tr><th>Nutriente<th>Unidad<th class="n">Plan<th>Captura<th class="n">Referencia<th>% cubierto</tr>
 ${MIC.map(m=>{if(m.length===1)return`<tr class="h"><td colspan=6>${m[0]}`;const[k,n,u,h,mj,ty]=m;let r=p.sexo==='M'?h:mj;if(r==='ags')r=e?e.tot*.1/9:null;
  return`<tr><td>${n}<td>${u}<td class="n">${t.mic[k]!=null?fx(t.mic[k],2):'—'}<td style="width:110px"><input data-k="${k}" type="number" step="0.01" value="${esc((c.micro||{})[k])}"><td class="n">${r==null?'—':(ty==='max'?'≤ ':'')+fx(r,r<10?1:0)}<td data-b="${k}">`}).join('')}</table></div></div>`},
 i(){const p=cur();if(!p)return;const c=curC(),e=en(c,p),t=planT(c);
  const bars=()=>MIC.forEach(m=>{if(m.length===1)return;const[k,,,h,mj,ty]=m;let r=p.sexo==='M'?h:mj;if(r==='ags')r=e?e.tot*.1/9:null;
   const cell=$(`[data-b=${k}]`);if(!cell)return;const man=num((c.micro||{})[k]),v=man!=null?man:t.mic[k];
   if(r==null||v==null){cell.textContent='—';return}const q=v/r*100,bad=ty==='max'?q>100:q<67;
   cell.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${Math.min(q,100)}%;background:${bad?'var(--bad)':q<90&&ty!=='max'?'var(--warn)':'var(--ok)'}"></i></div>${fx(q,0)} %</div>`});
  $('#view').oninput=ev=>{const k=ev.target.dataset.k;if(k){c.micro=c.micro||{};c.micro[k]=ev.target.value;save();bars()}};bars()}};

/* ---------- AJUSTES ---------- */
V.aj={t:'Ajustes',h(){return `<div class="card"><h2>Base SMAE</h2><p>Alimentos cargados: <b>${FOODS.length}</b> ${DB.smae?'(base propia importada)':'(base incluida)'}.
 Importa tu base estructurada como un archivo JSON con un arreglo de alimentos:</p>
 <pre>[{"n":"Tortilla de maíz","g":"Cereales sin grasa","po":"1 pza","w":30,
  "kcal":70,"p":2,"l":0,"hc":15,"mic":{"ca":45,"fe":0.6}}]</pre>
 <p class="note">Obligatorios: n (nombre), g (grupo), po (porción), w (peso neto g). Si omites kcal/p/l/hc se toman del grupo. Claves de mic: ${MIC.filter(m=>m.length>1).map(m=>m[0]).join(', ')}.</p>
 <button id="bsm">Importar base SMAE (.json)</button> <button class="g" id="brs">Restaurar base incluida</button><input type="file" id="fsm" accept=".json" hidden></div>
 <div class="card"><h2>Respaldo de datos</h2><p>Los datos viven solo en este navegador. Exporta un respaldo con frecuencia.</p>
 <button id="bex">Exportar respaldo (.json)</button> <button class="g" id="bim">Importar respaldo</button><input type="file" id="fim" accept=".json" hidden>
 <button class="d" id="bclr" style="float:right">Borrar todo</button></div>`},
 i(){$('#bsm').onclick=()=>$('#fsm').click();
  $('#fsm').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);
   if(!Array.isArray(a)||!a.every(x=>x.n&&x.g&&x.po!=null&&x.w!=null))throw 0;DB.smae=a;save();loadFoods();toast(a.length+' alimentos importados');render()}catch{toast('JSON no válido: revisa el esquema')}};r.readAsText(e.target.files[0])};
  $('#brs').onclick=()=>{DB.smae=null;save();loadFoods();render();toast('Base incluida restaurada')};
  $('#bex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='nutriclin-respaldo.json';a.click()};
  $('#bim').onclick=()=>$('#fim').click();
  $('#fim').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p)throw 0;DB=d;save();loadFoods();fillSel();setTheme(DB.theme||'light');toast('Respaldo importado');render()}catch{toast('Archivo no válido')}};r.readAsText(e.target.files[0])};
  $('#bclr').onclick=()=>{if(confirm('Se borrarán TODOS los pacientes y consultas. ¿Continuar?')){DB={p:[],sel:null,csel:{},theme:DB.theme,smae:null};save();loadFoods();fillSel();render()}}}};

/* =====================================================================
   8b. EXPEDIENTE COMPLETO: imagen del paciente + módulos del menú
   (Datos generales, Mediciones, Dietas dinámicas, Recordatorio 24H, Clínica,
   Laboratorio, Signos vitales, Archivos clínicos, Entrevista motivacional,
   Actividad física, Cuestionarios, Hábitos, App de seguimiento, Pagos, WhatsApp).
   Todos trabajan sobre el paciente activo (selector de la barra superior).
   ===================================================================== */
const fd=iso=>iso?new Date(iso+'T00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';
const pn=p=>(p.nombre+' '+(p.apellidos||'')).trim();
const csort=p=>[...(p.cons||[])].sort((a,b)=>a.fecha.localeCompare(b.fecha));
const imcOf=c=>num(c.peso)&&num(c.est)?num(c.peso)/(num(c.est)/100)**2:null;

/* ---------- Imagen del paciente: foto, emoji o iniciales con color ---------- */
const AV_COLORS=['#0f766e','#2563eb','#c2410c','#7c3aed','#be185d','#15803d','#b45309','#0e7490'];
const AV_EMOJIS=['🙂','👩','👨','👧','👦','👵','👴','🧑‍⚕️','🏃‍♀️','🏃','🥗','🌟'];
let AVP=null,AVP_FOR;                              // avatar pendiente mientras se edita el formulario
function avHTML(p,size=36,av){
  const a=av===undefined?(p&&p.av):av;let h=0;for(const ch of String((p&&p.id)||'x'))h=(h*31+ch.charCodeAt(0))>>>0;
  const ini=p?((p.nombre||'?')[0]+((p.apellidos||'')[0]||'')).toUpperCase():'?';
  const b=`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;background:${AV_COLORS[h%AV_COLORS.length]}`;
  if(a&&a.type==='photo'&&a.v)return `<span class="av" style="${b}"><img src="${a.v}" alt=""></span>`;
  if(a&&a.type==='emoji'&&a.v)return `<span class="av" style="${b};background:var(--bg);font-size:${Math.round(size*.56)}px">${a.v}</span>`;
  return `<span class="av" style="${b}" aria-hidden="true">${esc(ini)}</span>`;
}
function paintTop(){const e=$('#topav');if(e){const p=cur();e.innerHTML=p?avHTML(p,34):''}}
const avField=p=>`<div style="margin-top:14px"><label>Imagen del paciente</label><div class="gap"><span id="av-prev"></span>
  <label class="g btnlike" for="av-file">Subir foto</label><input id="av-file" type="file" accept="image/*" hidden>
  <button type="button" class="g s" id="av-clear">Quitar</button></div>
  <div class="gap" style="margin-top:6px">${AV_EMOJIS.map(e=>`<button type="button" class="g s" data-emoji="${e}">${e}</button>`).join('')}</div></div>`;
function paintAvPrev(){const b=$('#av-prev');if(!b)return;const p=DB.p.find(x=>x.id===editId)||{id:'new'};
  b.innerHTML=avHTML({id:p.id,nombre:($('#f-nombre')||{}).value||p.nombre||'?',apellidos:($('#f-apellidos')||{}).value||p.apellidos||''},60,AVP)}
function imgURL(file,max,square,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),x=c.getContext('2d');
  if(square){c.width=c.height=max;const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
  res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const _pacI=V.pac.i;
V.pac.i=function(){
  _pacI();
  if(editId===null){AVP_FOR=undefined;return}
  if(AVP_FOR!==editId){AVP=(DB.p.find(x=>x.id===editId)||{}).av||null;AVP_FOR=editId}
  paintAvPrev();
  const f=$('#av-file');if(!f)return;
  f.onchange=e=>{const fl=e.target.files[0];if(fl)imgURL(fl,192,true,.82).then(d=>{AVP={type:'photo',v:d};paintAvPrev()}).catch(()=>toast('No se pudo leer la imagen'))};
  $('#av-clear').onclick=()=>{AVP=null;paintAvPrev()};

function foodOf(k){if(k.startsWith('G|')){const g=k.slice(2),m=GR[g];return m?{id:k,n:'Equivalente de '+g,g,po:'1 equivalente',w:0,kcal:m[0],p:m[1],l:m[2],hc:m[3]}:null}return FOODS.find(x=>x.id===k)}

function eqHTML(c,p,edit){

  cell[f.g][m]=(cell[f.g][m]||0)+n;if(!d.k.startsWith('G|'))fp[f.g][m]=(fp[f.g][m]||0)+n;
  const a=gt[f.g];a.n+=n;a.kcal+=f.kcal*n;a.p+=f.p*n;a.l+=f.l*n;a.hc+=f.hc*n;
  const b=mt[m];b.kcal+=f.kcal*n;b.p+=f.p*n;b.l+=f.l*n;b.hc+=f.hc*n});
 const used=G.filter(g=>gt[g].n>0),T=used.reduce((a,g)=>({n:a.n+gt[g].n,kcal:a.kcal+gt[g].kcal,p:a.p+gt[g].p,l:a.l+gt[g].l,hc:a.hc+gt[g].hc}),{n:0,kcal:0,p:0,l:0,hc:0});
 const e=en(c,p);
 const t1=used.length?`<div class="wrap"><table><tr><th>Grupo de equivalentes<th class="n">Equivalentes/día<th class="n">kcal<th class="n">Prot (g)<th class="n">Lípidos (g)<th class="n">HC (g)<th class="n">% kcal</tr>

  :'<div class="msg">Aún no hay equivalentes. Agrega alimentos desde el catálogo (botón +) o captura equivalentes en el cuadro de distribución.</div>';
 const rows=(edit?G:used),sumRow=(l,k,d)=>`<tr class="h"><td>${l}${M.map(m=>`<td class="n">${fx(mt[m][k],d)}`).join('')}<td class="n">${fx(T[k],d)}`;
 const t2=`<div class="wrap"><table><tr><th>Grupo${M.map(m=>`<th class="n">${m}`).join('')}<th class="n">Total</tr>
  ${rows.map(g=>`<tr><td>${esc(g)}${M.map((m,mi)=>{const v=cell[g][m]||0,hint=fp[g][m]?` title="Incluye ${qn(fp[g][m])} de alimentos específicos del catálogo"`:'';
   return `<td class="n">${edit?`<input type="number" min="0" step="0.5" data-eq="${G.indexOf(g)}|${mi}" value="${v||''}" style="width:64px;text-align:right"${hint}>`:(v?qn(v):'<span style="color:var(--mut)">·</span>')}`}).join('')}<td class="n"><b>${qn(gt[g].n)}</b>`).join('')||'<tr><td colspan="7">Sin equivalentes.'}
  ${sumRow('Energía (kcal)','kcal',0)}${sumRow('Proteínas (g)','p',1)}${sumRow('Lípidos (g)','l',1)}${sumRow('Hidratos de carbono (g)','hc',1)}
  <tr><td>% de la energía del día${M.map(m=>`<td class="n">${T.kcal?fx(mt[m].kcal/T.kcal*100,0)+' %':'—'}`).join('')}<td class="n">${T.kcal?'100 %':'—'}</table></div>`;
 return `<h3 style="margin:0 0 8px">Cuadro de equivalentes</h3>${t1}<h3 style="margin:16px 0 8px">Cuadro de distribución por tiempo de comida</h3>${t2}${edit?'<p class="note">Escribe el número de equivalentes en cada celda (acepta medios) y presiona Enter o sal de la celda: se suman al plan como equivalente genérico. Si ya agregaste alimentos específicos en esa celda, se respetan.</p>':''}`;
}
V.eqdist={t:'Equivalentes y distribución',h(){const p=cur();if(!p)return noP;ensureC(p);const c=curC(),cs=csort(p).reverse();
 return phead(p)+`<div class="card"><div class="grid" style="align-items:end"><div><label for="eqc">Consulta</label><select id="eqc">${cs.map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${fd(x.fecha)}</option>`).join('')}</select></div>
  <div><button data-x="edit">Editar en Consulta</button></div></div></div><div class="card">${eqHTML(c,p,false)}</div>`},
 i(){const p=cur();if(!p)return;$('#eqc').onchange=e=>{DB.csel[p.id]=e.target.value;save();render()};
  $('#view').onclick=e=>{if(e.target.closest('[data-x]')){location.hash='cons';setTimeout(()=>{const t=$('#eqt');t&&t.scrollIntoView({behavior:'smooth'})},120)}}}};

function fillSel(){paintTop();const s=$('#psel');s.innerHTML='<option value="">— Sin paciente —</option>'+DB.p.map(p=>`<option value="${p.id}"${p.id===DB.sel?' selected':''}>${esc(p.nombre+' '+p.apellidos)}</option>`).join('')}
$('#psel').onchange=e=>{DB.sel=e.target.value||null;save();paintTop();render()};
function render(){const id=(location.hash||'#panel').slice(1),v=V[id]||V.panel;
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===(V[id]?id:'panel')));
 const w=$('#view');w.oninput=w.onchange=w.onclick=null;$('#title').textContent=v.t;w.innerHTML=v.h();v.i&&v.i()}
window.addEventListener('hashchange',()=>{editId=null;render()});
fillSel();render();
