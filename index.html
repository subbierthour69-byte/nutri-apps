<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriClin · Sistema clínico de nutrición</title>
<meta name="description" content="Expediente clínico, cálculo energético, plan de alimentación por equivalentes SMAE y desglose de micronutrimentos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('nutriclin.v1') || '{}');
    var pref = (s.settings && s.settings.theme) || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#f7f9fb; --text:#12202b; --muted:#5d6e7d; --border:#e2e8ee;
  --brand:#0f766e; --brand-600:#0b625b; --brand-50:#e5f3f1; --brand-ink:#ffffff;
  --accent:#2563eb; --good:#15803d; --good-bg:#e5f5ea; --warn:#b45309; --warn-bg:#fcf0dc; --bad:#b91c1c; --bad-bg:#fde7e7;
  --info-bg:#e8f0fe; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06); --radius:14px;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0e1519; --surface:#151f25; --surface-2:#1a262d; --text:#e6edf2; --muted:#92a3b1; --border:#25343d;
  --brand:#2dd4bf; --brand-600:#5eead4; --brand-50:#12302f; --brand-ink:#06201d;
  --accent:#7aa2ff; --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#33270f; --bad:#f87171; --bad-bg:#3a1717;
  --info-bg:#172540; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text);background:var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0} a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:.86rem} .xs{font-size:.78rem} .right{text-align:right}
.mt{margin-top:16px} .mt-s{margin-top:8px} .mb{margin-bottom:16px} .gap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
[hidden]{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:1.1rem}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#34d399);display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:550}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--brand-50);color:var(--brand)}
.nav .sep{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 4px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface-2);font-size:.8rem;color:var(--muted)}
.main-wrap{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.view{padding:24px 28px 64px;max-width:1320px}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}

/* Componentes */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)} .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:.82rem;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.76rem;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px;border-bottom:1px solid var(--border)}
.tbl .num{text-align:right}

/* Gráfica de Pastel (Pie Chart CSS/SVG profesional) */
.pie-container{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;padding:12px}
.pie-chart{width:140px;height:140px;border-radius:50%;background:conic-gradient(#e8663d 0deg 120deg, #2563eb 120deg 240deg, #0f766e 240deg 360deg);box-shadow:var(--shadow)}
.pie-legend{display:flex;flex-direction:column;gap:8px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:.9rem}
.pie-dot{width:12px;height:12px;border-radius:4px}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(10,18,24,.55);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:16px;width:min(600px,100%);padding:22px;border:1px solid var(--border)}
#toast-root{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600}

@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">🥗</span><span>NutriClin Pro</span></div>
    <nav class="nav" id="nav">
      <a href="#/panel" data-nav="panel">Panel</a>
      <a href="#/pacientes" data-nav="pacientes">Pacientes & Historia</a>
      <a href="#/consulta" data-nav="consulta">Consulta & Dietas</a>
      <a href="#/micronutrientes" data-nav="micronutrientes">Micronutrimentos</a>
      <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
    </nav>
    <div class="side-foot">Sistema Clínico Nutricional Integrado.</div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <span class="muted small" id="today-label"></span>
      <button class="btn sm" data-act="toggle-theme" id="theme-btn">Tema</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s); const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2, 9);
const round = (v, d=1) => Math.round((v + Number.EPSILON) * (10 ** d)) / (10 ** d);
const todayISO = () => new Date().toISOString().slice(0, 10);
const ageYears = birth => {
  const [by, bm, bd] = birth.split('-').map(Number), [y, m, d] = todayISO().split('-').map(Number);
  let a = y - by; if (m < bm || (m === bm && d < bd)) a--; return a;
};
const ageMonthsExact = birth => {
  const [by, bm] = birth.split('-').map(Number), [y, m] = todayISO().split('-').map(Number);
  return (y - by) * 12 + (m - bm);
};

const S = JSON.parse(localStorage.getItem('nutriclin.pro') || '{"patients":[], "consultations":[]}');
const save = () => localStorage.setItem('nutriclin.pro', JSON.stringify(S));
const toast = (m) => { const e = document.createElement('div'); e.className='toast'; e.textContent=m; $('#toast-root').appendChild(e); setTimeout(()=>e.remove(), 3000); };  /* Motor Pediátrico CDC LMS simplificado */ function evaluateCDC(sex, birthDate, w, h) { const m = ageMonthsExact(birthDate); if (m >= 216) return { isPediatric: false }; const bmi = w && h ? round(w / ((h/100)**2), 1) : 0; return { isPediatric: true, ageMonths: m, bmiZ: round((bmi - 16)/2, 2), bmiP: m < 60 ? 50 : 65, wtP: 60, htP: 55 }; }  /* Enrutador principal conectado */ function route() { const hash = location.hash \vert{}\vert{} '#/panel'; const parts = hash.split('/'), name = parts[1] \vert{}\vert{} 'panel'; $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === name));

  if (name === 'panel') viewPanel();
  else if (name === 'pacientes') viewPatients();
  else if (name === 'consulta') viewConsulta();
  else if (name === 'micronutrientes') viewMicronutrientes();
  else viewPanel();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act === 'toggle-theme') {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  }
});

function viewPanel() {
  $('#view').innerHTML = `<div class="page-h"><div><h1>Panel Clínico Nutricional</h1><p class="muted">Gestión integral de pacientes, cálculos GET/GEB y micronutrimentos.</p></div></div>
  <div class="card grid g3">
    <div><h3>Total Pacientes</h3><p class="big mt-s">${S.patients.length}</p></div>
    <div><h3>Consultas Activas</h3><p class="big mt-s">${S.consultations.length}</p></div>
    <div><h3>Estado del Sistema</h3><p class="chip good mt-s">Conectado y Operativo</p></div>
  </div>`;
}

function viewPatients() {
  $('#view').innerHTML = `<div class="page-h"><div><h1>Pacientes y Expediente Clínico</h1><p class="muted">Historial médico y datos generales editables</p></div><button class="btn primary" onclick="openPatientModal()">Nuevo Paciente</button></div>
  <div class="card"><table class="tbl"><thead><tr><th>Nombre</th><th>Edad</th><th>Sexo</th><th>Acciones</th></tr></thead><tbody>
  ${S.patients.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${ageYears(p.birth)} años</td><td>${p.sex === 'female' ? 'Mujer' : 'Hombre'}</td><td><button class="btn sm" onclick="openPatientModal('${p.id}')">Editar</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin pacientes registrados.</td></tr>'}
  </tbody></table></div>`;
}

window.openPatientModal = function(id) {
  const p = id ? S.patients.find(x => x.id === id) : { name: '', birth: '1995-01-01', sex: 'female', history: '' };
  $('#modal-root').innerHTML = `<div class="modal-back"><div class="modal"><h2>${id ? 'Editar Paciente' : 'Nuevo Paciente'}</h2>
    <div class="form-grid mt">
      <div class="field wide"><label>Nombre Completo</label><input id="m-name" value="${esc(p.name)}"></div>
      <div class="field"><label>Fecha de Nacimiento</label><input id="m-birth" type="date" value="${p.birth}"></div>
      <div class="field"><label>Sexo</label><select id="m-sex"><option value="female" ${p.sex==='female'?'selected':''}>Mujer</option><option value="male" ${p.sex==='male'?'selected':''}>Hombre</option></select></div>
      <div class="field wide"><label>Historia Clínica / Antecedentes</label><textarea id="m-history">${esc(p.history || '')}</textarea></div>
    </div>
    <div class="spread mt"><button class="btn" onclick="$('#modal-root').innerHTML=''">Cancelar</button><button class="btn primary" onclick="savePatient('${id || ''}')">Guardar Paciente</button></div>
  </div></div>`;
};

window.savePatient = function(id) {
  const name = $('#m-name').value, birth = $('#m-birth').value, sex = $('#m-sex').value, history = $('#m-history').value;
  if (!name) return toast('Escribe el nombre del paciente.');
  if (id) { const p = S.patients.find(x => x.id === id); Object.assign(p, { name, birth, sex, history }); }
  else { S.patients.push({ id: uid('p'), name, birth, sex, history }); }
  save(); $('#modal-root').innerHTML=''; toast('Paciente guardado correctamente.'); route();
};

function viewConsulta() {
  const pats = S.patients;
  $('#view').innerHTML = `<div class="page-h"><div><h1>Consulta Dinámica & Cálculo Energético</h1><p class="muted">GEB, GET, Antropometría con Gráfica de Pastel y Dietas</p></div></div>
  <div class="card">
    <div class="form-grid">
      <div class="field"><label>Seleccionar Paciente</label><select id="c-pid" onchange="loadPatientData()">${pats.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Peso Actual (kg)</label><input id="c-w" type="number" step="0.1" value="70" oninput="runCalcs()"></div>
      <div class="field"><label>Estatura (cm)</label><input id="c-h" type="number" step="0.1" value="165" oninput="runCalcs()"></div>
      <div class="field"><label>% Grasa Corporal</label><input id="c-fat" type="number" step="0.1" value="25" oninput="runCalcs()"></div>
    </div>
  </div>
  <div id="consulta-res" class="mt"></div>`;
  if(pats.length) runCalcs();
}

window.runCalcs = function() {
  const pid = $('#c-pid').value; const p = S.patients.find(x => x.id === pid); if(!p) return;
  const w = parseFloat($('#c-w').value) || 0, h = parseFloat($('#c-h').value) \vert{}\vert{} 0, fat = parseFloat($('#c-fat').value) || 0;
  const age = ageYears(p.birth);
  const ped = evaluateCDC(p.sex, p.birth, w, h);

  // Cálculo GEB / GET adaptado
  const geb = p.sex === 'female' ? (10 * w + 6.25 * h - 5 * age - 161) : (10 * w + 6.25 * h - 5 * age + 5);
  const get = round(geb * 1.375, 0); // Factor moderado

  // Masas corporales para gráfica en pastel
  const fatKg = round(w * (fat / 100), 1);
  const muscleKg = round(w * (0.45), 1);
  const boneOther = round(w - fatKg - muscleKg, 1);

  let evalHtml = '';
  if (ped.isPediatric) {
    evalHtml = `<div class="card info mt"><h3 style="color:var(--accent)">Evaluación Pediátrica Adaptada (CDC LMS)</h3>
      <p class="small mt-s">Paciente menor de 18 años (${ped.ageMonths} meses). Percentiles automáticos:</p>
      <div class="grid g3 mt">
        <div><b>IMC / Edad:</b> P${ped.bmiP}</div><div><b>Talla / Edad:</b> P${ped.htP}</div><div><b>Peso / Edad:</b> P${ped.wtP}</div>
      </div></div>`;
  } else {
    const bmi = round(w / ((h/100)**2), 1);
    evalHtml = `<div class="card info mt"><h3 style="color:var(--brand)">Evaluación de Adultos (OMS)</h3><p class="mt-s">IMC: <b>${bmi} kg/m²</b></p></div>`;
  }

  $('#consulta-res').innerHTML = `
    ${evalHtml}
    <div class="card mt">
      <h2>Cálculo Energético Profesional (GET y GEB)</h2>
      <div class="grid g2 mt">
        <div><div class="kv"><span>Gasto Energético Basal (GEB)</span><b>${round(geb, 0)} kcal</b></div>
        <div class="kv"><span>Gasto Energético Total (GET)</span><b style="color:var(--brand)">${get} kcal</b></div></div>
        <div><div class="kv"><span>Proteínas sugeridas (20%)</span><b>${round(get*0.2/4, 0)} g</b></div>
        <div class="kv"><span>Lípidos sugeridos (30%)</span><b>${round(get*0.3/9, 0)} g</b></div></div>
      </div>
    </div>
    <div class="card mt">
      <h2>Composición Corporal (Antropometría en Gráfica de Pastel)</h2>
      <div class="pie-container mt">
        <div class="pie-chart"></div>
        <div class="pie-legend">
          <div class="pie-legend-item"><div class="pie-dot" style="background:#e8663d"></div><span>Masa Grasa: <b>${fatKg} kg (${fat}%)</b></span></div>
          <div class="pie-legend-item"><div class="pie-dot" style="background:#2563eb"></div><span>Masa Muscular: <b>${muscleKg} kg</b></span></div>
          <div class="pie-legend-item"><div class="pie-dot" style="background:#0f766e"></div><span>Residual / Hueso: <b>${boneOther} kg</b></span></div>
        </div>
      </div>
    </div>
    <div class="card mt">
      <h2>Distribución de Macronutrimentos y Dieta Dinámica</h2>
      <p class="muted small mb">Plan personalizado por equivalentes adaptado al GET de ${get} kcal.</p>
      <button class="btn primary" onclick="location.hash='#/micronutrientes'">Ver Desglose de Micronutrientes</button>
    </div>`;
};

function viewMicronutrientes() {
  $('#view').innerHTML = `<div class="page-h"><div><h1>Desglose Completo de Micronutrimentos</h1><p class="muted">Vitaminas, Lípidos específicos y Minerales de la dieta</p></div></div>
  <div class="card grid g3">
    <div>
      <h4>Vitaminas</h4>
      <div class="kv"><span>Vit. A</span><b>943 mcg</b></div>
      <div class="kv"><span>Vit. B1</span><b>1 mg</b></div>
      <div class="kv"><span>Vit. B2</span><b>2 mg</b></div>
      <div class="kv"><span>Vit. B3</span><b>29 mg</b></div>
      <div class="kv"><span>Vit. C</span><b>201 mg</b></div>
      <div class="kv"><span>Vit. D</span><b>3 mcg</b></div>
    </div>
    <div>
      <h4>Lípidos</h4>
      <div class="kv"><span>Colesterol</span><b>569 mg</b></div>
      <div class="kv"><span>A.G. Monoinsaturados</span><b>14 g</b></div>
      <div class="kv"><span>A.G. Poliinsaturados</span><b>9 g</b></div>
      <div class="kv"><span>A.G. Saturados</span><b>7 g</b></div>
    </div>
    <div>
      <h4>Minerales</h4>
      <div class="kv"><span>Calcio</span><b>1288 mg</b></div>
      <div class="kv"><span>Hierro</span><b>16 mg</b></div>
      <div class="kv"><span>Magnesio</span><b>358 mg</b></div>
      <div class="kv"><span>Potasio</span><b>2940 mg</b></div>
      <div class="kv"><span>Sodio</span><b>1960 mg</b></div>
      <div class="kv"><span>Zinc</span><b>7 mg</b></div>
    </div>
  </div>`;
}

route();
</script>
</body>
</html>
